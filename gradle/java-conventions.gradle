// Generic JVM build conventions shared by Java/Kotlin projects. Holds no
// knowledge of any consumer - it only standardises the language target, the
// test stack, and coverage so each consumer does not re-declare them.
// Applied by path (apply from:) rather than as a published plugin, on the
// assumption that consumers are checked out as siblings under the same
// parent directory, so a relative path is the lowest-ceremony single source
// of truth.
//
// A consumer that needs more (extra classpath, version derivation, custom
// artifact location) applies this script first and then adds its own layer
// on top; this file never reaches downward to know what that layer is.

apply plugin: 'java'
apply plugin: 'jacoco'
apply plugin: 'checkstyle'

// One line per build naming the toolchain it actually ran on, so a log read
// after the fact says which it was rather than leaving it to be inferred.
//
// Gradle's version comes from the wrapper, so it is pinned rather than found -
// printed anyway because a wrapper bump is otherwise visible only in the URLs
// inside deprecation notices, which a green build does not emit. The JVM IS
// discovered: a consumer whose CI skips setup-java builds on whatever JDK the
// machine happens to have, and that is the half most likely to differ between
// a workstation and a runner.
//
// Configuration time, so it prints for any invocation rather than only for the
// tasks that happen to run.
logger.lifecycle("Toolchain: Gradle ${gradle.gradleVersion}, "
    + "JVM ${System.getProperty('java.version')} "
    + "(${System.getProperty('java.vendor')})")

repositories {
    mavenCentral()
}

// The import blocks a project sorts into, for a consumer that names none of its
// own. Everything it compiles against in one block, the JDK last: the ordering
// every Java project agrees on, and the only part of the question a repo that
// knows nothing about its consumers can answer. A layer that does know - the
// Starsector conventions, for the mods - assigns the real list over this, and a
// default is set rather than left empty because checkstyle fails on a property
// its config names and nothing supplies.
def defaultImportGroups = '*,java'

checkstyle {
    toolVersion = '10.20.1'
    // Resolve the shared config relative to THIS script's own location, not the
    // consumer's rootDir: that holds for sibling mods and for the in-repo
    // ci-smoke child alike, since checkstyle.xml is always this file's sibling.
    configFile = new File(buildscript.sourceFile.parentFile, 'checkstyle.xml')
    // The config marks violations as errors; surface them as build failures
    // rather than a tolerated warning count.
    ignoreFailures = false
    maxWarnings = 0
    // Static imports sort into the same blocks as the rest, so both properties
    // carry one list: two lists would let a project's static imports fall into
    // blocks its plain ones do not have.
    configProperties = [
        importGroups: defaultImportGroups,
        staticImportGroups: defaultImportGroups,
    ]
}

// One decision for the whole family: the JUnit 5 + AssertJ + Mockito stack,
// pinned in exactly one place. Named rather than spelt at each use, since the
// same versions are needed twice here - once for a project's own suite and once
// for the fixtures variant below - and a second pinning is a second thing to
// bump.
//
// Mockito 5+ defaults to the inline mock-maker, which can stub static and final
// methods, the common case when isolating code from hard-to-construct framework
// types.
def testStackCoordinates = [
    junitBom: 'org.junit:junit-bom:5.13.1',
    junitJupiter: 'org.junit.jupiter:junit-jupiter',
    junitPlatformLauncher: 'org.junit.platform:junit-platform-launcher',
    assertj: 'org.assertj:assertj-core:3.27.7',
    mockito: 'org.mockito:mockito-core:5.18.0',
]

dependencies {
    testImplementation platform(testStackCoordinates.junitBom)
    testImplementation testStackCoordinates.junitJupiter
    testImplementation testStackCoordinates.assertj
    testImplementation testStackCoordinates.mockito
    testRuntimeOnly testStackCoordinates.junitPlatformLauncher
}

// A project publishing test fixtures builds them against the same stack its own
// tests run on, so a fixture and the suite standing on it cannot be written
// against two different assertion or mocking libraries.
//
// Guarded on the plugin rather than applied outright: a project with nothing to
// share declares no fixtures source set, and configurations that do not exist
// cannot be populated. Mockito is internal to the fixtures rather than exposed,
// since every consumer of a fixture is a test and already has the stack above.
plugins.withId('java-test-fixtures') {
    dependencies {
        testFixturesImplementation platform(testStackCoordinates.junitBom)
        testFixturesImplementation testStackCoordinates.assertj
        testFixturesImplementation testStackCoordinates.mockito
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // Java 17 is the baseline target. A consumer that wants a newer release
    // can override this in its own build script.
    options.release = 17
}

// Every Test task in a build reports the same two things at the end of its run, so the
// listener is a helper a task takes rather than a block each task copies: a task registered
// beside 'test' - a TestKit tree, say - would otherwise print its failures only where they
// happened and re-list nothing, which is the one place a reader of a long CI log needs them.
ext.reportTestOutcomesOf = { Test testTask ->

    // Surface the slowest tests on every run so a creeping suite runtime is
    // visible instead of hiding in the aggregate, and re-list the failures at
    // the end: the inline FAILED lines print where each test happens to run,
    // which on a suite of thousands leaves them scattered far above the point a
    // log reader starts from. Each test's wall-clock time and failure is
    // recorded as it finishes; forks may run in parallel, so the stores must be
    // thread-safe. The two hooks live on a TestListener - the task's own
    // afterTest/afterSuite closures are removed in Gradle 10.
    def recordedTestDurations = java.util.Collections.synchronizedList(new ArrayList())
    def recordedTestFailures = java.util.Collections.synchronizedList(new ArrayList())

    // How much of each failure is re-listed. A run that dies on its environment - a runner
    // with no fonts, a missing native library - fails every test it has with one fault, so an
    // uncapped detail block buries the rest of the log under copies of a single trace. The
    // frame cap keeps the head of each throwable, which is where the call that failed sits,
    // while the cause chain is walked to its end: the line that names the real fault is the
    // last "Caused by", and cutting the tail would throw away the only part worth reading.
    def maxDetailedFailures = 10
    def maxFramesPerThrowable = 12

    testTask.addTestListener(new TestListener() {

        void beforeSuite(TestDescriptor suite) {}
        void beforeTest(TestDescriptor test) {}
        void afterTest(TestDescriptor descriptor, TestResult result) {

            def testName = "${descriptor.className}.${descriptor.name}"

            recordedTestDurations << [
                name: testName,
                durationMillis: result.endTime - result.startTime]

            if (result.resultType != TestResult.ResultType.FAILURE) {
                return
            }

            // The first exception: a test that fails its teardown as well reports several, and
            // the one that made it fail is the one worth re-listing. Read through
            // getExceptions() rather than getException(), which throws when a failure carries
            // none. Described here rather than at report time because the throwable belongs to
            // the result being handed over, not to anything this listener keeps.
            def firstException = result.exceptions.isEmpty() ? null : result.exceptions.first()

            recordedTestFailures << [
                name: testName,
                trace: firstException == null
                    ? ['(no exception recorded)']
                    : describeFailure(firstException)]
        }

        // Report at the root suite (the one with no parent), which fires once
        // the entire run completes - including failing runs, unlike a doLast
        // action a test failure would skip.
        void afterSuite(TestDescriptor descriptor, TestResult result) {

            if (descriptor.parent != null) {
                return
            }

            reportLongestTests()
            // Last, so the failures sit directly above Gradle's own "there were
            // failing tests" message rather than behind the timings block.
            reportFailedTests()
        }

        private void reportLongestTests() {

            if (recordedTestDurations.isEmpty()) {
                return
            }

            logger.lifecycle('Top 10 longest tests:')

            recordedTestDurations
                .sort { -it.durationMillis }
                .take(10)
                .eachWithIndex {
                    entry,
                    index ->
                        logger.lifecycle(String.format(
                            '%2d. %6d ms  %s',
                            index + 1,
                            entry.durationMillis,
                            entry.name))
                }
        }

        // The names on their own first, the traces after. The names are what a reader scans to
        // see WHAT broke, and a trace between every pair of them puts the last name a screen
        // and a half below the first - which is the scattering this whole block exists to undo.
        private void reportFailedTests() {

            if (recordedTestFailures.isEmpty()) {
                return
            }

            logger.lifecycle("Failed tests (${recordedTestFailures.size()}):")

            recordedTestFailures.eachWithIndex {
                entry,
                index ->
                    logger.lifecycle(String.format('%2d. %s', index + 1, entry.name))
            }

            reportFailureDetails()
        }

        // Why each one broke, in the same order and under the same numbers, so a name picked
        // out of the list above is looked up rather than searched for.
        private void reportFailureDetails() {

            logger.lifecycle('')
            logger.lifecycle('Failure details:')

            recordedTestFailures.take(maxDetailedFailures).eachWithIndex {
                entry,
                index ->
                    logger.lifecycle(String.format('%2d. %s', index + 1, entry.name))
                    entry.trace.each { line -> logger.lifecycle('    ' + line) }
            }

            def undetailed = recordedTestFailures.size() - maxDetailedFailures

            if (undetailed > 0) {
                logger.lifecycle("    ... and ${undetailed} more, in the HTML test report")
            }
        }

        // One throwable as the lines a reader needs: every link of the cause chain, each headed
        // the way a printed trace heads it, carrying the frames nearest its own throw.
        //
        // An assertion library puts its detail on the lines AFTER the header one - "expected: 2
        // / but was: 1" - so a header is split and indented as the several lines it is rather
        // than quoted as one. The chain is followed by identity so that a throwable naming
        // itself as its own cause cannot loop.
        private List<String> describeFailure(Throwable failure) {

            def lines = []
            def described = []
            def link = failure

            while (link != null && !described.any { it.is(link) }) {

                described << link

                def header = described.size() == 1 ? link.toString() : 'Caused by: ' + link
                def frames = link.stackTrace

                header.readLines().each { line -> lines << line }
                frames.take(maxFramesPerThrowable).each { frame -> lines << '    at ' + frame }

                if (frames.length > maxFramesPerThrowable) {
                    lines << "    ... ${frames.length - maxFramesPerThrowable} more frames"
                }

                link = link.cause
            }

            return lines
        }
    })
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        // The per-test FAILED line is only useful with the assertion behind it,
        // and a truncated trace hides the frame inside the code under test.
        exceptionFormat = 'full'
    }

    reportTestOutcomesOf(it)

    finalizedBy jacocoTestReport
}

jacoco {
    toolVersion = '0.8.13'
}

jacocoTestReport {
    dependsOn test

    reports {
        html.required = true
        xml.required = true
        csv.required = true
    }
}

// Single entry point for "run tests and produce coverage", so CI and local
// runs invoke the same task name across every repo.
tasks.register('coverage') {
    
    group = 'verification'
    description = 'Runs tests and generates JaCoCo coverage reports.'
    dependsOn test, jacocoTestReport
}

// Lint gates: generic code-quality, doc and test-structure checks no plain
// build catches (blank-line runs, magic numbers on Kotlin, test-method and
// test-double naming,
// test vocabulary in production sources, method-visibility ordering, package
// layering and vocabulary, nested test structure, broken doc links). Applied
// here so every consumer inherits them from one place, alongside checkstyle.
// Resolved relative to THIS script's own gradle/ dir, the
// same sibling-checkout convention checkstyle.xml uses. Magic numbers on Java
// ride in checkstyle.xml above rather than as a separate gate.
def lintTasksDir = new File(buildscript.sourceFile.parentFile, 'tasks/lint')

apply from: new File(lintTasksDir, 'docs/enforce-doc-links-resolve.gradle')
apply from: new File(lintTasksDir, 'formatting/enforce-no-trailing-whitespace.gradle')
apply from: new File(lintTasksDir, 'formatting/enforce-single-blank-lines.gradle')
apply from: new File(lintTasksDir, 'literals/enforce-no-magic-literals-kotlin.gradle')
apply from: new File(lintTasksDir, 'naming/enforce-id-casing.gradle')
apply from: new File(lintTasksDir, 'naming/enforce-no-test-vocabulary.gradle')
apply from: new File(lintTasksDir, 'naming/tests/enforce-camel-case-test-names.gradle')
apply from: new File(lintTasksDir, 'naming/tests/enforce-suffix-on-fakes.gradle')
apply from: new File(lintTasksDir, 'naming/tests/enforce-suffix-on-mocks.gradle')
apply from: new File(lintTasksDir, 'structure/enforce-methods-ordered-by-visibility.gradle')
apply from: new File(lintTasksDir, 'structure/enforce-package-layering.gradle')
apply from: new File(lintTasksDir, 'structure/enforce-package-vocabulary.gradle')
apply from: new File(lintTasksDir, 'structure/enforce-referenced-types.gradle')
apply from: new File(lintTasksDir, 'structure/enforce-restricted-calls.gradle')
apply from: new File(lintTasksDir, 'structure/tests/enforce-tests-nested.gradle')
