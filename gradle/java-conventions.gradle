// Generic JVM build conventions shared by Java/Kotlin projects. Holds no
// knowledge of any consumer - it only standardises the language target, the
// test stack, and coverage so each consumer does not re-declare them.
// Applied by path (apply from:) rather than as a published plugin, on the
// assumption that consumers are checked out as siblings under the same
// parent directory, so a relative path is the lowest-ceremony single source
// of truth.
//
// A consumer that needs more (extra classpath, version derivation, custom
// artifact location) applies this script first and then adds its own layer
// on top; this file never reaches downward to know what that layer is.

apply plugin: 'java'
apply plugin: 'jacoco'
apply plugin: 'checkstyle'

// A line naming the toolchain the build actually ran on, so a log read after the
// fact says which it was rather than leaving it to be inferred.
//
// Gradle's version comes from the wrapper, so it is pinned rather than found -
// printed anyway because a wrapper bump is otherwise visible only in the URLs
// inside deprecation notices, which a green build does not emit. The JVM IS
// discovered: a consumer whose CI skips setup-java builds on whatever JDK the
// machine happens to have, and that is the half most likely to differ between
// a workstation and a runner.
//
// Printed while the project is configured, so whatever tasks run: once per
// project applying this script, and not at all on a configuration-cache hit.
logger.lifecycle("Toolchain: Gradle ${gradle.gradleVersion}, " +
    "JVM ${System.getProperty('java.version')} " +
    "(${System.getProperty('java.vendor')})")

repositories {
    mavenCentral()
}

// The import blocks a project sorts into, for a consumer that names none of its
// own. Everything it compiles against in one block, the JDK last: the ordering
// every Java project agrees on, and the only part of the question a repo that
// knows nothing about its consumers can answer. A consumer's own layer, which
// does know, assigns the real list over this, and a
// default is set rather than left empty because checkstyle fails on a property
// its config names and nothing supplies.
def defaultImportGroups = '*,java'

checkstyle {
    toolVersion = '10.20.1'
    // Resolve the shared config relative to THIS script's own location, not the
    // consumer's rootDir: that holds for sibling consumers and for the in-repo
    // ci-smoke child alike, since checkstyle.xml is always this file's sibling.
    configFile = new File(buildscript.sourceFile.parentFile, 'checkstyle.xml')
    // The config marks violations as errors; surface them as build failures
    // rather than a tolerated warning count.
    ignoreFailures = false
    maxWarnings = 0
    // Static imports sort into the same blocks as the rest, so both properties
    // carry one list: two lists would let a project's static imports fall into
    // blocks its plain ones do not have.
    configProperties = [
        importGroups: defaultImportGroups,
        staticImportGroups: defaultImportGroups,
    ]
}

// One decision for the whole family: the JUnit 5 + AssertJ + Mockito stack,
// pinned in exactly one place. Named rather than spelt at each use, since the
// same versions are needed twice here - once for a project's own suite and once
// for the fixtures variant below - and a second pinning is a second thing to
// bump.
//
// Mockito 5+ defaults to the inline mock-maker, which can stub static and final
// methods, the common case when isolating code from hard-to-construct framework
// types.
def testStackCoordinates = [
    junitBom: 'org.junit:junit-bom:5.13.1',
    junitJupiter: 'org.junit.jupiter:junit-jupiter',
    junitPlatformLauncher: 'org.junit.platform:junit-platform-launcher',
    assertj: 'org.assertj:assertj-core:3.27.7',
    mockito: 'org.mockito:mockito-core:5.18.0',
]

dependencies {
    testImplementation platform(testStackCoordinates.junitBom)
    testImplementation testStackCoordinates.junitJupiter
    testImplementation testStackCoordinates.assertj
    testImplementation testStackCoordinates.mockito
    testRuntimeOnly testStackCoordinates.junitPlatformLauncher
}

// A project publishing test fixtures builds them against the same stack its own
// tests run on, so a fixture and the suite standing on it cannot be written
// against two different assertion or mocking libraries.
//
// Guarded on the plugin rather than applied outright: a project with nothing to
// share declares no fixtures source set, and configurations that do not exist
// cannot be populated. Mockito is internal to the fixtures rather than exposed,
// since every consumer of a fixture is a test and already has the stack above.
plugins.withId('java-test-fixtures') {
    dependencies {
        testFixturesImplementation platform(testStackCoordinates.junitBom)
        testFixturesImplementation testStackCoordinates.assertj
        testFixturesImplementation testStackCoordinates.mockito
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // Java 17 is the baseline target. A consumer that wants a newer release
    // can override this in its own build script.
    options.release = 17
}

// Every Test task in a build ends its run with the same report; see the script.
apply from: new File(
    buildscript.sourceFile.parentFile,
    'tasks/diagnostics/report-test-outcomes.gradle')

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        // The per-test FAILED line is only useful with the assertion behind it,
        // and a truncated trace hides the frame inside the code under test.
        exceptionFormat = 'full'
    }

    reportTestOutcomesOf(it)

    finalizedBy jacocoTestReport
}

jacoco {
    toolVersion = '0.8.13'
}

jacocoTestReport {
    // The report reads what the test run recorded, so asking for it runs the tests.
    dependsOn test

    reports {
        html.required = true
        xml.required = true
        csv.required = true
    }
}

// Published test fixtures are code a project ships to its consumers' suites, so
// they are measured like the main sources rather than left out of every figure.
// Guarded on the plugin, as the fixtures' dependencies above are.
plugins.withId('java-test-fixtures') {
    jacocoTestReport {
        sourceSets sourceSets.testFixtures
    }
}

// Single entry point for "run tests and produce coverage", so CI and local
// runs invoke the same task name across every repo.
tasks.register('coverage') {

    group = 'verification'
    description = 'Runs tests and generates JaCoCo coverage reports.'
    dependsOn jacocoTestReport
}

// Lint gates: the code-quality, doc and test-structure checks no plain build
// catches, one script each under tasks/lint. Applied here so every consumer
// inherits them from one place, alongside checkstyle; magic numbers on Java ride
// in checkstyle.xml rather than as a gate. Resolved relative to THIS script's own
// gradle/ dir, the same sibling-checkout convention checkstyle.xml uses.
def lintTasksDir = new File(buildscript.sourceFile.parentFile, 'tasks/lint')

// Not a gate but a report about the machine, so it is applied beside them
// rather than among them: it joins no lifecycle task until a consumer declares
// that its suites need fonts, and then it runs ahead of that project's tests.
// Inherited by everyone because any build can end up on a runner whose graphics
// stack is a mystery, and the answer is worth one command rather than a
// bisection.
apply from: new File(
    buildscript.sourceFile.parentFile,
    'tasks/diagnostics/report-awt-environment.gradle')

apply from: new File(lintTasksDir, 'docs/enforce-doc-links-resolve.gradle')
apply from: new File(lintTasksDir, 'formatting/enforce-no-trailing-whitespace.gradle')
apply from: new File(lintTasksDir, 'formatting/enforce-single-blank-lines.gradle')
apply from: new File(lintTasksDir, 'literals/enforce-no-magic-literals-kotlin.gradle')
apply from: new File(lintTasksDir, 'naming/enforce-id-casing.gradle')
apply from: new File(lintTasksDir, 'naming/enforce-no-test-vocabulary.gradle')
apply from: new File(lintTasksDir, 'naming/tests/enforce-camel-case-test-names.gradle')
apply from: new File(lintTasksDir, 'naming/tests/enforce-suffix-on-fakes.gradle')
apply from: new File(lintTasksDir, 'naming/tests/enforce-suffix-on-mocks.gradle')
apply from: new File(lintTasksDir, 'naming/tests/enforce-suffix-on-suites.gradle')
apply from: new File(lintTasksDir, 'naming/tests/enforce-test-names-omit-group.gradle')
apply from: new File(lintTasksDir, 'structure/enforce-methods-ordered-by-visibility.gradle')
apply from: new File(lintTasksDir, 'structure/enforce-package-layering.gradle')
apply from: new File(lintTasksDir, 'structure/enforce-package-vocabulary.gradle')
apply from: new File(lintTasksDir, 'structure/enforce-referenced-types.gradle')
apply from: new File(lintTasksDir, 'structure/enforce-restricted-calls.gradle')
apply from: new File(lintTasksDir, 'structure/tests/enforce-tests-nested.gradle')
