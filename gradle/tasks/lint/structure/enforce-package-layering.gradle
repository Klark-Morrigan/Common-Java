// Package-layering gate: a package declared closed to a layer may not import it, in any source set.
// The compiler accepts an import in either direction, so one stray import inverts a dependency
// arrow while the build stays green.
//
// The closed side comes in two widths. 'under' closes a root and everything beneath it, less any
// subtrees named in 'except'. 'exactly' closes that one package and leaves its subpackages free,
// which is the shape a package needs when its own subpackages are what it is closed to.
//
// The imported side ('of') is one layer or a list. A layer is a root, or a map with the closed
// side's 'under' and 'except'. The map is how a subtree is closed to the rest of its parent
// without being closed to itself:
//
//     enforcePackageLayering {
//         forbidImport under: 'example.framework.kinds',
//             of: ['example.feature',
//                  [under: 'example.framework', except: 'example.framework.kinds']]
//     }

apply from: new File(buildscript.sourceFile.parentFile, '../lint-gate.gradle')
apply from: new File(buildscript.sourceFile.parentFile, '../package-roots.gradle')
apply from: new File(buildscript.sourceFile.parentFile, '../source-scan.gradle')

// An import, static or not, aliased or not. The captured name stops before Java's ';' and Kotlin's
// 'as Alias', and keeps an on-demand import's star, which still reads as being under its package.
def importDeclarationPattern = ~/^\s*import\s+(?:static\s+)?([\w.*]+)/

// Answers whether a file in this package is held to the edge.
def isClosedByEdge = { String declaredPackage, Map edge ->

    return edge.isClosedExactly
        ? declaredPackage == edge.closedRoot
        : isInsideLayer(declaredPackage, edge.closedRoot, edge.exceptedRoots)
}

// Reports one message per import in this file that its own package is closed to.
//
// Lines are read with comments and literals gone, so a commented-out import or one spelt inside a
// raw string is not judged. Imports cannot follow a type declaration, so the scan stops at the first.
def findForbiddenImports = { File sourceFile, List forbiddenEdges ->

    def forbidden = []
    def declaredPackage = readDeclaredPackage(sourceFile.readLines(sourceEncoding))

    if (declaredPackage == null) {
        return forbidden
    }

    def applicableEdges = forbiddenEdges.findAll { isClosedByEdge(declaredPackage, it) }

    if (applicableEdges.isEmpty()) {
        return forbidden
    }

    def hasReachedTypeDeclaration = false

    eachStrippedLine(sourceFile) { String line, int lineNumber ->

        if (hasReachedTypeDeclaration) {
            return
        }

        hasReachedTypeDeclaration = classDeclarationPattern.matcher(line).find()

        def matcher = importDeclarationPattern.matcher(line)

        if (!matcher.find()) {
            return
        }

        def importedName = matcher.group(1)

        applicableEdges.each { edge ->

            if (isInsideLayer(importedName, edge.forbiddenRoot, edge.forbiddenExceptedRoots)) {

                forbidden << "${sourceFile}:${lineNumber}: " +
                    "${edge.closedSideLabel} may not import ${edge.forbiddenSideLabel}: ${importedName}"
            }
        }
    }

    return forbidden
}

// One 'of' entry read as the layer it names. A map without 'under', or with 'exactly', is refused:
// the imported side has no other width.
def readForbiddenLayer = { Object entry ->

    if (!(entry instanceof Map)) {
        return [root: entry.toString(), exceptedRoots: []]
    }

    if (!entry.under || entry.exactly) {

        throw new GradleException("forbidImport 'of' names a package root, or a " +
            "layer as [under: root, except: subtrees]; got: ${entry}")
    }

    def root = entry.under.toString()

    return [root: root, exceptedRoots: readExceptedRoots('forbidImport', entry, root)]
}

def forbiddenEdges = []

def enforcePackageLayering = tasks.register('enforcePackageLayering') { gate ->

    group = 'verification'
    description = 'Fails the build when a package root imports one the ' +
        'consuming build declared it closed to.'

    ext.forbidImport = { Map edge ->

        // Checked before the missing-half check, so naming both widths is reported as the
        // contradiction it is.
        if (edge.under && edge.exactly) {

            throw new GradleException("forbidImport closes a package root one " +
                "way or the other: 'under' for it and everything beneath " +
                "it, or 'exactly' for that one package - not both; " +
                "got: ${edge}")
        }

        def closedRoot = edge.under ?: edge.exactly

        if (!closedRoot || !edge.of) {

            throw new GradleException("forbidImport needs the package root " +
                "that is closed - 'under' for it and everything beneath " +
                "it, or 'exactly' for that one package - and 'of' (the " +
                "package root it may not import); got: ${edge}")
        }

        def exceptedRoots = readExceptedRoots('forbidImport', edge, closedRoot)

        // The label carries the width into every message and the rule snapshot: each width is a
        // different rule over the same pair of roots.
        def closedSideLabel = edge.exactly
            ? "${closedRoot} itself".toString()
            : describeLayer(closedRoot, exceptedRoots)

        readOneOrMany(edge.of).each { forbiddenEntry ->

            def forbiddenLayer = readForbiddenLayer(forbiddenEntry)

            forbiddenEdges << [
                closedRoot: closedRoot,
                isClosedExactly: edge.exactly as boolean,
                exceptedRoots: exceptedRoots,
                closedSideLabel: closedSideLabel,
                forbiddenRoot: forbiddenLayer.root,
                forbiddenExceptedRoots: forbiddenLayer.exceptedRoots,
                forbiddenSideLabel: describeLayer(forbiddenLayer.root, forbiddenLayer.exceptedRoots),
            ]
        }
    }

    // Every source set under src/, test code included: a suite reaching across the line for a real
    // type inverts the same arrow production code would.
    def scannedSources = declareScannedFiles(gate, 'src', jvmSourceIncludes)

    declareRuleSnapshot(gate, 'forbiddenEdges') {
        forbiddenEdges.collect { "${it.closedSideLabel} !-> ${it.forbiddenSideLabel}" }
    }

    doLast {

        if (forbiddenEdges.isEmpty()) {
            return
        }

        def violations = []

        scannedSources.each { sourceFile ->
            violations.addAll(findForbiddenImports(sourceFile, forbiddenEdges))
        }

        failOnViolations('Package layering violated', violations)
    }
}

installLintGate(enforcePackageLayering)
