// Nested-test structure gate.
//
// The convention: every test method lives inside a @Nested class named for the method under test,
// so a suite reports as a per-method tree rather than a flat list. The outermost test class holds
// only shared setup (@BeforeEach / @AfterEach), helpers, and the @Nested groups - never a @Test
// directly. This gate enforces the structural half of that rule: a @Test-family method must be
// enclosed in a @Nested class. The naming half (the group is named for the method under test) needs
// the production symbol to compare against and so stays a convention, not a gate; that a test
// method does not repeat its group's name is enforceTestNamesOmitGroup's.
//
// It also enforces the trap each language sets: a @Nested class JUnit will not run. A Kotlin
// @Nested class must be 'inner', since a plain nested 'class' is static-equivalent; a Java one must
// not be 'static'. Either compiles, and JUnit skips its tests while the build stays green.
//
// Telling a top-level @Test from a nested one needs each annotation's enclosing class, which
// source-scan.gradle reads for Kotlin as well as Java.
apply from: new File(buildscript.sourceFile.parentFile, '../../lint-gate.gradle')
apply from: new File(buildscript.sourceFile.parentFile, '../../source-scan.gradle')

// The Kotlin 'inner' modifier on a class, which makes a @Nested group one JUnit runs.
def innerModifier = ~/\binner\s+class\b/

// The Java 'static' modifier on a declaration line, which makes a @Nested group one JUnit skips.
def staticModifier = ~/\bstatic\b/

// Every nested-test violation in one source file.
def findNestingViolations = { File sourceFile ->

    def isKotlin = sourceFile.name.endsWith('.kt')
    def violations = []

    scanClassScopes(sourceFile) { line ->

        // A @Test binds to the method that follows it, but that method's enclosing class is
        // already open, so the verdict reads here without waiting for the method body.
        if (testMethodAnnotation.matcher(line.text).find()
                && !(line.enclosingClass?.isNested)) {

            violations << "${sourceFile}:${line.number}: @Test method must live inside a @Nested class"
        }

        def declared = line.declaredClass

        if (declared == null || !declared.isNested) {
            return
        }

        if (isKotlin && !innerModifier.matcher(line.text).find()) {

            violations << "${sourceFile}:${line.number}: Kotlin @Nested class must be declared " +
                "`inner class` (a plain nested class is skipped by JUnit5)"
        }

        if (!isKotlin && staticModifier.matcher(line.text).find()) {

            violations << "${sourceFile}:${line.number}: Java @Nested class must not be static " +
                "(a static nested class is skipped by JUnit5)"
        }
    }

    return violations
}

def enforceTestsNested = tasks.register('enforceTestsNested') {

    group = 'verification'
    description = 'Fails the build when a @Test method is not enclosed in a ' +
        '@Nested class.'

    def scannedFiles = declareScannedFiles(it, testSourceRoots, jvmSourceIncludes)

    doLast {

        def violations = scannedFiles.collectMany { sourceFile -> findNestingViolations(sourceFile) }

        failOnViolations('Nested-test convention violated', violations)
    }
}

installLintGate(enforceTestsNested)
