// Package-vocabulary gate: a package root declared closed to a word does not say it anywhere in its
// tree - in code, in comments, or in the markdown filed beside them.
//
// enforcePackageLayering keeps a framework from importing a feature; this keeps it from being
// written in the feature's words. A leaked import stops compiling when the package moves; a leaked
// noun in a comment survives every move. The two stay separate gates because a word list has false
// positives and needs an allowance, where an import edge has neither.
//
//     enforcePackageVocabulary {
//         forbidWords under: 'example.framework',
//             except: 'example.framework.kinds',
//             words: ['ledger', 'sales order']
//         allowWord word: 'ledger',
//             inFile: 'src/main/java/example/framework/README.md'
//     }
//
// An entry is parted into words the way the text is, so 'SalesOrder', 'sales order' and
// 'sales-order' declare one phrase, and it is found in an identifier and in prose alike.
// 'except' is for a subtree whose subject the words are; an allowance is the narrower hatch, one
// word in one file, for a file that has to name a word to state a rule.

apply from: new File(buildscript.sourceFile.parentFile, '../lint-gate.gradle')
apply from: new File(buildscript.sourceFile.parentFile, '../package-roots.gradle')
apply from: new File(buildscript.sourceFile.parentFile, '../word-scan.gradle')

// The file types a package's vocabulary is written in: its code, and the markdown filed beside it.
// Resources are data rather than prose, so they stay out of reach.
def scannedFileIncludes = jvmSourceIncludes + ['**/*.md']

// Reports one message per forbidden phrase this file says, at the line its first word is on.
def findForbiddenWords = { File sourceFile, String reportedPath, List applicableRules ->

    def words = readNameWords(sourceFile)

    return applicableRules.collectMany { rule ->

        findSpokenPhrases(words, rule.phrases).collect { spoken ->
            "${reportedPath}:${spoken.line}: ${rule.closedSideLabel} may not say \"${spoken.phrase.declared}\""
        }
    }
}

def vocabularyRules = []
def allowances = []

// Why an allowance answers no rule, or null when it answers one.
def findStrandedReason = { Map allowance, Map forbiddenPhrasesByPath ->

    if (!forbiddenPhrasesByPath.containsKey(allowance.inFile)) {
        return 'names a file this gate does not scan, so it allows nothing'
    }

    if (!(allowance.words in forbiddenPhrasesByPath[allowance.inFile])) {
        return 'names a word no rule forbids in that file, so it allows nothing'
    }

    return null
}

def enforcePackageVocabulary = tasks.register('enforcePackageVocabulary') { gate ->

    group = 'verification'
    description = 'Fails the build when a package root uses a word the ' +
        'consuming build declared it closed to.'

    ext.forbidWords = { Map declaration ->

        if (!declaration.under || !declaration.words) {

            throw new GradleException("forbidWords needs both 'under' (the " +
                "package root that is closed) and 'words' (the words it " +
                "may not say); got: ${declaration}")
        }

        def exceptedRoots = readExceptedRoots('forbidWords', declaration, declaration.under)

        vocabularyRules << [
            under: declaration.under,
            exceptedRoots: exceptedRoots,
            closedSideLabel: describeLayer(declaration.under, exceptedRoots),
            phrases: readOneOrMany(declaration.words).collect { readDeclaredPhrase('forbidWords', it.toString()) },
        ]
    }

    // Lets one file say one phrase. Declared in the build rather than as a marker in the file, so
    // an exemption is a line a reviewer reads in the diff. The path is project-relative, as on disk.
    def addAllowance = { String declaringCall, Object word, Object inFile ->

        def phrase = readDeclaredPhrase(declaringCall, word.toString())

        allowances << [word: phrase.declared, words: phrase.words, inFile: inFile.toString()]
    }

    ext.allowWord = { Map exemption ->

        if (!exemption.word || !exemption.inFile) {

            throw new GradleException("allowWord needs both 'word' (the word " +
                "being let through) and 'inFile' (the project-relative " +
                "path it is allowed in); got: ${exemption}")
        }

        addAllowance('allowWord', exemption.word, exemption.inFile)
    }

    // Several words in one file: the shape a README explaining a rule takes, which has to name
    // every word the rule bans.
    ext.allowWords = { Map exemption ->

        if (!exemption.words || !exemption.inFile) {

            throw new GradleException("allowWords needs both 'words' (the " +
                "words being let through) and 'inFile' (the " +
                "project-relative path they are allowed in); got: ${exemption}")
        }

        readOneOrMany(exemption.words).each { addAllowance('allowWords', it, exemption.inFile) }
    }

    // Every source set under src/: a dev-tooling or fixture tree is prose nobody sweeps, which is
    // where the words a sweep missed collect.
    def scannedSources = declareScannedFiles(gate, 'src', scannedFileIncludes)

    declareRuleSnapshot(gate, 'vocabularyRules') {
        vocabularyRules.collect { "${it.closedSideLabel} !- ${it.phrases*.declared.sort()}" }
    }

    declareRuleSnapshot(gate, 'allowances') {
        allowances.collect { "${it.word} in ${it.inFile}" }
    }

    doLast {

        if (vocabularyRules.isEmpty()) {
            return
        }

        def violations = []

        // The phrases each scanned file is forbidden, before its allowances: an allowance answers a rule
        // only where one of these is its phrase.
        def forbiddenPhrasesByPath = [:]

        scannedSources.visit { details ->

            if (details.directory) {
                return
            }

            // Project-relative with forward slashes, so an allowance reads the same on every machine.
            def reportedPath = 'src/' + details.path

            def allowedPhrases = allowances.findAll { it.inFile == reportedPath }*.words
            def pathPackage = readPathPackage(details.relativePath.segments as List)
            def rulesOverFile = vocabularyRules.findAll { isInsideLayer(pathPackage, it.under, it.exceptedRoots) }

            forbiddenPhrasesByPath[reportedPath] = rulesOverFile.collectMany { it.phrases*.words }

            def applicableRules = rulesOverFile
                .collect { rule ->
                    [
                        closedSideLabel: rule.closedSideLabel,
                        phrases: rule.phrases.findAll { !(it.words in allowedPhrases) },
                    ]
                }
                .findAll { !it.phrases.isEmpty() }

            if (!applicableRules.isEmpty()) {
                violations.addAll(findForbiddenWords(details.file, reportedPath, applicableRules))
            }
        }

        // An allowance that answers no rule exempts nothing, and its word is loose again the moment
        // the file or rule it meant comes back under another name.
        allowances.each { allowance ->

            def reason = findStrandedReason(allowance, forbiddenPhrasesByPath)

            if (reason != null) {
                violations << "${allowance.inFile}: allowWord ${reason}: \"${allowance.word}\""
            }
        }

        failOnViolations('Package vocabulary violated', violations)
    }
}

installLintGate(enforcePackageVocabulary)
