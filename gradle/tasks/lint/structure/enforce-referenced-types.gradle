// Referenced-types gate, applied by java-conventions.gradle into every
// consuming project. Kept in its own script so the conventions file stays about
// classpath, version, and test stack, while this owns one concern: the
// verification rule.
//
// The convention: compiled code names a type from an unstable namespace only
// where the consuming build has said that particular type is stable. A namespace
// is unstable when the same library, at the same version, ships under different
// type names to different audiences - a build per platform, a shaded
// redistribution, an obfuscated release whose non-public names are regenerated.
// Code compiled against one of those spellings then fails to link against
// another, and it fails at the call rather than at load.
//
// The fourth of the structure family, and the only one that reads compiled
// classes rather than source text. It has to: what a class file records is not
// what the source said. A source file that never names a type still compiles a
// reference to it wherever an inferred local, a returned value or an implicit
// cast puts one in a descriptor, and that reference is what the JVM resolves. A
// source pass would clear such a file and a bytecode pass fails it, which is the
// whole reason this exists as its own gate rather than as another import rule.
//
// The shape it exists for: a library whose published surface is stable and whose
// internals are not, reached through a seam. The seam may name the stable types;
// everything below it is reached by name at runtime instead, and nothing
// anywhere may compile a reference to a type whose spelling is not promised.
//
// A namespace is a per-project fact rather than a shared one, so this script
// owns only the mechanism and the consuming build declares what is stable in it.
// The names below are the ones this gate's own integration test is written
// against, this repo knowing no consumer's dependencies:
//
//     enforceReferencedTypes {
//         restrictReferences namespace: 'example.library',
//             allowingPackages: ['example.library.api'],
//             allowingTypes: ['example.library.internal.Seam']
//     }
//
// All of it arrives in one call rather than through a fluent chain, for the
// reason the layering gate gives: a half-declared rule is then never a state
// anything can hold or a caller can forget to finish.
//
// Both allowances are optional, and omitting them closes the namespace
// altogether. They are optional rather than required so a total ban needs no
// empty list, and the failure direction of a mistyped key is the safe one - the
// namespace is closed rather than silently opened.
//
// A package allowance covers everything beneath it, a type allowance covers that
// one type and the types nested inside it. Nested types ride with their outer
// one because they are declared with it: a nested type is written in the same
// file, promised by the same decision, and renamed by the same release. Nothing
// else is implied - a sibling in the same package as an allowed type is its own
// declaration.
//
// Every class under the build's class trees is scanned, production and test
// alike. A reference this gate would fail is compiled the same way in either, and
// a rule about how a library may be reached that stopped at the test tree would
// be a rule with a hole in it.
//
// What a violation names is the class that holds the reference and the type it
// referenced, with no line number: a class file records which types a method
// touches, not where in the source each was written. That is enough to open the
// file at, and the alternative - carrying the line tables through - would buy a
// line number for a reference the source may not spell anywhere.
//
// A build that declares no namespace inherits the task and checks nothing,
// which is what lets the conventions file apply it everywhere rather than
// leaving each consumer to opt in.

// Applied by this script, not assumed from the conventions file: the gate is
// applied on its own by its integration test, so it has to carry what it uses.
apply from: new File(buildscript.sourceFile.parentFile, '../lint-gate.gradle')

// Constant-pool tags, by the size of what follows them. Only the Utf8 entries
// are read; the rest exist so the walk can step over them, a pool being a
// sequence of variable-width entries with no index to seek by.
def CONSTANT_UTF8 = 1
def CONSTANT_INTEGER = 3
def CONSTANT_FLOAT = 4
def CONSTANT_LONG = 5
def CONSTANT_DOUBLE = 6
def CONSTANT_CLASS = 7
def CONSTANT_STRING = 8
def CONSTANT_FIELDREF = 9
def CONSTANT_METHODREF = 10
def CONSTANT_INTERFACE_METHODREF = 11
def CONSTANT_NAME_AND_TYPE = 12
def CONSTANT_METHOD_HANDLE = 15
def CONSTANT_METHOD_TYPE = 16
def CONSTANT_DYNAMIC = 17
def CONSTANT_INVOKE_DYNAMIC = 18
def CONSTANT_MODULE = 19
def CONSTANT_PACKAGE = 20

// Entries whose payload is a fixed number of bytes after the tag, so the walk
// steps over them without knowing what they mean.
def CONSTANT_PAYLOAD_BYTES = [
    (CONSTANT_INTEGER): 4,
    (CONSTANT_FLOAT): 4,
    (CONSTANT_LONG): 8,
    (CONSTANT_DOUBLE): 8,
    (CONSTANT_CLASS): 2,
    (CONSTANT_STRING): 2,
    (CONSTANT_FIELDREF): 4,
    (CONSTANT_METHODREF): 4,
    (CONSTANT_INTERFACE_METHODREF): 4,
    (CONSTANT_NAME_AND_TYPE): 4,
    (CONSTANT_METHOD_HANDLE): 3,
    (CONSTANT_METHOD_TYPE): 2,
    (CONSTANT_DYNAMIC): 4,
    (CONSTANT_INVOKE_DYNAMIC): 4,
    (CONSTANT_MODULE): 2,
    (CONSTANT_PACKAGE): 2,
]

// The eight-byte constants take two pool slots each, a rule the pool's own
// numbering depends on and the one thing a naive walk gets wrong.
def DOUBLE_WIDTH_CONSTANTS = [CONSTANT_LONG, CONSTANT_DOUBLE]

// Every text constant in a class file. That is where every type name in it
// lives, whichever way the class names one: a class constant holds the name
// itself, and a field or method descriptor spells its types inside a signature,
// which is the half a reference can hide in - a call's return type is written
// nowhere else.
//
// Only the pool is read. It sits at the head of the file and holds every name
// the class can refer to, so there is nothing after it worth the walk.
//
// Answers null for a file the walk cannot follow, which is a different thing
// from a file that names nothing: the caller reports those rather than passing
// them silently, since a class read as empty is a class nothing was checked in.
def readTextConstants = { File classFile ->

    def texts = []

    def unreadable = classFile.withDataInputStream { classBytes ->

        classBytes.skipBytes(8)
        int poolEntryCount = classBytes.readUnsignedShort()

        // Numbered from one, and the count is one past the last, which is why
        // this reads one entry fewer than the number suggests.
        for (int entry = 1; entry < poolEntryCount; entry++) {

            int tag = classBytes.readUnsignedByte()

            if (tag == CONSTANT_UTF8) {
                texts << classBytes.readUTF()
                continue
            }
            def payloadBytes = CONSTANT_PAYLOAD_BYTES[tag]

            if (payloadBytes == null) {
                // A tag from a class-file version this walk does not know.
                // Stopping here reads the file as holding nothing rather than
                // stepping blindly and reporting whatever the misalignment
                // spells, which would be a violation nobody could act on.
                return true
            }
            classBytes.skipBytes(payloadBytes)

            if (tag in DOUBLE_WIDTH_CONSTANTS) {
                entry++
            }
        }
        return false
    }
    return unreadable ? null : texts
}

// The types a class names from this namespace, deduplicated.
//
// A name is matched wherever it appears in a text constant rather than only at
// its start, because a descriptor carries it mid-string: '()Lcom/fs/x/Y;' names
// the type after the 'L'. The characters taken after the prefix are the ones a
// binary name is written in, so a descriptor's closing ';' and a signature's
// following types end the name on their own.
//
// The matcher is the rule's own, compiled when the rule was declared: this runs
// once per class per rule, and a pattern rebuilt there is rebuilt a thousand
// times over a library's class tree to say the same thing each time.
def findReferencedTypes = { List<String> texts, Map namespaceRule ->

    def referencedTypes = new TreeSet<String>()

    texts.each { text ->
        namespaceRule.referenceMatcher.matcher(text).each { referencedTypes << it }
    }
    return referencedTypes
}

// Whether a class compiled here is itself part of the namespace being judged.
//
// Such a class is exempt: what the rule is about is code of one authorship
// depending on names of another's, and a class compiled into the namespace is
// declaring itself part of it - a shim filed under a library's own package is
// written to that library's internals by definition, and reporting each of its
// references would be noise about the one place the rule does not apply.
def isClassInsideNamespace = { String className, Map namespaceRule ->
    return className.startsWith(namespaceRule.namespacePath + '/')
}

// Whether a type is one the consuming build promised is stable.
def isTypeAllowed = { String referencedType, Map namespaceRule ->

    if (namespaceRule.allowedPackages.any { referencedType.startsWith(it + '/') }) {
        return true
    }
    // A nested type rides with the outer one it is declared beside; a sibling in
    // the same package does not.
    return namespaceRule.allowedTypes.any {
        referencedType == it || referencedType.startsWith(it + '$')
    }
}

// The class a file holds, named as the source that wrote it would be found: a
// binary name with its nesting kept, and the tree it was compiled from beside
// it. Everything under the class trees is <language>/<source set>/<binary name>,
// so the first two segments are the tree and the rest is the class.
def readCompiledClass = { File classFile, File classesDir ->

    def compiledPath = classesDir.toPath()
        .relativize(classFile.toPath())
        .toString()
        .replace(File.separator, '/')
        .replaceFirst(/\.class$/, '')

    def pathSegments = compiledPath.split('/')

    if (pathSegments.length <= 2) {
        return [binaryName: compiledPath, compiledFrom: '']
    }
    return [
        binaryName: pathSegments[2..-1].join('/'),
        // Named in the report because the same class name can be compiled from
        // more than one tree, and because which tree a reference sits in is the
        // first thing a reader of the report asks.
        compiledFrom: " in ${pathSegments[0]}/${pathSegments[1]}",
    ]
}

// Filled by the consuming build through the task's own `restrictReferences`, so
// it is captured here rather than inside the task: the execution-time action
// reads the same list the declarations appended to.
def namespaceRules = []

def enforceReferencedTypes = tasks.register('enforceReferencedTypes') {

    group = 'verification'
    // Bracketed so the leading '+' continues this expression. Groovy ends a
    // statement at a line break wherever the line already parses whole, and
    // reads the next one as unary plus on a string - which fails at the call.
    description = ('Fails the build when compiled code names a type from a '
        + 'namespace outside what the consuming build declared stable in it.')

    // Declares one namespace. Named arguments rather than positional ones
    // because all three are plain text, so a transposition would otherwise
    // declare a namespace named after a package and still pass.
    ext.restrictReferences = { Map namespaceRule ->

        if (!namespaceRule.namespace) {

            throw new GradleException("restrictReferences needs 'namespace' "
                + "(the package root whose type names are not promised); "
                + "got: ${namespaceRule}")
        }
        // Held as binary names, which is how a class file spells them, so the
        // scan compares what it read rather than converting per match. The
        // declaration stays in source spelling, that being what a reader of the
        // build knows the types by.
        def toBinaryNames = { names ->
            (names instanceof Collection ? names : [names])
                .collect { it.replace('.', '/') }
                .sort()
        }
        def namespacePath = namespaceRule.namespace.replace('.', '/')

        namespaceRules << [
            namespace: namespaceRule.namespace,
            namespacePath: namespacePath,
            // Compiled here rather than per class, for the reason
            // findReferencedTypes gives.
            referenceMatcher: ~/\Q${namespacePath}\E\/[\w$\/]+/,
            allowedPackages: toBinaryNames(namespaceRule.allowingPackages ?: []),
            allowedTypes: toBinaryNames(namespaceRule.allowingTypes ?: []),
        ]
    }

    // Everything the build compiles, taken as the directory the language plugins
    // write into rather than from the source sets that name it.
    //
    // The directory is what cannot miss a tree. A consumer applies the
    // conventions first and declares its own source sets after, so a scan built
    // from the source sets known at that moment is built from the language
    // plugin's defaults and nothing else - and a tree left out is a tree that
    // quietly stopped being checked, which is the failure this gate exists to
    // have none of. It is also what the jar is built from, so a class sitting
    // there is a class that ships whether or not a source still produces it.
    //
    // Declared as the matched files rather than as the directory: an absent tree
    // is then an empty scan rather than the configuration failure a
    // declared-but-missing input directory would be.
    def scannedClasses = fileTree(layout.buildDirectory.dir('classes')) {
        include '**/*.class'
    }

    // Compilation has to have happened for there to be anything to read, which
    // is the one way this gate differs from its source-text siblings.
    //
    // Matched live and twice over rather than named, so a consumer's Kotlin,
    // Groovy or fixture compilation is covered without this script knowing it
    // exists. By type catches everything built on Gradle's own compile task; by
    // name catches the Kotlin plugin, which stopped extending it. Either alone
    // leaves a language out, and a compilation missed here is a gate that reads
    // the previous build's classes.
    dependsOn tasks.withType(AbstractCompile)
    dependsOn tasks.matching { it.name.startsWith('compile') && it.name.endsWith('Kotlin') }

    inputs.files(scannedClasses).withPropertyName('scannedClasses')

    // The namespaces are an input as much as the classes are - declaring one has
    // to re-run the gate rather than leave it UP-TO-DATE against the rule it was
    // last cleared under. Wrapped in a provider because they are declared after
    // this registration runs, and snapshotted as plain strings rather than as
    // the maps themselves, since an input property's value has to be
    // serialisable.
    inputs.property('namespaceRules', providers.provider {

        namespaceRules
            .collect {
                ("${it.namespace} only ${it.allowedPackages} "
                    + "and ${it.allowedTypes}").toString()
            }
            .sort()
    })

    doLast {

        if (namespaceRules.isEmpty()) {
            return
        }
        def violations = []
        def unreadableClasses = []
        def classesDir = layout.buildDirectory.dir('classes').get().asFile

        scannedClasses.each { classFile ->

            def compiledClass = readCompiledClass(classFile, classesDir)

            // Which rules have anything to say about this class, settled before
            // the file is opened: reading a constant pool costs a pass over the
            // head of every class in the build, and a class every rule passes
            // over is one nothing would have been done with.
            def applicableRules = namespaceRules.findAll {
                !isClassInsideNamespace(compiledClass.binaryName, it)
            }
            if (applicableRules.isEmpty()) {
                return
            }
            def texts = readTextConstants(classFile)

            if (texts == null) {
                unreadableClasses << compiledClass.binaryName
                return
            }

            applicableRules.each { namespaceRule ->

                findReferencedTypes(texts, namespaceRule).each { referencedType ->

                    if (!isTypeAllowed(referencedType, namespaceRule)) {

                        violations << ("${compiledClass.binaryName}${compiledClass.compiledFrom}"
                            + " references ${referencedType}, which ${namespaceRule.namespace}"
                            + " does not promise to keep spelled that way")
                    }
                }
            }
        }

        // Said rather than swallowed, and said once with a count rather than per
        // class: a class the walk could not follow is a class nothing was
        // checked in, which reads exactly like a class that passed. It is a
        // warning and not a failure because the cause is this gate falling
        // behind a class-file version, not the code under it doing anything -
        // failing the build would stop a consumer over a tool's own gap.
        if (!unreadableClasses.isEmpty()) {

            logger.warn("enforceReferencedTypes read no constants from "
                + "${unreadableClasses.size()} class(es) carrying a constant-pool tag it does "
                + "not know, so nothing was checked in them: ${unreadableClasses.sort().take(5)}")
        }

        if (!violations.isEmpty()) {
            // GradleException is the idiomatic build-failure signal; its clean
            // message reads as the gate's verdict. The editor flags it as an
            // unresolved class because an applied script has no Gradle API on
            // its classpath - a known tooling false positive, not a defect, so
            // do not "fix" it by swapping in a java.lang exception.
            throw new GradleException("Unstable type references:\n  "
                + violations.sort().join('\n  '))
        }
    }
}

// Make it a gate: an output so it can be skipped while what it reads is
// unchanged, and a place in the verification lifecycle; see lint-gate.gradle.
installLintGate(enforceReferencedTypes)
