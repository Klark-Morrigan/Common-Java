// Referenced-types gate: compiled code names a type from a restricted namespace only where the
// consuming build allowed that type.
//
// It guards against two failures that surface at the call rather than at compile or load time: a
// library whose non-public names differ between builds of one version, and a runtime that refuses
// to load a namespace at all.
//
// It reads class files rather than source, because a class records references its source never
// spells: an inferred local or a returned value puts a type into a descriptor, and the descriptor is
// what the JVM resolves.
//
//     enforceReferencedTypes {
//         restrictReferences namespace: 'example.library',
//             allowingPackages: ['example.library.api'],
//             allowingTypes: ['example.library.internal.Seam'],
//             inSourceSets: ['main'],
//             reason: 'the runtime refuses to load it'
//     }
//
// Each namespace is declared once. Both allowances take one name or a list; left out, the namespace
// is closed outright, so a mistyped key closes it rather than opens it. A package allowance covers
// everything beneath it. A type allowance covers that type and the types nested in it, which are
// declared, promised and renamed with it.
//
// 'inSourceSets' limits a rule to the trees it names, for a rule about where code runs: a suite on a
// plain JVM may use what the shipped runtime refuses. Left out, the rule holds in every tree.
// 'reason' ends each finding as the clause after "which", in place of the default about unstable
// spellings.
//
// A finding names the class and the type with no line: a class file records which types a method
// touches, not where the source wrote them.

apply from: new File(buildscript.sourceFile.parentFile, '../lint-gate.gradle')

// Constant-pool tags. Only the Utf8 entries are read; the rest are stepped over, a pool being a
// sequence of variable-width entries with no index to seek by.
def CONSTANT_UTF8 = 1
def CONSTANT_INTEGER = 3
def CONSTANT_FLOAT = 4
def CONSTANT_LONG = 5
def CONSTANT_DOUBLE = 6
def CONSTANT_CLASS = 7
def CONSTANT_STRING = 8
def CONSTANT_FIELDREF = 9
def CONSTANT_METHODREF = 10
def CONSTANT_INTERFACE_METHODREF = 11
def CONSTANT_NAME_AND_TYPE = 12
def CONSTANT_METHOD_HANDLE = 15
def CONSTANT_METHOD_TYPE = 16
def CONSTANT_DYNAMIC = 17
def CONSTANT_INVOKE_DYNAMIC = 18
def CONSTANT_MODULE = 19
def CONSTANT_PACKAGE = 20

// The bytes after each fixed-width tag.
def CONSTANT_PAYLOAD_BYTES = [
    (CONSTANT_INTEGER): 4,
    (CONSTANT_FLOAT): 4,
    (CONSTANT_LONG): 8,
    (CONSTANT_DOUBLE): 8,
    (CONSTANT_CLASS): 2,
    (CONSTANT_STRING): 2,
    (CONSTANT_FIELDREF): 4,
    (CONSTANT_METHODREF): 4,
    (CONSTANT_INTERFACE_METHODREF): 4,
    (CONSTANT_NAME_AND_TYPE): 4,
    (CONSTANT_METHOD_HANDLE): 3,
    (CONSTANT_METHOD_TYPE): 2,
    (CONSTANT_DYNAMIC): 4,
    (CONSTANT_INVOKE_DYNAMIC): 4,
    (CONSTANT_MODULE): 2,
    (CONSTANT_PACKAGE): 2,
]

// The eight-byte constants take two pool slots each, which the pool's numbering depends on.
def DOUBLE_WIDTH_CONSTANTS = [CONSTANT_LONG, CONSTANT_DOUBLE]

// What precedes the constant pool: the magic number (4 bytes), the minor version (2), the major (2).
def CLASS_FILE_HEADER_BYTES = 8

// How many unreadable classes a failure names; the cause is a class-file version, so it tends to
// hold for everything compiled.
def UNREADABLE_CLASSES_NAMED = 5

// Every text constant in a class file, which is where every type name in it lives: a class constant
// holds the name itself, and a descriptor spells its types inside a signature. Only the pool is read;
// it holds every name the class can refer to.
//
// Answers null for a file the walk cannot follow, so the caller can fail over it rather than read it
// as naming nothing.
def readTextConstants = { File classFile ->

    def texts = []
    def isUnreadable = classFile.withDataInputStream { classBytes ->

        classBytes.skipBytes(CLASS_FILE_HEADER_BYTES)

        int poolEntryCount = classBytes.readUnsignedShort()

        // Numbered from one, and the count is one past the last entry.
        for (int entry = 1; entry < poolEntryCount; entry++) {

            int tag = classBytes.readUnsignedByte()

            if (tag == CONSTANT_UTF8) {
                texts << classBytes.readUTF()
                continue
            }

            def payloadBytes = CONSTANT_PAYLOAD_BYTES[tag]

            // A tag this walk does not know. Stepping on blindly would report whatever the
            // misalignment spells.
            if (payloadBytes == null) {
                return true
            }

            classBytes.skipBytes(payloadBytes)

            if (tag in DOUBLE_WIDTH_CONSTANTS) {
                entry++
            }
        }

        return false
    }

    return isUnreadable ? null : texts
}

// Answers whether a binary type name is the outer type or a type nested in it.
def isTypeOrNestedIn = { String type, String outerType ->
    return type == outerType || type.startsWith(outerType + '$')
}

// Declared names in the binary spelling a class file uses, so the scan compares what it read
// without converting per match. The declaration keeps source spelling, which is what a reader knows.
def readBinaryNames = { names ->
    return readOneOrMany(names).collect { it.toString().replace('.', '/') }.sort()
}

// Where a class file can spell a type of the namespace: as a whole text (a class constant), after a
// character no binary name holds, or after a descriptor's 'L'. That 'L' follows such a character or a
// run of primitive descriptors, as in '(ILexample/library/Type;)V'. Anchored so a longer path that
// merely contains the namespace, such as 'org/example/library/Type', is not read as it.
def compileReferencePattern = { String namespacePath ->
    return ~/(?:^|[^\w$\/]|(?:^|[^\w$\/])[BCDFIJSZ]*L)(\Q${namespacePath}\E\/[\w$\/]+)/
}

// The types a class names from this namespace, deduplicated. The name runs over the characters a
// binary name is written in, so a descriptor's ';' and a signature's next type end it.
def findReferencedTypes = { List<String> texts, Map namespaceRule ->

    def referencedTypes = new TreeSet<String>()

    texts.each { text ->

        def matcher = namespaceRule.referencePattern.matcher(text)

        while (matcher.find()) {
            referencedTypes << matcher.group(1)
        }
    }

    return referencedTypes
}

// Answers whether a class compiled here is itself part of the namespace. Such a class is exempt: a
// shim filed under a library's own package is written to that library's internals by definition.
def isClassInsideNamespace = { String className, Map namespaceRule ->
    return className.startsWith(namespaceRule.namespacePath + '/')
}

// Answers whether a type is one the consuming build promised is stable.
def isTypeAllowed = { String referencedType, Map namespaceRule ->

    return namespaceRule.allowedPackages.any { referencedType.startsWith(it + '/') } ||
        namespaceRule.allowedTypes.any { isTypeOrNestedIn(referencedType, it) }
}

// The class a file holds: its binary name with nesting kept, and the tree it was compiled from.
// Everything under the class trees is <language>/<source set>/<binary name>.
def readCompiledClass = { File classFile, File classesDir ->

    def compiledPath = classesDir
        .toPath()
        .relativize(classFile.toPath())
        .toString()
        .replace(File.separator, '/')
        .replaceFirst(/\.class$/, '')

    def pathSegments = compiledPath.split('/')

    if (pathSegments.length <= 2) {
        return [binaryName: compiledPath, compiledFrom: '', sourceSet: '']
    }

    return [
        binaryName: pathSegments[2..-1].join('/'),
        sourceSet: pathSegments[1],
        // One class name can be compiled from more than one tree.
        compiledFrom: " in ${pathSegments[0]}/${pathSegments[1]}",
    ]
}

// A misspelt source set matches no compiled tree, so its rule would check nothing and pass.
def failOnUnknownSourceSets = { List namespaceRules, List knownSourceSets ->

    namespaceRules.each { namespaceRule ->

        def unknownSourceSets = namespaceRule.sourceSets.findAll { !(it in knownSourceSets) }

        if (!unknownSourceSets.isEmpty()) {

            throw new GradleException("restrictReferences for '${namespaceRule.namespace}' names " +
                "source set(s) ${unknownSourceSets} this build does not have; " +
                "it has ${knownSourceSets}")
        }
    }
}

// Reads every compiled class the rules apply to. Answers the references no rule allows, the classes
// the walk could not follow, the types each rule saw named, and the rules that read any class.
def scanCompiledClasses = { List namespaceRules, Iterable classFiles, File classesDir ->

    def scan = [
        violations: [],
        unreadableClasses: [],
        referencedTypesByNamespace: namespaceRules.collectEntries { [(it.namespace): new TreeSet<String>()] },
        namespacesRead: [] as Set,
    ]

    classFiles.each { classFile ->

        def compiledClass = readCompiledClass(classFile, classesDir)

        // Settled before the file is opened, so a class every rule passes over is never read.
        def applicableRules = namespaceRules.findAll {
            !isClassInsideNamespace(compiledClass.binaryName, it) &&
                (it.sourceSets.isEmpty() || compiledClass.sourceSet in it.sourceSets)
        }

        if (applicableRules.isEmpty()) {
            return
        }

        def texts = readTextConstants(classFile)

        if (texts == null) {
            scan.unreadableClasses << compiledClass.binaryName
            return
        }

        applicableRules.each { namespaceRule ->

            scan.namespacesRead << namespaceRule.namespace

            findReferencedTypes(texts, namespaceRule).each { referencedType ->

                scan.referencedTypesByNamespace[namespaceRule.namespace] << referencedType

                if (!isTypeAllowed(referencedType, namespaceRule)) {

                    def why = namespaceRule.reason ?:
                        "${namespaceRule.namespace} does not promise to keep spelled that way"

                    scan.violations << "${compiledClass.binaryName}${compiledClass.compiledFrom}" +
                        " references ${referencedType}, which ${why}"
                }
            }
        }
    }

    return scan
}

// A type allowance nothing names reads as a dependency the project does not have, and pre-approves
// the next reference to that type. Judged only for a rule that read a class: with nothing compiled
// in its trees, every allowance would read as unused. A package allowance is a policy over a tree
// and is not judged.
def findUnusedTypeAllowances = { List namespaceRules, Map scan ->

    return namespaceRules
        .findAll { it.namespace in scan.namespacesRead }
        .collectMany { namespaceRule ->

            def referencedTypes = scan.referencedTypesByNamespace[namespaceRule.namespace]

            namespaceRule.allowedTypes
                .findAll { allowedType -> !referencedTypes.any { isTypeOrNestedIn(it, allowedType) } }
                .collect { allowedType ->

                    // In source spelling, since the reader deletes a line written that way.
                    "${allowedType.replace('/', '.')} is allowed for ${namespaceRule.namespace} " +
                        'and nothing compiled here names it, so the allowance says a dependency ' +
                        'exists where none does'
                }
        }
}

// A class the walk cannot follow was checked for nothing, which looks like a pass. The cause is a
// constant-pool tag the walk does not know yet, so this is raised before the findings, which are
// incomplete while it holds.
def failOnUnreadableClasses = { List unreadableClasses ->

    if (!unreadableClasses.isEmpty()) {

        throw new GradleException("Classes this gate could not read, so nothing in them was" +
            " checked - each carries a constant-pool tag the walk does not know, which is a" +
            " tag to add to it rather than anything in the code:\n  " +
            "${unreadableClasses.size()} class(es), including " +
            "${unreadableClasses.sort().take(UNREADABLE_CLASSES_NAMED)}")
    }
}

def namespaceRules = []

// Everything the build compiles, taken as the directory the language plugins write into rather than
// from the source sets: a consumer declares its own source sets after the conventions apply this,
// and the directory is also what the jar is built from.
def classesRoot = layout.buildDirectory.dir('classes')

def enforceReferencedTypes = tasks.register('enforceReferencedTypes') { gate ->

    group = 'verification'
    description = 'Fails the build when compiled code names a type from a restricted ' +
        'namespace outside what the consuming build declared allowed in it.'

    ext.restrictReferences = { Map namespaceRule ->

        if (!namespaceRule.namespace) {

            throw new GradleException("restrictReferences needs 'namespace' " +
                "(the package root whose type names are restricted); " +
                "got: ${namespaceRule}")
        }

        // What was named is gathered per namespace, so two rules over one would judge each other's
        // allowances against a merged set.
        if (namespaceRules.any { it.namespace == namespaceRule.namespace }) {

            throw new GradleException("restrictReferences declares '${namespaceRule.namespace}' " +
                "a second time; state the whole rule for a namespace in one call")
        }

        def namespacePath = namespaceRule.namespace.replace('.', '/')

        namespaceRules << [
            namespace: namespaceRule.namespace,
            namespacePath: namespacePath,
            // Compiled once per rule rather than once per class.
            referencePattern: compileReferencePattern(namespacePath),
            allowedPackages: readBinaryNames(namespaceRule.allowingPackages),
            allowedTypes: readBinaryNames(namespaceRule.allowingTypes),
            // Empty means every source set.
            sourceSets: readOneOrMany(namespaceRule.inSourceSets).collect { it.toString() }.sort(),
            reason: namespaceRule.reason,
        ]
    }

    def scannedClasses = declareScannedFiles(gate, classesRoot, ['**/*.class'], 'scannedClasses')

    // Compilation has to happen first. Matched live and two ways, so a consumer's other languages are
    // covered without this script naming them: by type for Gradle's own compile tasks, by name for
    // Kotlin's, which are not AbstractCompile.
    dependsOn tasks.withType(AbstractCompile)
    dependsOn tasks.matching { it.name.startsWith('compile') && it.name.endsWith('Kotlin') }

    declareRuleSnapshot(gate, 'namespaceRules') {
        namespaceRules.collect {
            "${it.namespace} only ${it.allowedPackages} and ${it.allowedTypes} " +
                "in ${it.sourceSets} because ${it.reason ?: ''}"
        }
    }

    // Read when the gate runs, since a consumer declares its own source sets after this is applied.
    // An input too, so a source set added later re-runs the gate against the rules naming it.
    def sourceSetNames = providers.provider {
        project.extensions.findByName('sourceSets')?.names?.toList()?.sort() ?: []
    }

    inputs.property('sourceSetNames', sourceSetNames)

    doLast {

        if (namespaceRules.isEmpty()) {
            return
        }

        failOnUnknownSourceSets(namespaceRules, sourceSetNames.get())

        def scan = scanCompiledClasses(namespaceRules, scannedClasses, classesRoot.get().asFile)

        failOnUnreadableClasses(scan.unreadableClasses)
        failOnViolations(
            'Restricted type references',
            (scan.violations + findUnusedTypeAllowances(namespaceRules, scan))*.toString().sort())
    }
}

installLintGate(enforceReferencedTypes)
