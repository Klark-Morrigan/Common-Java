// Method-visibility ordering gate.
//
// The convention: within a type body, methods descend the visibility ladder - most public at the
// top, most private at the bottom. Reading a class top to bottom then walks from its widest surface
// to its private machinery, so the public contract is what you meet first. The ladder, most to
// least visible:
//
//   Java:   public > protected > package-private (no modifier) > private
//   Kotlin: public (no modifier) > internal > protected > private
//
// The load-bearing subtlety is that an omitted modifier lands at OPPOSITE ends by language: a bare
// Java method is package-private (near the bottom), while a bare Kotlin method is public (the top).
// A Java method with no modifier inside an interface is implicitly public, so the default rank
// depends on both the file's language and whether the enclosing type is an interface.
//
// Constructors are excluded (the convention is about methods), as are enum constants and top-level
// Kotlin functions (ordering is enforced within a type body, not across a file).
//
// Telling a type-body method from a local one needs each declaration's enclosing type, which
// source-scan.gradle's class scopes give.
apply from: new File(buildscript.sourceFile.parentFile, '../lint-gate.gradle')
apply from: new File(buildscript.sourceFile.parentFile, '../source-scan.gradle')

// The ladders, most visible first: a method's rank is its visibility's index here, so a later
// method ranked below the most private one already seen in its type has climbed back up.
def javaVisibilityLadder = ['public', 'protected', 'package-private', 'private']
def kotlinVisibilityLadder = ['public', 'internal', 'protected', 'private']

// The modifiers a declaration can spell, each read as a whole word. Package-private has none.
def modifierPatterns = ['public', 'protected', 'internal', 'private']
    .collectEntries { modifier -> [(modifier): ~/\b${modifier}\b/] }

// A Kotlin function declaration: 'fun' as its own token, not a member reference or a substring.
def kotlinFunction = ~/(?<![.\w])fun\b/

// One leading Java annotation, with any single-line argument list, peeled off the front of a
// signature so the modifiers behind it can be read.
def leadingAnnotation = ~/^\s*@[\w.]+(?:\s*\([^)]*\))?\s*/

// The method name is the last identifier before the parameter '('.
def trailingName = ~/(\w+)\s*$/

// The visibility a declaration prefix spells on a ladder, or the ladder's implicit one when it
// spells none.
def classifyVisibility = { String prefix, List ladder, String implicitVisibility ->

    def spelled = ladder.find { visibility -> modifierPatterns[visibility]?.matcher(prefix)?.find() }

    if (spelled != null) {
        return [rank: ladder.indexOf(spelled), label: spelled]
    }

    return [rank: ladder.indexOf(implicitVisibility), label: "${implicitVisibility} (implicit)"]
}

// A Kotlin member function's visibility, or null when the line declares none. A 'fun' after '=' is
// a function-expression property value, not a member.
def readKotlinMemberVisibility = { String line ->

    def functionMatcher = kotlinFunction.matcher(line)

    if (!functionMatcher.find()) {
        return null
    }

    def prefix = line.substring(0, functionMatcher.start())

    if (prefix.contains('=')) {
        return null
    }

    return classifyVisibility(prefix, kotlinVisibilityLadder, 'public')
}

// Peels every leading annotation off a Java signature.
def peelJavaAnnotations = { String line ->

    def signature = line
    def annotation = leadingAnnotation.matcher(signature)

    while (annotation.find()) {

        signature = signature.substring(annotation.end())
        annotation = leadingAnnotation.matcher(signature)
    }

    return signature
}

// A Java method's visibility, or null when the line declares no method of this type.
//
// An '=' before the '(' is a field initialiser calling something. An empty return type is an enum
// constant, and a name equal to the type is a constructor. A prefix ending in '.' is a qualified
// call on a wrapped initialiser's value line.
def readJavaMemberVisibility = { String line, Map frame ->

    def signature = peelJavaAnnotations(line)
    def parameterStart = signature.indexOf('(')

    if (parameterStart < 0) {
        return null
    }

    def prefix = signature.substring(0, parameterStart)
    def nameMatcher = trailingName.matcher(prefix)

    if (prefix.contains('=') || !nameMatcher.find()) {
        return null
    }

    def returnType = prefix.substring(0, nameMatcher.start()).trim()

    if (returnType.isEmpty() || returnType.endsWith('.') || nameMatcher.group(1) == frame.name) {
        return null
    }

    def implicitVisibility = frame.keyword == 'interface' ? 'public' : 'package-private'

    return classifyVisibility(prefix, javaVisibilityLadder, implicitVisibility)
}

// Holds a method against the most private one already seen in its type, kept on the type's frame,
// and answers the violation when it climbs back up the ladder.
def recordMemberVisibility = { Map frame, Map visibility, File sourceFile, int lineNumber ->

    if (frame.maxRank != null && visibility.rank < frame.maxRank) {

        return "${sourceFile}:${lineNumber}: ${visibility.label} method declared below a " +
            "${frame.maxLabel} method (line ${frame.maxLine}); more-visible methods must come first"
    }

    frame.maxRank = visibility.rank
    frame.maxLabel = visibility.label
    frame.maxLine = lineNumber

    return null
}

// Every ordering violation in one source file.
//
// A line is a member site only at the body depth of its type, outside an argument list still open
// from a line above, and not after a line ending in '=': a wrapped field initialiser's value line
// ('Set.of(...)', 'new Foo(...)') otherwise reads as a bare package-private method.
def findVisibilityOrderViolations = { File sourceFile ->

    def isKotlin = sourceFile.name.endsWith('.kt')
    def violations = []
    def lastNonBlankLine = ''

    scanClassScopes(sourceFile) { line ->

        def text = line.text
        def frame = line.enclosingClass
        def isMemberSite = frame != null
            && line.braceDepth == frame.openDepth
            && line.declaredClass == null
            && line.parenDepth == 0
            && !lastNonBlankLine.endsWith('=')

        if (isMemberSite) {

            def visibility = isKotlin
                ? readKotlinMemberVisibility(text)
                : readJavaMemberVisibility(text, frame)

            if (visibility != null) {

                def violation = recordMemberVisibility(frame, visibility, sourceFile, line.number)

                if (violation != null) {
                    violations << violation
                }
            }
        }

        if (!text.trim().isEmpty()) {
            lastNonBlankLine = text.trim()
        }
    }

    return violations
}

def enforceMethodsOrderedByVisibility = tasks.register('enforceMethodsOrderedByVisibility') {

    group = 'verification'
    description = 'Fails the build when a more-visible method is declared below ' +
        'a less-visible one within the same type.'

    // Production code only: test classes order setup methods (@BeforeEach) and helpers by role
    // rather than visibility, so the ladder does not apply there.
    def scannedFiles = declareScannedFiles(it, ['src/main'], jvmSourceIncludes)

    doLast {

        def violations = scannedFiles.collectMany { sourceFile -> findVisibilityOrderViolations(sourceFile) }

        failOnViolations('Method-visibility ordering violated', violations)
    }
}

installLintGate(enforceMethodsOrderedByVisibility)
