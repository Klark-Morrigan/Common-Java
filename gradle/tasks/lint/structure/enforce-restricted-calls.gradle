// Restricted-call gate: a call a package root is closed to is made only in the types the
// consuming build names, and nowhere else beneath that root.
//
// It exists for an ambient read contained at an adapter. One type may reach a global handle and
// pass what it found downward; every other type takes it as an argument. The tenth caller of the
// global compiles exactly like the first, so only a gate can count them.
//
// The rule names where a call may be made rather than how many calls there are. A count has to
// be edited by whoever adds a legitimate seam; a named type is a line a reviewer reads in the diff.
//
//     enforceRestrictedCalls {
//         restrictCall call: 'Example.getGlobalHandle()',
//             under: 'example.framework',
//             toTypes: ['Adapter'],
//             instead: 'Seams.openGlobalHandle()'
//     }
//
// 'toTypes' takes one type or a list. Left out, it closes the root to the call outright, so a
// mistyped key enforces the rule everywhere rather than allowing the call everywhere. 'instead'
// is optional and ends each finding: when the allowed seam lives in another build, the allowed
// list is empty and says nothing about where to go.
//
// A type is named by the file it lives in, so nested and local classes ride with it. An entry
// naming a type that no longer exists hides nothing: a renamed seam's call fails under its new name.
//
// The call is matched as literal text in the code. Comments are stripped first, since prose about
// the rule is not a breach of it. String literals are kept: spelling the call inside one must not
// be cheaper than declaring the seam. A spelling with whitespace inside it does not match.

apply from: new File(buildscript.sourceFile.parentFile, '../lint-gate.gradle')
apply from: new File(buildscript.sourceFile.parentFile, '../package-roots.gradle')
apply from: new File(buildscript.sourceFile.parentFile, '../source-scan.gradle')

// The type a source file declares, taken as the file's own name.
def readDeclaredTypeName = { File sourceFile ->
    return sourceFile.name.replaceFirst(/\.[^.]+$/, '')
}

// The file's lines with comments gone and literals kept, numbered from one.
def readCodeLines = { File sourceFile ->

    def codeLines = []

    eachStrippedLine(sourceFile, true) { text, number -> codeLines << text }

    return codeLines
}

// Reports one message per restricted call this file makes.
def findRestrictedCalls = { File sourceFile, List restrictions ->

    def found = []
    def typeName = readDeclaredTypeName(sourceFile)
    def codeLines = readCodeLines(sourceFile)
    def declaredPackage = readDeclaredPackage(codeLines)

    if (declaredPackage == null) {
        return found
    }

    def applicableRestrictions = restrictions.findAll {
        isAtOrUnderPackageRoot(declaredPackage, it.under) && !(typeName in it.toTypes)
    }

    codeLines.eachWithIndex { codeLine, index ->

        applicableRestrictions.each { restriction ->

            if (codeLine.contains(restriction.call)) {

                found << "${sourceFile}:${index + 1}: " +
                    "${restriction.under} may call ${restriction.call} only in " +
                    "${restriction.toTypes}: ${typeName}" +
                    (restriction.instead ? " - instead: ${restriction.instead}" : '')
            }
        }
    }

    return found
}

def restrictions = []

def enforceRestrictedCalls = tasks.register('enforceRestrictedCalls') { gate ->

    group = 'verification'
    description = 'Fails the build when a package root makes a call outside ' +
        'the types the consuming build restricted it to.'

    ext.restrictCall = { Map restriction ->

        if (!restriction.call || !restriction.under) {

            throw new GradleException("restrictCall needs both 'call' (the " +
                "literal call text being contained) and 'under' (the package " +
                "root it is contained within); got: ${restriction}")
        }

        restrictions << [
            call: restriction.call,
            under: restriction.under,
            // Sorted so the message and the rule snapshot do not turn on declaration order.
            toTypes: readOneOrMany(restriction.toTypes).collect { it.toString() }.sort(),
            instead: restriction.instead ?: '',
        ]
    }

    // Every source set under src/, not main and test alone: a dev-tooling or fixture tree that may
    // make a contained call freely leaves the call uncontained.
    def scannedSources = declareScannedFiles(gate, 'src', jvmSourceIncludes)

    declareRuleSnapshot(gate, 'restrictions') {
        restrictions.collect { "${it.under} !- ${it.call} except ${it.toTypes} instead ${it.instead}" }
    }

    doLast {

        if (restrictions.isEmpty()) {
            return
        }

        def violations = []

        scannedSources.each { sourceFile ->
            violations.addAll(findRestrictedCalls(sourceFile, restrictions))
        }

        failOnViolations('Restricted calls violated', violations)
    }
}

installLintGate(enforceRestrictedCalls)
