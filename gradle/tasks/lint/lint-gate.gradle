// Shared plumbing for the lint gates: what every gate needs to be a gate, past
// the rule it actually asserts.
//
// Being a gate takes two things, and both are about how a gate meets Gradle
// rather than about any gate's subject. An author copying the shape from a
// sibling is how a gate ends up with one of the two and not the other, which
// fails silently in both directions: a gate nothing depends on never runs, and a
// gate with no output runs on every build forever.
//
// The two ends of most gates' own work are held here too: declaring what a gate
// reads, and failing with what it found.
//
// Conventions every gate follows, stated once here rather than in each gate:
//
// - A gate applies this script, and any other helper it uses, itself. Its
//   integration test applies that one gate into a throwaway project with no
//   conventions script in sight, so a helper defined anywhere else would make
//   the gate silently depend on being applied in company.
// - A declaration takes named arguments. Its values are mostly plain text of one
//   type, so a transposition would otherwise state the rule backwards and still
//   pass.
// - What a consuming build declares is captured in a list beside the task rather
//   than inside it, so the execution-time action reads the list the declarations
//   appended to.
// - A build that declares no rule inherits the gate and checks nothing, which is
//   what lets the conventions file apply every gate everywhere.
//
// Applying this more than once per project is harmless - each gate applies it,
// and the assignments below simply overwrite identical closures.

// The file types and encoding every gate reads source in.
apply from: new File(buildscript.sourceFile.parentFile, '../source-text.gradle')

// Gives a gate an output so Gradle can skip it while the sources it reads are
// unchanged.
//
// A gate reads source text and asserts a convention; it produces no artifact,
// and a task with actions but no declared output can never be UP-TO-DATE, so
// every gate would re-scan every source file on every build even when nothing
// changed. A stamp file closes that: the gate's inputs are already declared, so
// Gradle skips it while those sources are unchanged, and a gate that fails
// leaves no stamp behind and therefore runs again next time.
ext.declareLintGateStamp = { taskProvider ->

    def stampFile = layout.buildDirectory.file("lint/${taskProvider.name}.stamp")

    taskProvider.configure {

        outputs.file(stampFile)

        // The stamp is the whole result - it says "these exact sources passed
        // this gate" - so it is safe to replay from the build cache, which is
        // what keeps a clean build or a branch switch from re-scanning sources
        // that some earlier run already cleared.
        outputs.cacheIf { true }

        // Appended after the gate's own action, so the stamp records a pass:
        // when the check throws, this never runs and the gate stays out of date.
        doLast {

            def stamp = stampFile.get().asFile

            stamp.parentFile.mkdirs()
            stamp.text = "${taskProvider.name} passed\n"
        }
    }
}

// Runs a gate as part of the standard verification lifecycle, so both a local
// 'build'/'check' and CI's 'test jar' trip it before tests execute.
//
// Matched by name rather than taken from the java plugin's own task, because a
// gate is applied before any plugin is guaranteed to be: a live match picks the
// tasks up whenever they arrive, where naming one directly would fail in a
// project that has not applied the plugin yet.
ext.runLintGateWithVerification = { taskProvider ->

    tasks
        .matching { it.name in ['test', 'check'] }
        .configureEach { dependsOn taskProvider }
}

// Both of the above, which is what a gate wants: it is the whole of being a
// gate rather than a task somebody happens to have written.
//
// Published beside the two halves rather than in place of them, so a gate with
// a reason to take only one still can - and so the pair a reader is looking at
// has names, instead of being two anonymous lines inside this one.
ext.installLintGate = { taskProvider ->

    declareLintGateStamp(taskProvider)
    runLintGateWithVerification(taskProvider)
}

// Reads a declaration value that may be one item or a list of them as a list,
// empty when the value is absent. A rule naming one item is the common case, so
// the declaration spares it the brackets.
ext.readOneOrMany = { value ->

    if (value == null) {
        return []
    }

    return value instanceof Collection ? value as List : [value]
}

// Declares the files a gate reads as its inputs, and answers them as one tree
// for the gate's scan to walk.
//
// Declared as matched files rather than as directories: an absent root is then
// an empty scan rather than the configuration failure a declared-but-missing
// input directory would be, and a resource edit does not re-run a gate that only
// reads code. Paths are compared relative to the project, so a cached pass
// carries over to the same sources checked out anywhere else. A gate reading two
// trees names each, since one input property name holds one tree.
ext.declareScannedFiles = { Task gate, Object roots, List includes, String propertyName = 'scannedFiles' ->

    def scannedFiles = gate.project.files(roots).asFileTree.matching { include includes }

    gate.inputs.files(scannedFiles)
        .withPropertyName(propertyName)
        .withPathSensitivity(PathSensitivity.RELATIVE)

    return scannedFiles
}

// Declares the rules a consuming build stated as an input of the gate.
//
// The rules are an input as much as the sources are - adding one has to re-run
// the gate rather than leave it UP-TO-DATE against the rule it was last cleared
// under. Read through a provider because the rules are declared after the gate
// is registered, and snapshotted as sorted plain strings, since an input
// property's value has to be serialisable and must not turn on declaration order.
ext.declareRuleSnapshot = { Task gate, String propertyName, Closure readRuleDescriptions ->

    gate.inputs.property(propertyName, gate.project.providers.provider {
        readRuleDescriptions().collect { it.toString() }.sort()
    })
}

// Fails the gate when it found anything, one finding per line under its heading.
//
// GradleException is the idiomatic build-failure signal; its clean message
// reads as the gate's verdict. The editor flags it as an unresolved class
// because an applied script has no Gradle API on its classpath - a known tooling
// false positive, not a defect, so do not "fix" it by swapping in a java.lang
// exception.
ext.failOnViolations = { String heading, Collection violations ->

    if (!violations.isEmpty()) {
        throw new GradleException("${heading}:\n  " + violations.join('\n  '))
    }
}
