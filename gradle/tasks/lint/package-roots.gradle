// Shared plumbing for the lint gates that judge a source file by the package it
// sits in: how a package declaration is written, what it means for one dotted
// name to sit under another, and how a layer - a root less the subtrees it
// leaves out - is declared, tested and described.
//
// enforcePackageLayering and enforceRestrictedCalls judge a file by the package
// it declares. The vocabulary gates judge it by directory instead, because
// markdown carries no package declaration and is half of what those rules are
// about. All of them declare roots and left-out subtrees as dotted names, so
// all of them read those from here: a pattern that drifted between them would
// leave one gate silently scanning nothing while another still fired.

apply from: new File(buildscript.sourceFile.parentFile, 'lint-gate.gradle')

// A package declaration, with or without the semicolon Kotlin leaves off, and
// with any comment trailing it.
ext.packageDeclarationPattern = ~/^\s*package\s+([\w.]+)\s*;?\s*(?:\/\/.*|\/\*.*)?$/

// The package a source file declares, or null for the default package - which
// sits under no root, so no rule can name it.
//
// Read from the declaration rather than inferred from the path, since that is
// what the code below it is compiled into: a source root a consumer laid out its
// own way would otherwise put every file in the wrong package.
ext.readDeclaredPackage = { List<String> lines ->

    for (line in lines) {

        def packageMatcher = packageDeclarationPattern.matcher(line)

        if (packageMatcher.matches()) {
            return packageMatcher.group(1)
        }
    }

    return null
}

// Answers whether a dotted name sits at or under a package root. Compared a
// whole segment at a time rather than as a bare string prefix, so
// `example.frameworks` is not read as living under `example.framework`.
ext.isAtOrUnderPackageRoot = { String dottedName, String packageRoot ->
    return dottedName == packageRoot || dottedName.startsWith(packageRoot + '.')
}

// The package a file sits in, read from its directories, for a gate judging
// markdown, which carries no package declaration. A path under src/ reads as
// <source set>/<language>/<package directories>/<file>; a file directly under
// its language root sits in the default package, read as ''.
//
// Anchored there rather than matched anywhere in the path, so a source set or
// language directory that happens to share a segment with a root is not read as
// the package.
ext.readPathPackage = { List<String> pathSegmentsUnderSrc ->

    return pathSegmentsUnderSrc.size() > 3
        ? pathSegmentsUnderSrc.subList(2, pathSegmentsUnderSrc.size() - 1).join('.')
        : ''
}

// Answers whether a source file sits at or under a package root, judged by the
// package its directories spell.
ext.isPathUnderPackageRoot = { List<String> pathSegmentsUnderSrc, String packageRoot ->
    return isAtOrUnderPackageRoot(readPathPackage(pathSegmentsUnderSrc), packageRoot)
}

// The subtrees a layer leaves out of its root, read off a declaration's
// 'except' - one package or a list, empty when the declaration names none.
//
// Each must sit strictly beneath the root, and anything else is refused where it
// is written: one outside the root exempts nothing the rule reaches, and the
// root itself exempts everything, so either reads in the build as a rule while
// enforcing a different one. 'exactly' takes none, since a package closed alone
// has no subtree to leave out.
ext.readExceptedRoots = { String declaringCall, Map declaration, String layerRoot ->

    if (declaration.except == null) {
        return []
    }

    if (declaration.exactly) {

        throw new GradleException("${declaringCall} leaves subtrees out of an " +
            "'under' root only - a package closed 'exactly' has none to leave " +
            "out; got: ${declaration}")
    }

    def exceptedRoots = readOneOrMany(declaration.except).collect { it.toString() }

    exceptedRoots.each { exceptedRoot ->

        if (exceptedRoot == layerRoot || !isAtOrUnderPackageRoot(exceptedRoot, layerRoot)) {

            throw new GradleException("${declaringCall} 'except' names a package " +
                "strictly beneath its root ${layerRoot}; got: ${exceptedRoot}")
        }
    }

    return exceptedRoots
}

// Answers whether a dotted name sits inside a layer: at or under its root, and
// under none of the subtrees it leaves out.
ext.isInsideLayer = { String dottedName, String layerRoot, List<String> exceptedRoots ->

    return isAtOrUnderPackageRoot(dottedName, layerRoot)
        && !exceptedRoots.any { isAtOrUnderPackageRoot(dottedName, it) }
}

// How a layer reads in a message and in a gate's rule snapshot: its root, then
// the subtrees it leaves out. A rule cleared with a subtree left out must not
// read as UP-TO-DATE against the same rule over all of it, so the snapshot
// carries the whole label.
ext.describeLayer = { String layerRoot, List<String> exceptedRoots ->

    return exceptedRoots.isEmpty()
        ? layerRoot
        : "${layerRoot} except ${exceptedRoots.join(', ')}".toString()
}
