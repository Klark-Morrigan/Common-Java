// The source-text scan the gates reading code are made of: each line of a Java or Kotlin file with
// its comments and literals gone, whether it held a comment, and the class it sits in.
//
// No bytecode-level tool sees a source file's shape cleanly across Java and Kotlin, so the gates
// reading it are source-text passes. None of them can trust a token or a brace until comments and
// literals are gone: a '{' or the word 'class' inside a string would otherwise move the depth or
// open a frame. That stripping, and the class-scope stack the structure gates read a member's class
// off, are the same whichever rule a gate then states over them, so they are held once, here.

apply from: new File(
    buildscript.sourceFile.parentFile,
    'lint-gate.gradle')

// Where one comment's text runs on a line, without its delimiters, and for a block comment whether it
// closes on that line.
@groovy.transform.CompileStatic
final class CommentSpan {

    final int start
    final int end
    final boolean isBlock
    final boolean isClosed

    CommentSpan(int start, int end, boolean isBlock, boolean isClosed) {

        this.start = start
        this.end = end
        this.isBlock = isBlock
        this.isClosed = isClosed
    }
}

// One source line as SourceLineStripper read it:
//
// - raw           the line as written
// - text          the line with comments gone, and literal bodies gone unless literals were kept
// - inBlock       whether a block comment is still open at the end of the line
// - inRaw         whether a triple-quoted string is still open at the end of the line
// - hasComment    whether the line held any comment text, for a gate judging comments as such
// - commentSpans  where each comment's text runs, in order
//
// A class rather than a map, since one is held for every line of every file a build's gates read.
@groovy.transform.CompileStatic
final class StrippedSourceLine {

    final String raw
    final String text
    final boolean inBlock
    final boolean inRaw
    final boolean hasComment
    final List<CommentSpan> commentSpans

    StrippedSourceLine(
            String raw,
            String text,
            boolean inBlock,
            boolean inRaw,
            boolean hasComment,
            List<CommentSpan> commentSpans) {

        this.raw = raw
        this.text = text
        this.inBlock = inBlock
        this.inRaw = inRaw
        this.hasComment = hasComment
        this.commentSpans = commentSpans
    }
}

// Removes comments from one line before any token or brace is read, and with them the bodies of
// string and char literals and Kotlin's backtick-quoted identifiers. Block comments and Kotlin
// triple-quoted strings span lines, so their open state is threaded back in by the caller.
//
// Statically compiled, since it visits every character of every source file a gate reads: a dynamic
// closure per character made it most of the time the gates take.
//
// Known heuristic limit: a quote embedded in Kotlin '${...}' interpolation can end a literal early -
// tolerated, as a heuristic gate can afford to be.
@groovy.transform.CompileStatic
final class SourceLineStripper {

    private static final String LINE_COMMENT_OPENING = '//'
    private static final String BLOCK_COMMENT_OPENING = '/*'
    private static final String BLOCK_COMMENT_CLOSING = '*/'
    private static final String RAW_STRING_QUOTE = '"""'
    private static final char BACKTICK = '`' as char
    private static final char DOUBLE_QUOTE = '"' as char
    private static final char SINGLE_QUOTE = '\'' as char
    private static final char ESCAPE_CHARACTER = '\\' as char

    private SourceLineStripper() {
    }

    // Answers the line stripped. keepsLiterals leaves literal bodies in place, for a gate whose subject
    // can be spelt inside one; kept or not, a literal is read as one, so a '//' or '/*' inside a string
    // opens nothing.
    static StrippedSourceLine stripLine(
            String raw,
            boolean inBlock,
            boolean inRaw,
            boolean keepsLiterals) {

        def keptText = new StringBuilder(raw.length())

        List<CommentSpan> commentSpans = []
        boolean isInBlockComment = inBlock
        boolean isInRawString = inRaw
        boolean hasComment = inBlock
        int position = 0
        int length = raw.length()

        while (position < length) {

            if (isInBlockComment) {

                int closing = raw.indexOf(BLOCK_COMMENT_CLOSING, position)

                commentSpans << new CommentSpan(
                    position,
                    closing < 0 ? length : closing,
                    true,
                    closing >= 0)

                position = (closing < 0 ? length : closing
                    + BLOCK_COMMENT_CLOSING.length())

                isInBlockComment = closing < 0

            } else if (isInRawString) {

                int closing = raw.indexOf(RAW_STRING_QUOTE, position)

                int end = (closing < 0 ? length : closing
                    + RAW_STRING_QUOTE.length())

                keepLiteral(keptText, raw, position, end, keepsLiterals)
                position = end
                isInRawString = closing < 0

            } else if (raw.startsWith(LINE_COMMENT_OPENING, position)) {

                hasComment = true
                commentSpans << new CommentSpan(
                    position + LINE_COMMENT_OPENING.length(),
                    length,
                    false,
                    true)

                position = length

            } else if (raw.startsWith(BLOCK_COMMENT_OPENING, position)) {

                // Its text is read as an open block from here, so a comment ending the line still
                // leaves a span, empty, that a gate tracking open blocks reads.
                hasComment = true
                isInBlockComment = true
                position += BLOCK_COMMENT_OPENING.length()

                if (position == length) {
                    commentSpans << new CommentSpan(length, length, true, false)
                }

            } else if (raw.startsWith(RAW_STRING_QUOTE, position)) {

                keepLiteral(
                    keptText,
                    raw,
                    position,
                    position + RAW_STRING_QUOTE.length(),
                    keepsLiterals)

                isInRawString = true
                position += RAW_STRING_QUOTE.length()

            } else {

                position = readCodeCharacter(
                    keptText,
                    raw,
                    position,
                    keepsLiterals)
            }
        }

        // Stripping only removes text, so a line of the same length lost nothing and shares the raw string.
        def text = keptText.length() == length
            ? raw
            : keptText.toString()

        def spans = commentSpans.isEmpty()
            ? Collections.<CommentSpan>emptyList()
            : commentSpans.asImmutable()

        return new StrippedSourceLine(
            raw,
            text,
            isInBlockComment,
            isInRawString,
            hasComment,
            spans)
    }

    // Reads what opens at position outside any comment or raw string, and answers where it ends. A
    // Kotlin backtick-quoted identifier, such as a test name like `does not bill a null facility`, can
    // hold quotes and braces that are not code; Kotlin processes no escapes inside it and it cannot
    // span lines. A string or char literal steps over escapes, so an escaped quote does not end it.
    // Either left open ends with the line.
    private static int readCodeCharacter(
            StringBuilder keptText,
            String raw,
            int position,
            boolean keepsLiterals) {

        int length = raw.length()
        char opening = raw.charAt(position)

        if (opening == BACKTICK) {

            int closing = raw.indexOf(
                (int) BACKTICK,
                position + 1)

            return closing < 0
                ? length
                : closing + 1
        }

        if (opening != DOUBLE_QUOTE
                && opening != SINGLE_QUOTE) {

            keptText.append(opening)

            return position + 1
        }

        int end = position + 1

        while (end < length
                && raw.charAt(end) != opening) {

            end += raw.charAt(end) == ESCAPE_CHARACTER
                ? 2
                : 1
        }

        end = Math.min(end + 1, length)
        keepLiteral(
            keptText,
            raw,
            position,
            end,
            keepsLiterals)

        return end
    }

    private static void keepLiteral(
            StringBuilder keptText,
            String raw,
            int start,
            int end,
            boolean keepsLiterals) {

        if (keepsLiterals) {
            keptText.append(raw, start, end)
        }
    }
}

// Each file's stripped lines, per build: most files are read by several gates, and stripping is the
// part of a gate's scan that costs. Held on the build rather than the project, so a file is stripped
// once whichever project's gate reaches it first, and dropped when the build ends. A file's size and
// modification time are in its key, so a task rewriting a file mid-build is read afresh.
def STRIPPED_LINES_PROPERTY = 'commonJavaStrippedSourceLines'

if (!gradle.ext.has(STRIPPED_LINES_PROPERTY)) {
    gradle.ext[STRIPPED_LINES_PROPERTY] = new java.util.concurrent.ConcurrentHashMap()
}

def strippedLinesByFile = gradle.ext[STRIPPED_LINES_PROPERTY]

// Every line of a source file as a StrippedSourceLine, carrying the block-comment and raw-string state
// from one line to the next. The list is shared between gates, so it cannot be changed.
ext.readStrippedLines = {
    File sourceFile,
    boolean keepsLiterals = false ->

        def memoKey =
            "${sourceFile.absolutePath}|" +
            "${sourceFile.length()}|" +
            "${sourceFile.lastModified()}|" +
            "${keepsLiterals}"

        return strippedLinesByFile.computeIfAbsent(memoKey.toString()) {

            def isInBlockComment = false
            def isInRawString = false

            sourceFile
                .readLines(sourceEncoding)
                .collect { String rawLine ->

                    def stripped = SourceLineStripper.stripLine(
                        rawLine,
                        isInBlockComment,
                        isInRawString,
                        keepsLiterals)

                    isInBlockComment = stripped.inBlock
                    isInRawString = stripped.inRaw

                    return stripped
                }
                .asImmutable()
        }
    }

// Hands each line of a source file to visitLine as its raw text, its StrippedSourceLine, and its
// 1-based number.
ext.eachSourceLine = {
    File sourceFile,
    boolean keepsLiterals = false,
    Closure visitLine ->

    readStrippedLines(sourceFile, keepsLiterals).eachWithIndex {
        stripped,
        index ->
            visitLine(stripped.raw, stripped, index + 1)
        }
}

// Hands each line of a source file to visitLine as its stripped text and 1-based number.
ext.eachStrippedLine = {
    File sourceFile,
    boolean keepsLiterals = false,
    Closure visitLine ->

        readStrippedLines(sourceFile, keepsLiterals).eachWithIndex {
            stripped,
            index ->
                visitLine(stripped.text, index + 1)
            }
    }

// A class-like declaration that opens a scope, its keyword and its name. The lookbehind rejects a
// Kotlin reference such as 'Foo::class' or 'x.object', which are uses, not declarations. 'enum
// class' is read whole so Kotlin's enum is not read as a class named 'class'; 'object' covers
// Kotlin singletons; 'record' covers Java records.
ext.classDeclarationPattern = ~/(?<![:.\w])(enum\s+class|class|interface|enum|record|object)\s+(\w+)/

// What ends a declaration that never opens a body, when it is met at parenthesis depth zero before
// any '{': a statement end, an initialiser, or the next declaration. A Kotlin class needs no body,
// so 'object Marker' or 'data class Point(val x: Int)' must not hand its frame to the next brace.
def bodilessDeclarationEnd = ~/[;=]|\b(?:fun|val|var|typealias|import|package|init)\b/

// The characters the class-scope walk counts, as chars so a comparison makes no string per character.
def OPENING_PARENTHESIS = '(' as char
def CLOSING_PARENTHESIS = ')' as char
def OPENING_BRACE = '{' as char
def CLOSING_BRACE = '}' as char

/**
 * Walks one source file line by line, handing each line to visitLine with the class scope it sits
 * in.
 *
 * A class frame is a map: name, keyword ('class', 'interface', 'enum', 'record', 'object'), isNested
 * (a @Nested annotation preceded it) and openDepth (the brace depth its body opened at). A gate may
 * keep its own state on the frame it is handed; the same map is handed for every line in the class.
 *
 * visitLine receives one map per line:
 *
 * - text            the line with comments and literals removed
 * - number          the line's 1-based number
 * - braceDepth      the brace depth before this line's own braces
 * - parenDepth      the parenthesis depth before this line's own parentheses; above zero, the line
 *                   continues an argument or parameter list
 * - enclosingClass  the innermost class frame open before this line's own braces, or null at the
 *                   top level; a @Test's verdict reads here, since its method's class is already
 *                   open by the time the annotation is seen
 * - declaredClass   the class this line declares, as a frame without openDepth, or null
 */
ext.scanClassScopes = { File sourceFile, Closure visitLine ->

    def nestedAnnotation = ~/@Nested\b/
    def braceDepth = 0
    def parenDepth = 0

    // One frame per open class scope. The nearest frame is the class a line belongs to.
    def classStack = []
    def isNestedPending = false      // a @Nested seen, awaiting its class
    def pendingClass = null          // a class declaration seen, awaiting its '{'

    eachStrippedLine(sourceFile) { line, lineNumber ->

        def enclosing = classStack.isEmpty()
            ? null
            : classStack.last()

        if (nestedAnnotation.matcher(line).find()) {
            isNestedPending = true
        }

        def declared = null
        def declarationEnd = 0
        def declarationMatcher = classDeclarationPattern.matcher(line)

        if (declarationMatcher.find()) {

            def keyword = declarationMatcher
                    .group(1)
                    .startsWith('enum')
                ? 'enum'
                : declarationMatcher.group(1)

            declared = [
                name: declarationMatcher.group(2),
                keyword: keyword,
                isNested: isNestedPending]

            declarationEnd = declarationMatcher.end()
            pendingClass = declared
            isNestedPending = false
        }

        visitLine([text: line,
            number: lineNumber,
            braceDepth: braceDepth,
            parenDepth: parenDepth,
            enclosingClass: enclosing,
            declaredClass: declared])

        def headerEndPositions = [] as Set
        def endMatcher = bodilessDeclarationEnd.matcher(line)

        while (endMatcher.find()) {
            headerEndPositions << endMatcher.start()
        }

        // Walk braces left to right so a class frame is pushed at its own opening brace and popped
        // at the matching close. A frame is popped only when a '}' lands at the exact depth its
        // body opened at, so lambda and method braces deeper inside never disturb it. Parentheses
        // are counted so a constructor's parameters are not read as the end of its header.
        for (int index = 0;
                index < line.length();
                index++) {

            char ch = line.charAt(index)

            if (pendingClass != null
                    && parenDepth == 0
                    && index >= declarationEnd
                    && index in headerEndPositions) {

                pendingClass = null
            }

            if (ch == OPENING_PARENTHESIS) {

                parenDepth++

            } else if (ch == CLOSING_PARENTHESIS) {

                parenDepth = Math.max(0, parenDepth - 1)

            } else if (ch == OPENING_BRACE) {

                braceDepth++

                if (pendingClass != null) {

                    classStack << (pendingClass + [openDepth: braceDepth])
                    pendingClass = null
                }

            } else if (ch == CLOSING_BRACE) {

                if (!classStack.isEmpty()
                        && classStack.last().openDepth == braceDepth) {

                    classStack.removeAt(classStack.size() - 1)
                }

                braceDepth--
            }
        }
    }
}
