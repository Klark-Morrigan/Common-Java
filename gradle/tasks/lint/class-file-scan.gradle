// The class-file reading the gates judging compiled code are made of: a class file's text constants
// and access flags, which class a file under the build's class trees holds and which tree it was
// compiled from, and the wiring that has a gate read those trees after compilation.
//
// A gate reads class files where a source-text pass cannot be trusted: a class records type names its
// source never spells, and its access flags state what the compiler made of every modifier, Java's
// and Kotlin's alike. The walk over a class file and the layout of the class trees are the same
// whichever rule a gate then states over them, so they are held once, here.

apply from: new File(buildscript.sourceFile.parentFile, 'lint-gate.gradle')

// Constant-pool tags. Only the Utf8 entries are read; the rest are stepped over, a pool being a
// sequence of variable-width entries with no index to seek by.
def CONSTANT_UTF8 = 1
def CONSTANT_INTEGER = 3
def CONSTANT_FLOAT = 4
def CONSTANT_LONG = 5
def CONSTANT_DOUBLE = 6
def CONSTANT_CLASS = 7
def CONSTANT_STRING = 8
def CONSTANT_FIELDREF = 9
def CONSTANT_METHODREF = 10
def CONSTANT_INTERFACE_METHODREF = 11
def CONSTANT_NAME_AND_TYPE = 12
def CONSTANT_METHOD_HANDLE = 15
def CONSTANT_METHOD_TYPE = 16
def CONSTANT_DYNAMIC = 17
def CONSTANT_INVOKE_DYNAMIC = 18
def CONSTANT_MODULE = 19
def CONSTANT_PACKAGE = 20

// The bytes after each fixed-width tag.
def CONSTANT_PAYLOAD_BYTES = [
    (CONSTANT_INTEGER): 4,
    (CONSTANT_FLOAT): 4,
    (CONSTANT_LONG): 8,
    (CONSTANT_DOUBLE): 8,
    (CONSTANT_CLASS): 2,
    (CONSTANT_STRING): 2,
    (CONSTANT_FIELDREF): 4,
    (CONSTANT_METHODREF): 4,
    (CONSTANT_INTERFACE_METHODREF): 4,
    (CONSTANT_NAME_AND_TYPE): 4,
    (CONSTANT_METHOD_HANDLE): 3,
    (CONSTANT_METHOD_TYPE): 2,
    (CONSTANT_DYNAMIC): 4,
    (CONSTANT_INVOKE_DYNAMIC): 4,
    (CONSTANT_MODULE): 2,
    (CONSTANT_PACKAGE): 2,
]

// The eight-byte constants take two pool slots each, which the pool's numbering depends on.
def DOUBLE_WIDTH_CONSTANTS = [CONSTANT_LONG, CONSTANT_DOUBLE]

// What every class file opens with, read as an unsigned four-byte value.
def CLASS_FILE_MAGIC = 0xCAFEBABEL

// What follows the magic number before the constant pool: the minor version (2 bytes), the major (2).
def CLASS_FILE_VERSION_BYTES = 4

// How many unreadable classes a failure names; the cause is a class-file version, so it tends to
// hold for everything compiled.
def UNREADABLE_CLASSES_NAMED = 5

// What a field or method opens with before its attributes: access flags, name index and descriptor
// index, two bytes each.
def MEMBER_HEADER_BYTES = 6

// The class attribute naming the file a class was compiled from.
def SOURCE_FILE_ATTRIBUTE = 'SourceFile'

// The class attribute recording each nested class's own modifiers, which a nested class's top-level
// flags cannot carry: the format has no protected or private class, so javac flags a protected nested
// class public and a private one package-private.
def INNER_CLASSES_ATTRIBUTE = 'InnerClasses'

// Steps over a run of bytes, failing where the file ends first. DataInputStream.skipBytes already
// retries a short skip, so the loop is not for that: skipBytes takes an int where an attribute's
// length is a four-byte unsigned count, and it reports the end of the file only by skipping less.
def skipBytesFully = {
    DataInputStream classBytes,
    long byteCount ->

        def remainingBytes = byteCount

        while (remainingBytes > 0) {

            def skippedBytes = classBytes.skipBytes((int) Math.min(remainingBytes, Integer.MAX_VALUE))
            if (skippedBytes <= 0) {
                throw new EOFException("class file ended inside a run of ${byteCount} bytes")
            }

            remainingBytes -= skippedBytes
        }
    }

// Steps over a table of attributes: a count, then each one's name index and four-byte length.
def skipAttributes = { DataInputStream classBytes ->

    int attributeCount = classBytes.readUnsignedShort()

    attributeCount.times {

        classBytes.readUnsignedShort()
        skipBytesFully(classBytes, classBytes.readInt() & 0xFFFFFFFFL)
    }
}

// Steps over the fields or the methods: a count, then each one's header and attributes.
def skipClassMembers = { DataInputStream classBytes ->

    int memberCount = classBytes.readUnsignedShort()

    memberCount.times {

        skipBytesFully(classBytes, MEMBER_HEADER_BYTES)
        skipAttributes(classBytes)
    }
}

// The nested classes an InnerClasses attribute records, by binary name: each one's own modifiers, and
// the class it is a member of, or null for a local or anonymous class, which is a member of nothing.
def readInnerClasses = { DataInputStream classBytes, Map utf8ByIndex, Map classNameIndexByEntry ->

    def readClassNameAt = { int entry -> utf8ByIndex[classNameIndexByEntry[entry]] }
    def innerClassesByName = [:]
    int innerClassCount = classBytes.readUnsignedShort()

    innerClassCount.times {

        def innerName = readClassNameAt(classBytes.readUnsignedShort())
        int outerEntry = classBytes.readUnsignedShort()

        // The simple name, which no gate reads.
        classBytes.readUnsignedShort()

        innerClassesByName[innerName] = [
            outerName: outerEntry == 0
                ? null
                : readClassNameAt(outerEntry),
            accessFlags: classBytes.readUnsignedShort(),
        ]
    }

    return innerClassesByName
}

// The class attributes past every field and method a gate reads: the file name SourceFile records and
// the nested classes InnerClasses records, each left empty where the compiler wrote none. Every other
// attribute is stepped over.
def readClassAttributes = {
    DataInputStream classBytes,
    Map utf8ByIndex,
    Map classNameIndexByEntry ->

        // This class, its superclass, and the interfaces it implements, two bytes each.
        classBytes.readUnsignedShort()
        classBytes.readUnsignedShort()

        skipBytesFully(
            classBytes,
            2L * classBytes.readUnsignedShort())

        skipClassMembers(classBytes)
        skipClassMembers(classBytes)

        def attributes = [sourceFileName: null, innerClassesByName: [:]]
        int attributeCount = classBytes.readUnsignedShort()

        attributeCount.times {

            def attributeName = utf8ByIndex[classBytes.readUnsignedShort()]
            def attributeLength = classBytes.readInt() & 0xFFFFFFFFL

            if (attributeName == SOURCE_FILE_ATTRIBUTE) {

                attributes.sourceFileName = utf8ByIndex[classBytes.readUnsignedShort()]
                skipBytesFully(classBytes, attributeLength - 2)

            } else if (attributeName == INNER_CLASSES_ATTRIBUTE) {

                attributes.innerClassesByName = readInnerClasses(
                    classBytes,
                    utf8ByIndex,
                    classNameIndexByEntry)

            } else {

                skipBytesFully(classBytes, attributeLength)
            }
        }

        return attributes
    }

// Walks a class file to its access flags and hands the rest of it to readPastFlags. Answers every text
// constant, which is where every type name in a class lives (a class constant holds a name itself, and
// a descriptor spells its types inside a signature), the access flags, which follow the pool, and what
// readPastFlags answers.
//
// Answers only an 'unreadableReason' for a file the walk cannot follow to its flags, so the caller
// fails over it rather than read it as naming nothing and declaring nothing.
def walkClassFile = { File classFile, Closure readPastFlags ->

    def texts = []

    // Kept by pool index as well, since an attribute names its texts and classes by where they sit.
    def utf8ByIndex = [:]
    def classNameIndexByEntry = [:]

    return classFile.withDataInputStream { classBytes ->

        try {

            // Too short to hold the magic number is not a class file either, rather than one cut short.
            if (classFile.length() < Integer.BYTES
                    || (classBytes.readInt() & 0xFFFFFFFFL) != CLASS_FILE_MAGIC) {

                return [
                    unreadableReason: 'it does not open with the class-file magic number, so it is no class file']
            }

            skipBytesFully(classBytes, CLASS_FILE_VERSION_BYTES)

            int poolEntryCount = classBytes.readUnsignedShort()

            // Numbered from one, and the count is one past the last entry.
            for (int entry = 1;
                    entry < poolEntryCount;
                    entry++) {

                int tag = classBytes.readUnsignedByte()

                if (tag == CONSTANT_UTF8) {

                    def text = classBytes.readUTF()

                    texts << text
                    utf8ByIndex[entry] = text
                    continue
                }

                if (tag == CONSTANT_CLASS) {

                    classNameIndexByEntry[entry] = classBytes.readUnsignedShort()
                    continue
                }

                def payloadBytes = CONSTANT_PAYLOAD_BYTES[tag]

                // Stepping on past a tag this walk does not know would report whatever the misalignment
                // spells.
                if (payloadBytes == null) {

                    return [unreadableReason: "its constant pool holds tag ${tag}, which the walk does not " +
                        'know: a tag to add to the walk rather than anything in the code']
                }

                skipBytesFully(classBytes, payloadBytes)

                if (tag in DOUBLE_WIDTH_CONSTANTS) {
                    entry++
                }
            }

            def accessFlags = classBytes.readUnsignedShort()

            return [texts: texts, accessFlags: accessFlags] +
                readPastFlags(classBytes, utf8ByIndex, classNameIndexByEntry)

        } catch (EOFException ignored) {

            return [unreadableReason: 'it ends before its access flags, so it was cut short']
        }
    }
}

// A class file's text constants and access flags, for a gate that reads nothing past them.
ext.readClassConstants = { File classFile ->

    return walkClassFile(classFile) {
        classBytes,
        utf8ByIndex,
        classNameIndexByEntry -> [:] }
}

// A class file's text constants and access flags, plus the file name it says it was compiled from and
// the nested classes it records. A class whose attributes end early still answers, with neither: the
// texts and flags are whole by then.
ext.readClassDeclaration = { File classFile ->

    return walkClassFile(classFile) {
        classBytes,
        utf8ByIndex,
        classNameIndexByEntry ->

            try {
                return readClassAttributes(
                    classBytes,
                    utf8ByIndex,
                    classNameIndexByEntry)
            } catch (EOFException eofException) {
                return [sourceFileName: null, innerClassesByName: [:]]
            }
        }
}

// The class a file holds: its binary name with nesting kept, and the tree it was compiled from.
// Everything under the class trees is <language>/<source set>/<binary name>.
ext.readCompiledClass = {
    File classFile,
    File classesDir ->

        def compiledPath = classesDir
            .toPath()
            .relativize(classFile.toPath())
            .toString()
            .replace(File.separator, '/')
            .replaceFirst(/\.class$/, '')

        def pathSegments = compiledPath.split('/')

        if (pathSegments.length <= 2) {
            return [
                binaryName: compiledPath,
                compiledFrom: '',
                sourceSet: '',
                language: '']
        }

        return [
            binaryName: pathSegments[2..-1].join('/'),
            sourceSet: pathSegments[1],
            language: pathSegments[0],
            // One class name can be compiled from more than one tree.
            compiledFrom: " in ${pathSegments[0]}/${pathSegments[1]}",
        ]
    }

// The source directories a language's classes are conventionally compiled from, its own first. The
// Kotlin plugin also compiles the Kotlin files kept under src/<source set>/java.
def SOURCE_DIRECTORIES_BY_LANGUAGE = [
    kotlin: ['kotlin', 'java'],
]

// The source file a class was compiled from, as a path from the project directory, or null where it
// cannot be placed: the class records no source file name, or no conventional path holds one, as for
// a source set rooted elsewhere or generated code. Placed by the conventional layout,
// src/<source set>/<language>/<package directories>/<file>, and confirmed on disk, so a path a finding
// prints always opens.
ext.findSourcePath = {
    Map compiledClass,
    String sourceFileName,
    File projectDirectory ->

        if (!sourceFileName
                || !compiledClass.language) {

            return null
        }

        def lastSlash = compiledClass
            .binaryName
            .lastIndexOf('/')

        def packagePath = lastSlash < 0
            ? ''
            : compiledClass
                .binaryName
                .substring(0, lastSlash + 1)

        def sourceDirectories = SOURCE_DIRECTORIES_BY_LANGUAGE[compiledClass.language]
            ?: [compiledClass.language]

        return sourceDirectories
            .collect { "src/${compiledClass.sourceSet}/${it}/${packagePath}${sourceFileName}".toString() }
            .find { new File(projectDirectory, it).isFile() }
    }

// A rule's 'inSourceSets' as sorted names, empty for every source set. Sorted so the rule snapshot does
// not turn on declaration order.
ext.readSourceSetNames = { Object inSourceSets ->

    return readOneOrMany(inSourceSets)
        .collect { it.toString() }
        .sort()
}

// A misspelt source set matches no compiled tree, so its rule would check nothing and pass. Each rule
// carries its source sets as 'sourceSets'; describeRule names it the way its declaration reads.
ext.failOnUnknownSourceSets = {
    List rules,
    List knownSourceSets,
    Closure describeRule ->

        rules.each { rule ->

            def unknownSourceSets = rule
                .sourceSets
                .findAll { !(it in knownSourceSets) }

            if (!unknownSourceSets.isEmpty()) {

                throw new GradleException(
                    "${describeRule(rule)} names " +
                    "source set(s) ${unknownSourceSets} this build does not have; " +
                    "it has ${knownSourceSets}")
            }
        }
    }

// A class the walk cannot follow was checked for nothing, which looks like a pass, so this is raised
// before the findings, which are incomplete while it holds. Each entry is a class with the reason
// readClassConstants or readClassDeclaration gave for it.
ext.failOnUnreadableClasses = { List unreadableClasses ->

    if (unreadableClasses.isEmpty()) {
        return
    }

    def namedClasses = unreadableClasses
        .sort()
        .take(UNREADABLE_CLASSES_NAMED)

    def unnamedCount = unreadableClasses.size() - namedClasses.size()
    def remainder = unnamedCount > 0
        ? "\n  and ${unnamedCount} more"
        : ''

    throw new GradleException(
        "Classes this gate could not read, so nothing in them was checked:\n  " +
        namedClasses.join('\n  ') + remainder)
}

// One entry for failOnUnreadableClasses: the class, and why its file could not be followed.
ext.describeUnreadableClass = {
    Map compiledClass,
    Map classFileRead ->

        return (
            "${compiledClass.binaryName}${compiledClass.compiledFrom}: " +
            "${classFileRead.unreadableReason}")
    }

// Everything the build compiles, taken as the directory the language plugins write into rather than
// from the source sets: a consumer declares its own source sets after the conventions apply a gate,
// and the directory is also what the JAR is built from.
ext.compiledClassesRoot = layout
    .buildDirectory
    .dir('classes')

// Has a gate read the class trees after compilation, and answers those trees' class files as its
// scanned input.
//
// Compilation is matched live and two ways, so a consumer's other languages are covered without this
// script naming them: by type for Gradle's own compile tasks, by name for Kotlin's, which are not
// AbstractCompile.
ext.declareScannedClasses = { Task gate ->

    gate.dependsOn tasks.withType(AbstractCompile)
    gate.dependsOn tasks.matching {
        it.name.startsWith('compile') &&
        it.name.endsWith('Kotlin') }

    return declareScannedFiles(
        gate,
        compiledClassesRoot,
        ['**/*.class'],
        'scannedClasses')
}

// The build's source set names, read when the gate runs, since a consumer declares its own source
// sets after a gate is applied. Declared an input too, so a source set added later re-runs the gate
// against the rules naming it.
ext.declareSourceSetNames = { Task gate ->

    def sourceSetNames = gate
        .project
        .providers
        .provider {

            gate.project
                .extensions
                .findByName('sourceSets')
                ?.names
                ?.toList()
                ?.sort()
                ?: []
        }

    gate.inputs
        .property('sourceSetNames', sourceSetNames)

    return sourceSetNames
}
