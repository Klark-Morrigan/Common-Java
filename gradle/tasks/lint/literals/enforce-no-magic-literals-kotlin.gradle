// Magic-literal gate for Kotlin sources.
//
// The convention: "named constants good, loose literals bad" on Kotlin (magic
// numbers). It is enforced with the detekt CLI - resolved as a dependency and run
// as a JavaExec task - rather than the detekt Gradle plugin, because the plugin's
// stable line tops out at Gradle 8; the CLI is a plain jar and so runs under any
// Gradle. The shared rule config lives at gradle/detekt.yml, three levels up.
//
// Scope: the Kotlin of every source set except test, whose data and fixtures are
// literal-heavy by nature. Checkstyle's MagicNumber draws the same line for Java.
// A project with no Kotlin skips the JVM launch entirely. mavenCentral, needed to
// resolve the CLI, is the consuming build's to declare; java-conventions does.

apply from: new File(buildscript.sourceFile.parentFile, '../lint-gate.gradle')

// The detekt CLI and its transitive deps, kept in their own configuration so
// the lint tool never leaks onto a compile classpath or into the project's jar.
configurations {
    detektCli
}

dependencies {
    detektCli 'io.gitlab.arturbosch.detekt:detekt-cli:1.23.8'
}

def kotlinSourceIncludes = ['**/*.kt']

def enforceNoMagicLiteralsKotlin = tasks.register('enforceNoMagicLiteralsKotlin', JavaExec) {
    description = 'Fails the build when a Kotlin source uses a magic number ' +
            'instead of a named constant.'
    group = 'verification'

    // Refused in the terms of what the gate needs, rather than left to surface as a
    // missing property from inside the scan.
    if (!project.pluginManager.hasPlugin('java')) {
        throw new GradleException('enforceNoMagicLiteralsKotlin needs the java plugin: it reads ' +
            "the project's source sets to find the Kotlin it judges.")
    }

    // Lazy, because a project declares its own source sets after this script is applied.
    def judgedSources = project.provider {
        sourceSets.toList()
            .findAll { sourceSet -> sourceSet.name != SourceSet.TEST_SOURCE_SET_NAME }
            .collect { sourceSet -> sourceSet.allSource }
    }

    // Declared as inputs so an unchanged tree lets Gradle skip the JVM launch.
    def kotlinFiles = declareScannedFiles(it, judgedSources, kotlinSourceIncludes)

    // Resolve the shared rule config relative to THIS script, not the
    // consumer's rootDir, so it holds for every consumer alike.
    def detektConfig = new File(buildscript.sourceFile.parentFile, '../../../detekt.yml')

    inputs.files(detektConfig).withPropertyName('detektConfig')

    onlyIf { !kotlinFiles.isEmpty() }

    classpath = configurations.detektCli
    mainClass = 'io.gitlab.arturbosch.detekt.cli.Main'

    // --config alone (no --build-upon-default-config) runs only the rules the
    // config names. detekt exits non-zero on any finding, which fails the
    // JavaExec - the gate's verdict. The source directories rather than the
    // files, so a large tree cannot outgrow a command line.
    argumentProviders.add({
        def judgedDirectories = judgedSources.get()
            .collectMany { sources -> sources.srcDirs }
            .findAll { directory -> directory.exists() }

        return ['--config', detektConfig.absolutePath,
                '--input', judgedDirectories*.absolutePath.join(',')]
    } as CommandLineArgumentProvider)
}

installLintGate(enforceNoMagicLiteralsKotlin)
