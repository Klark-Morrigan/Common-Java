// ID-casing gate: the abbreviation is spelt "ID" wherever it is written as English, and stays lower case
// wherever it is quoted as code.
//
// "ID" abbreviates "identification", while `id` is the spelling of a field. A sentence written beside
// `entity.getId()` borrows the casing of the symbol it describes, and left alone that drift wins by volume.
//
// So the gate's difficulty is telling prose from code, and nearly all of it is spent not firing:
//
//   - a backticked `id`, a {@code id}, a <pre> sample or a fenced block is quoted source;
//   - the token after @param is a parameter's name, not a noun;
//   - `mod-id`, `entity.id` and `field_id` are file, path and column spellings;
//   - in Java and Kotlin only comment text is judged, so no identifier, string or column is ever reached.
//
// The spelling of an abbreviation is the same in every repository, so the gate owns the whole rule. A consuming
// build declares only the prose it carries without authoring, which it cannot restyle:
//
//     enforceIdCasing {
//         exemptPath glob: 'docs/vendor/**/*.md'
//     }

apply from: new File(buildscript.sourceFile.parentFile, '../markdown-scan.gradle')
apply from: new File(buildscript.sourceFile.parentFile, '../source-scan.gradle')

// The misspellings, as whole words. `Id` and `Ids` are listed because a sentence-initial "Id" is the same
// error wearing a capital: the abbreviation is two capitals or it is code.
//
// Neighbours are excluded by lookarounds rather than a word boundary: `\b` would match the `id` inside
// `mod-id` and `entity.id`, which are a file name and a dotted path.
def proseIdPattern = ~/(?<![\p{L}\p{N}_\-.\/])(id|ids|Id|Ids)(?![\p{L}\p{N}_\-.\/])/

// Spans a line may contain that are code rather than prose. Quoted text and &lt;...&gt; placeholders are
// included because a comment that quotes something is quoting a literal, not speaking English.
def codeSpanPattern = ~(markdownCodeSpanPattern.pattern() +
    /|\{@(?:code|link|linkplain|literal)[^}]*\}|<code>.*?<\/code>/ +
    /|\]\([^)]*\)|https?:\/\/\S+|"[^"]*"|&lt;[^&]*&gt;/)

// An indented Markdown line opening with a brace, quote or tag is a code block rather than a wrapped list
// item, which is the only other thing that deep in a document.
def indentedCodeLinePattern = ~/^\s{4,}[\{\}"<]/

// The token after @param names a parameter and keeps the source's casing.
def paramTagPattern = ~/^(\s*\*?\s*@param\s+)(\S+)/

def lineCommentOpening = '//'
def blockCommentOpening = '/*'
def blockCommentClosing = '*/'
def preOpeningTag = '<pre>'
def preClosingTag = '</pre>'

// A NUL character, which no source line holds, appended to a line prefix before it is stripped. The source
// scan keeps it only when the prefix ends in code, so it tells a '//' or '/*' that opens a comment from one
// inside a literal.
def codeProbe = '\u0000'

// Rewrites every code span to spaces of the same width, so what remains is the prose of the line with its
// columns intact.
def readProseOf = { String line ->

    def prose = new StringBuilder(line)
    def matcher = codeSpanPattern.matcher(line)

    while (matcher.find()) {

        for (int index = matcher.start(); index < matcher.end(); index++) {
            prose.setCharAt(index, ' ' as char)
        }
    }

    return prose.toString()
}

// The prose lines of a Markdown file, paired with the line each sits on.
def readMarkdownProse = { File sourceFile ->

    def proseLines = []

    visitLinesOutsideFences(sourceFile) { String line, int lineNumber ->

        if (!indentedCodeLinePattern.matcher(line).find()) {
            proseLines << [text: readProseOf(line), line: lineNumber]
        }
    }

    return proseLines
}

// Answers whether a raw line is in code at index, given the comment and raw-string state it opened in.
def isCodeAt = { String rawLine, int index, boolean isInBlock, boolean isInRaw ->

    def probed = stripSourceLine(rawLine.substring(0, index) + codeProbe, isInBlock, isInRaw)

    return probed.text.endsWith(codeProbe)
}

// Where the next comment opens at or after position, or -1 when none does.
def findCommentOpening = { String rawLine, int position, boolean isInBlock, boolean isInRaw ->

    for (int index = position; index < rawLine.length() - 1; index++) {

        def isOpening = rawLine.startsWith(lineCommentOpening, index) || rawLine.startsWith(blockCommentOpening, index)

        if (isOpening && isCodeAt(rawLine, index, isInBlock, isInRaw)) {
            return index
        }
    }

    return -1
}

// A block comment's text from textStart to its closing on this line, or to the end of the line when it runs on.
def readBlockComment = { String rawLine, int textStart ->

    def closing = rawLine.indexOf(blockCommentClosing, textStart)
    def textEnd = closing < 0 ? rawLine.length() : closing

    return [text: rawLine.substring(textStart, textEnd),
        isBlock: true,
        isClosed: closing >= 0,
        end: textEnd + (closing < 0 ? 0 : blockCommentClosing.length())]
}

// The comments one raw line holds, in order, each as its text without delimiters. Found by the source scan's
// own literal and comment rules, so a comment opening after code is read and a '//' inside a string is not.
def readLineComments = { String rawLine, boolean isInBlock, boolean isInRaw ->

    def comments = []
    def position = 0

    if (isInBlock) {

        def continued = readBlockComment(rawLine, 0)

        comments << continued

        if (!continued.isClosed) {
            return comments
        }

        position = continued.end
    }

    def opening = findCommentOpening(rawLine, position, isInBlock, isInRaw)

    while (opening >= 0) {

        if (rawLine.startsWith(lineCommentOpening, opening)) {

            comments << [text: rawLine.substring(opening + lineCommentOpening.length()), isBlock: false]
            return comments
        }

        def block = readBlockComment(rawLine, opening + blockCommentOpening.length())

        comments << block

        if (!block.isClosed) {
            return comments
        }

        opening = findCommentOpening(rawLine, block.end, isInBlock, isInRaw)
    }

    return comments
}

// The comment text of a Java or Kotlin file, paired with the line each comment sits on. A <pre> sample inside
// a block comment is dropped whole, up to its closing tag or the end of its comment.
//
// Everything else in the file is invisible to the gate, so no identifier, literal or column can be reported
// and the gate can never ask for a rename.
def readCodeComments = { File sourceFile ->

    def commentLines = []
    def isInBlock = false
    def isInRaw = false
    def isInPre = false

    sourceFile.readLines(sourceEncoding).eachWithIndex { String rawLine, int index ->

        readLineComments(rawLine, isInBlock, isInRaw).each { comment ->

            if (comment.isBlock && (isInPre || comment.text.contains(preOpeningTag))) {

                isInPre = !comment.text.contains(preClosingTag) && !comment.isClosed
                return
            }

            commentLines << [text: readProseOf(comment.text), line: index + 1]
        }

        def stripped = stripSourceLine(rawLine, isInBlock, isInRaw)

        isInBlock = stripped.inBlock
        isInRaw = stripped.inRaw
    }

    return commentLines
}

// Blanks the token after @param before the line is judged.
def readJavadocProse = { String text ->

    def paramTag = paramTagPattern.matcher(text)

    if (!paramTag.find()) {
        return text
    }

    return text.substring(0, paramTag.end(1)) + ' ' * paramTag.group(2).length() + text.substring(paramTag.end(2))
}

// Reports one message per misspelling the file says.
def findMisspeltIds = { List proseLines, String reportedPath, boolean isCode ->

    def found = []

    proseLines.each { proseLine ->

        def text = isCode ? readJavadocProse(proseLine.text) : proseLine.text
        def matcher = proseIdPattern.matcher(text)

        while (matcher.find()) {

            found << "${reportedPath}:${proseLine.line}: prose says \"${matcher.group()}\"; the abbreviation is " +
                '"ID" (backtick it instead if it names code)'
        }
    }

    return found
}

def exemptGlobs = []

def enforceIdCasing = tasks.register('enforceIdCasing') {

    description = 'Fails the build when prose spells the abbreviation "id" rather than "ID".'
    group = 'verification'

    // Exempts every file a path glob matches. A glob rather than a single path because the case this exists
    // for is a family of files: a vendored or generated tree, where restyling the text would edit somebody
    // else's copy.
    ext.exemptPath = { Map exemption ->

        if (!exemption.glob) {

            throw new GradleException("exemptPath needs 'glob' (the project-relative path pattern to leave " +
                "unjudged); got: ${exemption}")
        }

        exemptGlobs << exemption.glob
    }

    // Code is scanned under src/ only, and only its comments are read. Both trees are rooted at the project,
    // so an exemption glob is matched against the same relative path it is written in.
    def scannedMarkdown = declareMarkdownFiles(it, 'scannedMarkdown')
    def scannedCode = declareScannedFiles(it, createAuthoredFileTree(projectDir),
        jvmSourceIncludes.collect { "src/${it}".toString() }, 'scannedCode')

    declareRuleSnapshot(it, 'exemptGlobs') { exemptGlobs }

    doLast {

        def violations = []

        // Matched by the same Ant globbing a fileTree include uses, so an exemption means what it would mean
        // anywhere else in the build.
        def exemptionSpecs = exemptGlobs.collectEntries { [(it): new PatternSet().include(it).asSpec] }
        def matchedGlobs = [] as Set

        def judgeFile = { FileVisitDetails details, boolean isCode ->

            if (details.directory) {
                return
            }

            def matchingGlobs = exemptionSpecs.findAll { it.value.isSatisfiedBy(details) }*.key

            if (!matchingGlobs.isEmpty()) {

                matchedGlobs.addAll(matchingGlobs)
                return
            }

            def proseLines = isCode ? readCodeComments(details.file) : readMarkdownProse(details.file)

            violations.addAll(findMisspeltIds(proseLines, details.path, isCode))
        }

        scannedMarkdown.visit { judgeFile(it, false) }
        scannedCode.visit { judgeFile(it, true) }

        // An exemption matching nothing is dead config: it excuses no file, and the prose it was written for is
        // loose again the moment the path it meant comes back under another name.
        exemptGlobs.findAll { !(it in matchedGlobs) }.each {
            violations << "${it}: exemptPath matches no file, so it exempts nothing"
        }

        failOnViolations('Lower-case "id" in prose', violations)
    }
}

installLintGate(enforceIdCasing)
