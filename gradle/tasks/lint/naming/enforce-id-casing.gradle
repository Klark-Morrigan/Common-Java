// ID-casing gate, applied by java-conventions.gradle into every KM project. It
// keeps the abbreviation spelt "ID" wherever it is being written as English,
// and leaves it lower case wherever it is being quoted as code.
//
// The rule exists because the two spellings are not a style toss-up: "ID" is
// the standard abbreviation of "identification", while `id` is the spelling of
// a field. Prose drifts to the lower-case form on its own, because a sentence
// written beside `market.getId()` borrows the casing of the symbol it is
// describing. Left alone the drift wins by sheer volume - one sweep of the KM
// trees found lower-case prose outnumbering "ID" several hundred to a handful -
// and the repositories end up spelling an English word the way a Java field is
// spelt.
//
// So the gate's whole difficulty is telling prose from code, and nearly all of
// it is spent NOT firing:
//
//   - a backticked `id`, a {@code id}, a <pre> sample or a fenced block is
//     source being quoted, and keeps the casing the source has;
//   - the token after @param is a parameter's name, not a noun;
//   - `mod-id`, `entity.id` and `field_id` are file, column and path spellings;
//   - in Java and Kotlin only comment text is judged at all, so no identifier,
//     string or CSV column is ever reached.
//
// What is left - a bare "id" in a sentence - is the drift, and is reported.
//
// It sits beside enforce-no-test-vocabulary rather than under structure/
// because both judge the words a tree is written in rather than how the tree is
// arranged. It differs in owning no per-project vocabulary at all: the correct
// spelling of an abbreviation is the same in every repository, so a consuming
// build declares only the paths it wants left alone.
//
// A consuming build declares only its exemptions:
//
//     enforceIdCasing {
//         exemptPath glob: 'docs/dev/implementation/**/plan.md'
//         exemptPath glob: 'docs/dev/implementation/**/problem.md'
//     }
//
// A build that declares nothing still gets the gate, which is what lets the
// conventions file apply it everywhere rather than leaving each consumer to opt
// in.

// Applied by this script, not assumed from the conventions file: the gate is
// applied on its own by its integration test, so it has to carry what it uses.
apply from: new File(buildscript.sourceFile.parentFile, '../lint-gate-stamp.gradle')

// The misspellings, as whole words. `Id` and `Ids` are listed beside the bare
// lower-case forms because a sentence-initial "Id" is the same error wearing a
// capital - the abbreviation is two capitals or it is code.
//
// Neighbours that make a token part of a larger spelling are excluded by the
// lookarounds rather than by a word boundary: `\b` would happily match the `id`
// inside `mod-id` and `entity.id`, which are a file name and a dotted path.
// A word character is excluded for the obvious reason - `modId` and `valid` say
// no such word.
def proseIdPattern = ~/(?<![\p{L}\p{N}_\-.\/])(id|ids|Id|Ids)(?![\p{L}\p{N}_\-.\/])/

// Spans a line may contain that are code rather than prose, skipped wherever
// they sit. Quoted text and &lt;...&gt; placeholders are included because a
// comment that quotes something is quoting a literal, not speaking English.
def codeSpanPattern = ~(/`[^`]*`|\{@(?:code|link|linkplain|literal)[^}]*\}|<code>.*?<\/code>/
    + /|\]\([^)]*\)|https?:\/\/\S+|"[^"]*"|&lt;[^&]*&gt;/)

// The file types prose lives in. Markdown is scanned across the whole project
// the way the doc-links gate scans it, because a repository's longest prose -
// its READMEs - sits outside src/. Code is scanned under src/ only, and only
// its comments are read.
def markdownInclude = '**/*.md'
def codeIncludes = ['**/*.java', '**/*.kt']

// Directories whose contents are generated, copied or vendored rather than
// authored. Scanning them would report a violation against a file nobody edits
// and tie the gate's up-to-dateness to build artefacts.
def excludedDirectoryNames = [
    '.git', '.gradle', 'build', 'bin', 'out', 'node_modules',
    'graphify-out', '.sources-cache',
]

// Rewrites every code span to spaces of the same width, so what remains is the
// prose of the line with its columns intact. Blanking rather than deleting is
// what lets a reported column still point at the word a reader sees.
def readProseOf = { String line ->

    def prose = new StringBuilder(line)
    def matcher = codeSpanPattern.matcher(line)

    while (matcher.find()) {

        for (int index = matcher.start(); index < matcher.end(); index++) {
            prose.setCharAt(index, ' ' as char)
        }
    }
    return prose.toString()
}

// The prose lines of a Markdown file, paired with the line each sits on.
// Fenced blocks are dropped whole: everything between a pair of fences is
// source, however it is spelt.
def readMarkdownProse = { File sourceFile ->

    def proseLines = []
    def inFence = false

    sourceFile.eachLine { line, lineNumber ->

        if (line =~ /^\s*(```|~~~)/) {
            inFence = !inFence
            return
        }
        // An indented block opening with a brace, quote or tag is a code block
        // rather than a wrapped list item, which is the only other thing this
        // deep in a KM document.
        if (inFence || line =~ /^\s{4,}[\{\}"<]/) {
            return
        }
        proseLines << [text: readProseOf(line), line: lineNumber]
    }
    return proseLines
}

// The comment lines of a Java or Kotlin file, paired with the line each sits
// on. Block comments are tracked across lines, a <pre> sample inside one is
// dropped whole, and a trailing // on a code line contributes just its tail.
//
// Everything else in the file is invisible to the gate. That is deliberate and
// is what makes the rule safe to enforce: no identifier, literal or resource
// column can be reported, so the gate can never ask for a rename.
def readCodeComments = { File sourceFile ->

    def commentLines = []
    def inBlock = false
    def inPre = false

    sourceFile.eachLine { line, lineNumber ->

        if (inPre) {

            if (line =~ /<\/pre>/) {
                inPre = false
            }
            if (line =~ /\*\//) {
                inBlock = false
            }
            return
        }
        if ((inBlock || line =~ /^\s*\/\*/) && line =~ /<pre>/) {

            inPre = !(line =~ /<\/pre>/)
            return
        }

        if (inBlock) {

            commentLines << [text: readProseOf(line), line: lineNumber]

            if (line =~ /\*\//) {
                inBlock = false
            }
            return
        }
        if (line =~ /^\s*\/\*/) {

            commentLines << [text: readProseOf(line), line: lineNumber]

            if (!(line =~ /\*\//)) {
                inBlock = true
            }
            return
        }
        // A // inside a string literal opens no comment. Counted rather than
        // parsed: an odd number of quotes before it means it is quoted text.
        def lineComment = line =~ /^(.*?)(\/\/.*)$/

        if (lineComment.find()) {

            def code = lineComment.group(1)
            def quotes = (code =~ /(?<!\\)"/).count

            if (quotes % 2 == 0) {
                commentLines << [text: readProseOf(lineComment.group(2)), line: lineNumber]
            }
        }
    }
    return commentLines
}

// The token immediately after @param names a parameter and keeps the source's
// casing, so it is blanked before the line is judged.
def readJavadocProse = { String text ->

    def paramTag = text =~ /^(\s*\*?\s*@param\s+)(\S+)/

    if (paramTag.find()) {

        return text.substring(0, paramTag.end(1))
            + ' ' * paramTag.group(2).length()
            + text.substring(paramTag.end(2))
    }
    return text
}

// Reports one message per misspelling the file says.
def findMisspeltIds = { List proseLines, String reportedPath, boolean isCode ->

    def found = []

    proseLines.each { proseLine ->

        def text = isCode ? readJavadocProse(proseLine.text) : proseLine.text
        def matcher = proseIdPattern.matcher(text)

        while (matcher.find()) {

            found << ("${reportedPath}:${proseLine.line}: prose says "
                + "\"${matcher.group()}\"; the abbreviation is \"ID\" "
                + '(backtick it instead if it names code)')
        }
    }
    return found
}

// Filled by the consuming build through the task's own declarations, so they
// are captured here rather than inside the task: the execution-time action
// reads the same list the declarations appended to.
def exemptGlobs = []

def enforceIdCasing = tasks.register('enforceIdCasing') {

    description = ('Fails the build when prose spells the abbreviation "id" '
        + 'rather than "ID".')

    group = 'verification'

    // Exempts every file a path glob matches. A glob rather than a single path
    // because the case this exists for is a family of files - the landed
    // plan.md and problem.md under each implementation folder, which are frozen
    // records of a decision rather than live prose to restyle.
    //
    // Named arguments rather than positional ones, matching the sibling gates:
    // every value is plain text, so a transposition would otherwise be silently
    // accepted.
    ext.exemptPath = { Map exemption ->

        if (!exemption.glob) {

            throw new GradleException("exemptPath needs 'glob' (the "
                + "project-relative path pattern to leave unjudged); "
                + "got: ${exemption}")
        }
        exemptGlobs << exemption.glob
    }

    // Declared as the matched files rather than as the directories: an absent
    // tree is then an empty scan rather than the configuration failure a
    // declared-but-missing input directory would be.
    def isInExcludedDirectory = { element ->
        element.relativePath.segments.any { it in excludedDirectoryNames }
    }

    def scannedMarkdown = fileTree(projectDir) {
        include markdownInclude
        // Matched against every segment rather than the first, so an excluded
        // directory nested inside the tree is skipped too.
        exclude isInExcludedDirectory
    }

    def scannedCode = fileTree('src') {
        include codeIncludes
        exclude isInExcludedDirectory
    }

    inputs.files(scannedMarkdown).withPropertyName('scannedMarkdown')
    inputs.files(scannedCode).withPropertyName('scannedCode')

    // The exemptions are inputs too, wrapped in a provider because they are
    // declared after this registration runs: adding one has to re-run the gate
    // rather than leave it UP-TO-DATE against the list it last cleared under.
    inputs.property('exemptGlobs', providers.provider { exemptGlobs.sort() })

    doLast {

        def violations = []
        def projectPath = projectDir.toPath()

        // Each glob resolved to the files it actually matches, by the same Ant
        // globbing a fileTree include uses - so an exemption means on disk what
        // it would mean anywhere else in the build, rather than whatever a
        // hand-rolled path comparison happened to implement.
        def filesPerGlob = exemptGlobs.collectEntries { glob ->
            [(glob): fileTree(projectDir) { include glob }.files]
        }

        def exemptFiles = filesPerGlob.values().flatten() as Set

        def judge = { File sourceFile, boolean isCode ->

            if (sourceFile in exemptFiles) {
                return
            }
            // Reported as one path spelling: project-relative with forward
            // slashes, so a report is clickable from the project root and reads
            // the same on every machine.
            def reportedPath = projectPath.relativize(sourceFile.toPath())
                .toString()
                .replace('\\', '/')

            def proseLines = isCode
                ? readCodeComments(sourceFile)
                : readMarkdownProse(sourceFile)

            violations.addAll(findMisspeltIds(proseLines, reportedPath, isCode))
        }

        scannedMarkdown.each { judge(it, false) }
        scannedCode.each { judge(it, true) }

        // An exemption matching nothing is dead config: it excuses no file, and
        // the prose it was written for is loose again the moment the path it
        // meant comes back under another name. Reported rather than ignored,
        // because a silent no-op is the exact failure this family of gates
        // exists to remove - one level up.
        def strandedGlobs = filesPerGlob.findAll { it.value.isEmpty() }*.key

        strandedGlobs.each {
            violations << "${it}: exemptPath matches no file, so it exempts nothing"
        }

        if (!violations.isEmpty()) {
            // GradleException is the idiomatic build-failure signal; its clean
            // message reads as the gate's verdict. The editor flags it as an
            // unresolved class because an applied script has no Gradle API on
            // its classpath - a known tooling false positive, not a defect, so
            // do not "fix" it by swapping in a java.lang exception.
            throw new GradleException("Lower-case \"id\" in prose:\n  "
                + violations.join('\n  '))
        }
    }
}

// Give the gate an output so it can be skipped while the sources it reads are
// unchanged; see lint-gate-stamp.gradle.
declareLintGateStamp(enforceIdCasing)

// Run the gate as part of the standard verification lifecycle so both a local
// 'build'/'check' and CI's 'test jar' trip it before tests execute.
tasks.matching { it.name in ['test', 'check'] }.configureEach {
    dependsOn enforceIdCasing
}
