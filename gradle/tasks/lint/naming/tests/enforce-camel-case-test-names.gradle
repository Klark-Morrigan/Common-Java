// Test-method naming gate, applied by java-conventions.gradle into every consumer. Sits beside the
// double-naming gates (enforce-suffix-on-fakes.gradle, enforce-suffix-on-mocks.gradle) as the same
// kind of concern keyed on the method rather than on what a variable holds.
//
// The convention: a test method is named in camelCase, like every other method in the family. Both
// spellings read fine on their own, so what makes this a gate is that a tree carrying both is worse
// than a tree carrying either - a reader scanning a report cannot tell a suite's own style from a
// slip, and neither can whoever writes the next case. Nothing in a compiler or a test runner has an
// opinion, so a mixed tree drifts further apart with every suite added.
//
// Kotlin's backtick-quoted names are deliberately untouched. `does not bill a null facility` is the
// language's own idiom for a test name, is not an identifier a camelCase rule can be stated over,
// and is stripped out below with the string literals.
//
// The rule is keyed on an underscored identifier that opens a call, which catches a declaration and
// any call of one alike - the declaration is in the same tree, so flagging both only says the same
// thing twice rather than reaching anything the gate cannot fix. A snake_case string (a faction id,
// an entity type, a settings key) is data rather than a name and is left alone: the strip below
// takes the literals out before the rule ever sees them.
//
// Line-local, so it does not use the enclosing-scope tracking enforce-tests-nested.gradle needs -
// that gate has to know which class a @Test sits in, while this one can read its verdict off the
// line the name is written on.
//
// Applied by this script, not assumed from the conventions file: the gate is applied on its own by
// its integration test, so it has to carry what it uses.
apply from: new File(buildscript.sourceFile.parentFile, '../../lint-gate-stamp.gradle')

def enforceCamelCaseTestNames = tasks.register('enforceCamelCaseTestNames') {

    description = 'Fails the build when a test method is named in snake_case ' +
        'rather than camelCase.'

    group = 'verification'

    // Both trees a test name can live in. Fixtures are held to the same rule as the cases that
    // drive them: a helper is read in a report exactly as a case is.
    def testRoots = ['src/test', 'src/testFixtures'].collect { file(it) }

    // Declare only the roots that exist: Gradle validates a declared input directory is present, so
    // a project with no tests would otherwise fail configuration rather than skip. The scan guards
    // the same absence at execution time.
    testRoots.eachWithIndex {
        root,
        index ->
            if (root.exists()) {
                inputs.dir(root).withPropertyName("testSources${index}")
            }
        }

    doLast {
        // An identifier carrying an underscore that opens a call. The lookbehind keeps a qualified
        // call ('fixtures.a_b()') in scope while refusing to start mid-identifier, and the leading
        // lower-case letter leaves a CONSTANT_NAME( alone - a constant is not a method name, and
        // the enum constants of a switch would otherwise read as violations.
        def snakeCallName = ~/(?<![.\w])([a-z][A-Za-z0-9]*(?:_[A-Za-z0-9]+)+)\s*\(/

        // Removes what is not code from one line before the rule reads it: line comments, block
        // comments, string and character literals, and Kotlin's backtick-quoted identifiers. Block
        // comments span lines, so their open state is threaded back in by the caller.
        def stripLine = { String raw, boolean inBlock ->

            def out = new StringBuilder()
            def index = 0
            def length = raw.length()
            def block = inBlock

            while (index < length) {

                if (block) {

                    if (index + 1 < length && raw[index] == '*' && raw[index + 1] == '/') {

                        block = false
                        index += 2

                    } else {
                        index++
                    }
                    continue
                }

                def two = (index + 1 < length) ? raw.substring(index, index + 2) : ''

                if (two == '//') {

                    break
                }
                if (two == '/*') {

                    block = true
                    index += 2
                    continue
                }

                def character = raw[index]

                if (character == '"' || character == '\'' || character == '`') {

                    def closing = character
                    index++

                    while (index < length) {

                        if (raw[index] == '\\') {

                            index += 2; continue
                        }
                        if (raw[index] == closing) {

                            index++; break
                        }
                        index++
                    }
                    continue
                }
                out.append(character)
                index++
            }
            [text: out.toString(), inBlock: block]
        }

        def violations = []

        testRoots
            .findAll { it.exists() }
            .each { testRoot ->

                fileTree(testRoot)
                    .matching { include '**/*.java', '**/*.kt' }
                    .each { sourceFile ->

                        def isInBlockComment = false

                        sourceFile.eachLine {
                            rawLine,
                            lineNumber ->

                                def stripped = stripLine(rawLine, isInBlockComment)

                                isInBlockComment = stripped.inBlock

                                def matcher = snakeCallName.matcher(stripped.text)

                                while (matcher.find()) {

                                    violations << "${sourceFile}:${lineNumber}: test method " +
                                        "'${matcher.group(1)}' must be named in camelCase"
                                }
                            }
                    }
            }
        if (!violations.isEmpty()) {
            // GradleException is the idiomatic build-failure signal; its clean message reads as the
            // gate's verdict. The editor flags it as an unresolved class because an applied script
            // has no Gradle API on its classpath - a known tooling false positive, not a defect, so
            // do not "fix" it by swapping in a java.lang exception.
            throw new GradleException("Test-method naming convention violated:\n  " +
                violations.join('\n  '))
        }
    }
}

// Give the gate an output so it can be skipped while the sources it reads are
// unchanged; see lint-gate-stamp.gradle.
declareLintGateStamp(enforceCamelCaseTestNames)

// Run the gate as part of the standard verification lifecycle so both a
// local 'build'/'check' and CI's 'test jar' trip it before tests execute.
tasks.matching { it.name in ['test', 'check'] }.configureEach {
    dependsOn enforceCamelCaseTestNames
}
