// Mockito double naming gate, applied by java-conventions.gradle into every consumer. Sits beside
// the fake gate (enforce-suffix-on-fakes.gradle) as the same kind of concern keyed on hand-written
// doubles rather than Mockito; how either one reads a source file is double-naming-scan.gradle's,
// so each script holds only the rule it states.
//
// One convention, where the fake gate has two: Mockito generates a double's TYPE at runtime, so
// there is no source type to suffix the way a fake's class is, and the only thing a reader sees is
// the variable holding it. So a holder built from a Mockito double factory is suffixed 'Mock'
// (sectorMock, globalMock - never sector or globalStatic).
//
// Keying on the factory call ('mock(', 'mockStatic(', 'mockConstruction(') lets one rule cover both
// languages and both a mocked-static field and a plain mock local, since every Mockito double is
// born from one of those calls. 'spy' is deliberately out of scope - a spy is a partial real
// object, not a mock, so forcing a 'Mock' suffix on it would read wrong; add it here only if that
// convention is ever adopted.
//
// Applied by this script, not assumed from the conventions file: the gate is applied on its own by
// its integration test, so it has to carry what it uses.
apply from: new File(buildscript.sourceFile.parentFile, '../../lint-gate-stamp.gradle')
apply from: new File(buildscript.sourceFile.parentFile, 'double-naming-scan.gradle')

def enforceSuffixOnMocks = tasks.register('enforceSuffixOnMocks') {
    description = 'Fails the build when a variable holding a Mockito mock is ' +
            'not suffixed Mock.'
    group = 'verification'

    def testRoot = file('src/test')
    // Declare the input only when it exists: Gradle validates a declared input directory is
    // present, so an absent src/test (a project with no tests) would otherwise fail configuration
    // rather than skip. The scan guards the same absence at execution time.
    if (testRoot.exists()) {
        inputs.dir(testRoot).withPropertyName('testSources')
    }

    doLast {
        def violations = findDoubleNamingViolations(
            testRoot: testRoot,
            suffix: 'Mock',
            // A Mockito double factory, with or without a qualifier ('Mockito.mock'). The scan's
            // bracket anchor admits 'mock(', 'mockStatic(' and mockito-kotlin's 'mock<T>()' while
            // keeping a same-prefixed method like 'mockMap(' out of scope, since 'Map' is neither
            // the optional 'Static'/'Construction' nor the opening bracket.
            factoryCall: /(?:\w+\.)?mock(?:Static|Construction)?/,
            // Nothing to check: the type is generated, so a name only exists on the holder.
            typePattern: null)

        if (!violations.isEmpty()) {
            // GradleException is the idiomatic build-failure signal; its clean message reads as the
            // gate's verdict. The editor flags it as an unresolved class because an applied script
            // has no Gradle API on its classpath - a known tooling false positive, not a defect, so
            // do not "fix" it by swapping in a java.lang exception.
            throw new GradleException("Mock naming convention violated:\n  " +
                    violations.join('\n  '))
        }
    }
}

// Give the gate an output so it can be skipped while the sources it reads are
// unchanged; see lint-gate-stamp.gradle.
declareLintGateStamp(enforceSuffixOnMocks)

// Run the gate as part of the standard verification lifecycle so both a
// local 'build'/'check' and CI's 'test jar' trip it before tests execute.
tasks.matching { it.name in ['test', 'check'] }.configureEach {
    dependsOn enforceSuffixOnMocks
}
