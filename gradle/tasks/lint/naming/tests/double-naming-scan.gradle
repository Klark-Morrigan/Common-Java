// The source-text scan both test-double naming gates are made of, so the rule each states is the
// only thing each script holds.
//
// A double is named in two places and neither survives compilation: local-variable names are
// erased, and the scan must read Kotlin as well as Java. So both gates are source-text passes over
// the test trees, and everything about how that pass reads a file is the same for either kind of
// double - what differs is the calls and annotations a double is born from, and the word the name
// must end in.
//
// What the pass knows, and why:
//
// A holder is a binding the test itself declares. 'name = ClockFake(...)' alone is too broad in
// Kotlin, where the same shape is a named argument ('clock = ClockFake(...)' in a constructor call)
// or a property set on a production object inside an apply block. The value is a double, but the
// name is a parameter or a production property the test cannot rename - neither is a holder. So a
// first pass collects every 'val'/'var' and every typed Java declaration in the file, and a bare
// assignment counts only when it targets one of those. Java has neither named arguments nor apply
// blocks, so this only narrows Kotlin.
//
// A Kotlin declaration may annotate the type before the initialiser ('val clock: Clock =
// ClockFake()'); there the token before '=' is the type, not the holder, so a second pattern reads
// the name from after 'val'/'var' and skips the ': Type' annotation. A declaration is inherently a
// holder, so that one is checked directly rather than through the declared names.
//
// A line ending in ',' is a multi-line call argument, never a holder declaration - which guards the
// rare named argument whose parameter name collides with a binding declared elsewhere in the file.
//
// A holder's suffix is read in either of two casings. A double held in a constant is named in
// SCREAMING_SNAKE by Java's own convention, which cannot end in a camel-case word, so the suffix is
// spelled '_FAKE' there. Both are accepted for a holder, the constant spelling only on a name that
// is all capitals; a declared TYPE is always PascalCase and is still checked against the one
// spelling.
//
// Every gate built on this is a heuristic, and knowingly so: it keys off the calls and annotations a
// double is made by, so a double obtained some other way - a helper returning one, an anonymous
// 'new SomeInterface() { ... }' - names neither and is invisible to it.
apply from: new File(buildscript.sourceFile.parentFile, '../../lint-gate.gradle')
apply from: new File(buildscript.sourceFile.parentFile, '../../source-scan.gradle')

// The names the test itself declares: a Kotlin 'val'/'var' (covering locals and lateinit fields)
// and a typed Java field or local. A Java type's generic arguments may nest, so they are read up to
// the last '>' before the name rather than to the first.
def kotlinDeclaration = ~/\b(?:val|var)\s+(\w+)/
def javaTypedDeclaration = ~/\b[A-Za-z_]\w*(?:\s*<[^;=(){}]*>)?(?:\[\])?\s+(\w+)\s*[=;]/

// Any annotation with its argument list, removed so the declaration behind it can be read.
def anyAnnotation = ~/@[\w.]+(?:\s*\([^)]*\))?/

// One innermost generic argument list, removed repeatedly to flatten nested ones.
def innermostTypeArguments = ~/<[^<>]*>/

// Where a declaration's name ends: its initialiser, its statement end, the next parameter, the
// parameter list's end, or a Kotlin type annotation.
def declarationNameEnd = ~/[;=,):]/

// The last identifier of a declaration, which is its name.
def trailingIdentifier = ~/(\w+)\s*$/

// Reads each line of a file once, stripped of comments and literal bodies.
def readStrippedLines = { File sourceFile ->

    def lines = []

    eachStrippedLine(sourceFile) { text, number -> lines << [text: text, number: number] }

    return lines
}

def collectDeclaredNames = { List lines ->

    def declaredNames = [] as Set

    lines.each { line ->

        [kotlinDeclaration, javaTypedDeclaration].each { declaration ->

            def matcher = declaration.matcher(line.text)

            while (matcher.find()) {
                declaredNames << matcher.group(1)
            }
        }
    }

    return declaredNames
}

// The name a double-making annotation's declaration binds, or null when the declaration is still
// to come on a later line.
def readAnnotatedName = { String declaration ->

    def flattened = declaration.replaceAll(anyAnnotation, '')

    while (innermostTypeArguments.matcher(flattened).find()) {
        flattened = flattened.replaceAll(innermostTypeArguments, '')
    }

    def nameMatcher = trailingIdentifier.matcher(declarationNameEnd.split(flattened, 2)[0])

    return nameMatcher.find() ? nameMatcher.group(1) : null
}

// Everything a scan needs from one gate's declaration, derived once.
def readDoubleNamingRule = { Map spec ->

    String suffix = spec.suffix
    String factoryCall = spec.factoryCall

    // A suite over a double is named for what it covers, so it carries the double's whole name and
    // the suite word after it. It is the one type holding the word that is not a double. The
    // singular passes too: a suite spelled that way is enforceSuffixOnSuites' finding, and a second
    // finding here would tell its author to end the name in the double's suffix.
    def singularSuiteSuffix = suiteSuffix.substring(0, suiteSuffix.length() - 1)

    return [
        suffix: suffix,
        constantSuffix: '_' + suffix.toUpperCase(),
        doubleNoun: suffix.toLowerCase(),
        suiteSuffixes: [suiteSuffix, singularSuiteSuffix],
        typePattern: spec.typePattern,
        holderAnnotation: spec.holderAnnotation,

        // The identifier assigned from a factory call, with the bracket anchoring on the call
        // itself so a same-prefixed method ('mockMap(', 'makeFakeable(') stays out of scope.
        holderPattern: ~/(\w+)\s*=\s*${factoryCall}\s*[(<]/,
        typedHolderPattern: ~/\b(?:val|var)\s+(\w+)\s*:\s*[^=]+?=\s*${factoryCall}\s*[(<]/]
}

// Whether a holder's name carries the suffix in whichever casing its declaration calls for. The
// constant spelling counts only on a name that is a constant's shape throughout, so a camel-case
// holder cannot pass by tacking it onto the end ('clock_FAKE').
def isHolderNameSuffixed = { String name, Map rule ->
    name.endsWith(rule.suffix) || (name ==~ /[A-Z0-9_]+/ && name.endsWith(rule.constantSuffix))
}

def describeHolderViolation = { File sourceFile, int lineNumber, String name, Map rule ->
    "${sourceFile}:${lineNumber}: variable '${name}' holds a ${rule.doubleNoun} and must be suffixed " +
        "'${rule.suffix}'"
}

def findTypeViolations = { File sourceFile, List lines, Map rule ->

    def violations = []

    if (rule.typePattern == null) {
        return violations
    }

    lines.each { line ->

        def typeMatcher = rule.typePattern.matcher(line.text)

        while (typeMatcher.find()) {

            def typeName = typeMatcher.group(1)

            if (!typeName.endsWith(rule.suffix) && !rule.suiteSuffixes.any { typeName.endsWith(it) }) {

                violations << "${sourceFile}:${line.number}: test-double type '${typeName}' must be " +
                    "suffixed '${rule.suffix}'"
            }
        }
    }

    return violations
}

// Holders assigned from a factory call: a bare assignment to a declared name, or a typed Kotlin
// declaration.
def findAssignedHolderViolations = { File sourceFile, List lines, Set declaredNames, Map rule ->

    def violations = []

    lines.findAll { line -> !line.text.trim().endsWith(',') }.each { line ->

        def holderMatcher = rule.holderPattern.matcher(line.text)

        while (holderMatcher.find()) {

            def name = holderMatcher.group(1)

            if (declaredNames.contains(name) && !isHolderNameSuffixed(name, rule)) {
                violations << describeHolderViolation(sourceFile, line.number, name, rule)
            }
        }

        def typedHolderMatcher = rule.typedHolderPattern.matcher(line.text)

        while (typedHolderMatcher.find()) {

            def name = typedHolderMatcher.group(1)

            if (!isHolderNameSuffixed(name, rule)) {
                violations << describeHolderViolation(sourceFile, line.number, name, rule)
            }
        }
    }

    return violations
}

// Holders a double-making annotation sits on. The annotation is often on a line of its own, so
// the declaration it awaits may be on a later line.
def findAnnotatedHolderViolations = { File sourceFile, List lines, Map rule ->

    def violations = []

    if (rule.holderAnnotation == null) {
        return violations
    }

    def isAwaitingDeclaration = false

    lines.each { line ->

        def text = line.text
        def annotationMatcher = rule.holderAnnotation.matcher(text)

        if (annotationMatcher.find()) {

            isAwaitingDeclaration = true
            text = text.substring(annotationMatcher.end())
        }

        def name = isAwaitingDeclaration ? readAnnotatedName(text) : null

        if (name == null) {
            return
        }

        isAwaitingDeclaration = false

        if (!isHolderNameSuffixed(name, rule)) {
            violations << describeHolderViolation(sourceFile, line.number, name, rule)
        }
    }

    return violations
}

/**
 * Scans test sources for doubles whose names do not end in the required suffix.
 *
 * - scannedFiles      the files to scan, as declareScannedFiles answers them
 * - suffix            the word a double's name must end in ('Fake'), which is also the noun a
 *                     message calls it by in lower case
 * - factoryCall       a regex fragment matching a call a double is born from, up to but not
 *                     including its opening bracket
 * - typePattern       a pattern whose one group is a declared type name to check, or null where the
 *                     kind of double has no source type to name
 * - holderAnnotation  a pattern matching an annotation that makes the declaration it sits on a
 *                     double, or null where the kind of double has none
 */
ext.findDoubleNamingViolations = { Map spec ->

    def rule = readDoubleNamingRule(spec)

    return spec.scannedFiles.collectMany { File sourceFile ->

        def lines = readStrippedLines(sourceFile)
        def declaredNames = collectDeclaredNames(lines)

        def violations = findTypeViolations(sourceFile, lines, rule) +
            findAssignedHolderViolations(sourceFile, lines, declaredNames, rule) +
            findAnnotatedHolderViolations(sourceFile, lines, rule)

        // A holder both annotated and assigned from a factory is one finding, not two.
        return violations*.toString().unique()
    }
}
