// Test-name gate, applied by java-conventions.gradle into every consuming project: a test method
// does not repeat the name of the @Nested group it sits in.
//
// The group is named for the method under test, so the suite tree already reads 'GetDrawnLayer >'
// before any test name. A test named 'getDrawnLayerIsNullBeforeAnyLayerIsRegistered' says the
// method twice, and the tree reads 'GetDrawnLayer > getDrawnLayerIsNull...'. The name states the
// outcome and the condition alone: 'isNullBeforeAnyLayerIsRegistered'. Nothing in the compiler or
// the runner has an opinion, so a suite written before the convention and one written after it
// sit side by side in one tree until a gate holds them to one.
//
// Only a name that repeats the whole group AND then goes on to a new word is flagged: the group's
// lower-camel spelling followed by an upper-case letter. A name that merely opens with the same
// word ('resolves' under 'Resolve') goes on in lower case and is a different word, so it passes.
//
// Which group a test sits in needs the enclosing class, so this reads source-scan.gradle's class
// scopes, as enforceTestsNested does. A test outside any @Nested group is that gate's finding and
// is left to it here.
//
// A Kotlin backtick name ('fun `reads the owner`()') is prose rather than an identifier and cannot
// carry the group's camel-case spelling, so it has nothing to be judged on.
//
// Applied by this script, not assumed from the conventions file: the gate is applied on its own by
// its integration test, so it has to carry what it uses.
apply from: new File(buildscript.sourceFile.parentFile, '../../lint-gate.gradle')
apply from: new File(buildscript.sourceFile.parentFile, '../../source-scan.gradle')

def enforceTestNamesOmitGroup = tasks.register('enforceTestNamesOmitGroup') {

    description = 'Fails the build when a test method name repeats its @Nested group\'s name.'
    group = 'verification'

    def testRoots = declareSourceRoots(it, ['src/test'])

    doLast {
        // Any annotation with its argument list, removed before the declaration is read: a
        // '@MethodSource(...)' between @Test and the method would otherwise read as a call named
        // MethodSource. Literals are already gone, so the arguments hold no quoted ')'.
        def anyAnnotation = ~/@[\w.]+(?:\s*\([^)]*\))?/

        // The declared name: Kotlin's after 'fun' (past any type parameters or receiver), Java's as
        // the first identifier opening a parameter list, the return type sitting before it.
        def kotlinDeclaration = ~/\bfun\b(?:\s*<[^>]*>)?\s*(?:[\w.]+\.)?(\w+)?\s*\(/
        def javaDeclaration = ~/(\w+)\s*\(/

        // The rule itself: the group's lower-camel spelling, then the start of another word.
        def repeatsGroupName = { String methodName, String groupName ->

            def groupPrefix = groupName[0].toLowerCase() + groupName.substring(1)

            methodName.length() > groupPrefix.length()
                && methodName.startsWith(groupPrefix)
                && Character.isUpperCase(methodName.charAt(groupPrefix.length()))
        }

        def violations = []

        fileTree(testRoot)
            .matching { include '**/*.java', '**/*.kt' }
            .each { sourceFile ->

                def declaration = sourceFile.name.endsWith('.kt')
                    ? kotlinDeclaration
                    : javaDeclaration

                // The group of the test annotation still waiting for its method: a @Test is
                // usually on a line of its own, with the declaration one or more annotation lines
                // below it.
                def awaitedGroup = null
                def isAwaitingDeclaration = false

                scanClassScopes(sourceFile) { line ->

                    def text = line.text
                    def annotationMatcher = testMethodAnnotation.matcher(text)

                    if (annotationMatcher.find()) {

                        def enclosing = line.enclosingClass

                        awaitedGroup = (enclosing != null && enclosing.isNested)
                            ? enclosing.name
                            : null

                        isAwaitingDeclaration = true

                        // The method may share the annotation's line.
                        text = text.substring(annotationMatcher.end())
                    }

                    if (!isAwaitingDeclaration) {
                        return
                    }

                    def declared = declaration.matcher(text.replaceAll(anyAnnotation, ''))
                    if (!declared.find()) {
                        return
                    }

                    isAwaitingDeclaration = false

                    // A backtick name leaves no identifier after 'fun'.
                    def methodName = declared.group(1)
                    if (awaitedGroup == null || methodName == null) {
                        return
                    }

                    if (repeatsGroupName(methodName, awaitedGroup)) {

                        violations << "${sourceFile}:${line.number}: test method " +
                            "'${methodName}' repeats its @Nested group '${awaitedGroup}'; name " +
                            "the outcome and condition alone"
                    }
                }
            }
        }

        failOnViolations('Test-name convention violated', violations)
    }
}

// Make it a gate: an output so it can be skipped while what it reads is unchanged, and a place in
// the verification lifecycle; see lint-gate.gradle.
installLintGate(enforceTestNamesOmitGroup)
