// Hand-written test-double naming gate, applied by java-conventions.gradle into every consumer.
// Sits beside the mock gate (enforce-suffix-on-mocks.gradle) as the same kind of concern keyed on
// Mockito rather than hand-written fakes; how either one reads a source file is
// double-naming-scan.gradle's, so each script holds only the rule it states.
//
// Two conventions, because a hand-written fake is named twice - it has a source type, where a
// Mockito double does not:
//   1. a test-double TYPE is suffixed 'Fake' (EditableMarketFake, never FakeEditableMarket).
//      Flagged when a declared type name contains 'Fake' but does not end with it.
//   2. a variable built from a '*Fake(...)' constructor or factory is suffixed 'Fake' (marketFake,
//      never market), or '_FAKE' where the name is a constant (EMPTY_FAKE, never EMPTY) - a
//      SCREAMING_SNAKE name being unable to end in a camel-case word. Flagged when such an
//      assignment targets a name carrying neither spelling.
//
// Applied by this script, not assumed from the conventions file: the gate is applied on its own by
// its integration test, so it has to carry what it uses.
apply from: new File(buildscript.sourceFile.parentFile, '../../lint-gate.gradle')
apply from: new File(buildscript.sourceFile.parentFile, 'double-naming-scan.gradle')

def enforceSuffixOnFakes = tasks.register('enforceSuffixOnFakes') {
    description = 'Fails the build when test-double types or fake-holding ' +
            'variables are not suffixed Fake.'
    group = 'verification'

    def testRoot = file('src/test')
    // Declare the input only when it exists: Gradle validates a declared input directory is
    // present, so an absent src/test (a project with no tests) would otherwise fail configuration
    // rather than skip. The scan guards the same absence at execution time.
    if (testRoot.exists()) {
        inputs.dir(testRoot).withPropertyName('testSources')
    }

    doLast {
        def violations = findDoubleNamingViolations(
            testRoot: testRoot,
            suffix: 'Fake',
            // A '*Fake(' or '*Fake<' constructor or factory, with or without Java's 'new'.
            // Anchoring on the call keeps real-typed fixtures (MarketAPI helpers, mocks) out of
            // scope.
            factoryCall: /(?:new\s+)?\w*Fake\w*/,
            // 'Fake' anywhere in a declared type name; the scan's own endsWith check separates a
            // compliant suffix from a non-compliant prefix or infix.
            typePattern: ~/\b(?:class|interface|enum|record|object)\s+(\w*Fake\w*)/)

        if (!violations.isEmpty()) {
            // GradleException is the idiomatic build-failure signal; its clean message reads as the
            // gate's verdict. The editor flags it as an unresolved class because an applied script
            // has no Gradle API on its classpath - a known tooling false positive, not a defect, so
            // do not "fix" it by swapping in a java.lang exception.
            throw new GradleException("Fake naming convention violated:\n  " +
                    violations.join('\n  '))
        }
    }
}

// Make it a gate: an output so it can be skipped while what it reads is
// unchanged, and a place in the verification lifecycle; see lint-gate.gradle.
installLintGate(enforceSuffixOnFakes)
