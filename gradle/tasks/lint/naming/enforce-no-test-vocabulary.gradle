// Test-vocabulary gate: production code and the Markdown filed beside it may not talk about mocks, fakes,
// stubbing or unit tests.
//
// It is the inverse of enforce-package-vocabulary. That gate closes one package root to words a consuming
// build names, because a domain vocabulary is a per-project fact. This one closes everything except the
// fixture roots to a word list it owns, because the test vocabulary is the same in every repository.
//
// The words leak in through Javadoc rather than through code. A test-only detail written into a production
// class ("returns null only in the test harness") describes the caller instead of the subject, and no
// compiler or import graph can see it.
//
// A consuming build declares only its exemptions:
//
//     enforceNoTestVocabulary {
//         exemptSourceSet name: 'bridgestubs'
//         exemptPackage root: 'example.production.testfixtures'
//         allowWord word: 'mocking', inFile: 'src/main/java/example/production/README.md'
//     }

apply from: new File(buildscript.sourceFile.parentFile, '../package-roots.gradle')
apply from: new File(buildscript.sourceFile.parentFile, '../word-scan.gradle')

// The file types the vocabulary leaks into: code, and the Markdown filed beside it. Resources stay out of
// reach: a fixture column or a strings file is data rather than prose.
def scannedFileIncludes = jvmSourceIncludes + ['**/*.md']

// Words that carry no meaning outside a test, banned on sight. `JUnit` parts into `j` + `unit` at the camel
// hump, so it is carried as a phrase below; `junit` catches the package form (`org.junit.jupiter`).
def bannedWords = [
    'mock', 'mocks', 'mocked', 'mocking', 'mockito', 'mockk',
    'fake', 'fakes', 'faked',
    'stubbing',
    'junit', 'assertj',
    'testfixtures',
]

// Words that mean something real in production, so only the phrases that pin them to a test suite are
// banned. A bare ban on `test` would fire on `hit-test`, `half-plane test` and `Predicate::test`; `stub` names
// a placeholder and `assert` is ordinary English. A gate that fires on correct writing trains its next reader
// to reach for the allowlist instead of to read.
//
// So the trigger is adjacency: `test` next to a suite noun (`harness`, `suite`, `fixture`), next to the
// article or preposition only a suite takes (`the tests`, `in tests`), or next to the runtime a suite runs on
// (`test JVM`). `testable` is tiered the same way, since `hit-testable` says nothing of a suite.
//
// Matched as a run of consecutive words, so a phrase is found whether it is prose, wrapped across two lines,
// or part of a name (`unitTestHarness`).
def bannedPhrases = [
    'unit test', 'unit tests', 'unit tested', 'unit testing', 'unit testable',
    'independently testable', 'testable in isolation', 'testable seam',
    'test jvm', 'test classpath',
    'test harness', 'test case', 'test cases', 'test suite', 'test suites',
    'test double', 'test doubles', 'test fixture', 'test fixtures',
    'the tests', 'in tests', 'for tests', 'tests can', 'tests assert',
    'tests stub', 'tests which',
    'assert that', 'j unit',
]

def bannedEntries = (bannedWords + bannedPhrases).collect { readDeclaredPhrase('enforceNoTestVocabulary', it) }

// The source sets a test vocabulary belongs to, exempt without a consumer saying so: Gradle's own names for
// the two test trees a JVM project may have, compared lower case like every declared source set.
def defaultExemptSourceSets = ['test', 'testfixtures']

def exemptSourceSets = [] as Set
def exemptPackages = []
def allowances = []

// Answers whether a path under src/ sits in an exempt tree: an exempt source set, named by its directory, or
// an exempt package root, judged by directory because Markdown declares no package.
def isExemptPath = { List<String> pathSegmentsUnderSrc ->

    def sourceSetName = pathSegmentsUnderSrc.first().toLowerCase()

    return sourceSetName in defaultExemptSourceSets ||
        sourceSetName in exemptSourceSets ||
        exemptPackages.any { isPathUnderPackageRoot(pathSegmentsUnderSrc, it) }
}

// Why an allowance answers no rule, or null when it answers one. scannedPaths are the files the gate judged.
def findStrandedReason = { Map allowance, Set scannedPaths ->

    if (!bannedEntries.any { it.words == allowance.words }) {
        return 'names no banned entry, so it allows nothing'
    }

    if (allowance.inFile in scannedPaths) {
        return null
    }

    def segments = allowance.inFile.tokenize('/')
    def isInExemptTree = segments.size() > 1 && segments.first() == 'src' && isExemptPath(segments.drop(1))

    return isInExemptTree
        ? 'names a file in an exempt tree, which is already allowed'
        : 'names a file this gate does not scan, so it allows nothing'
}

// The declared exemptions no file sits in, each as the message reporting it. An exemption that matches nothing
// exempts nothing, and the tree it was written for is judged again the moment one comes back under that name.
// Read off the disk directly, because the exempt trees are left out of the scanned inputs.
def findUnmatchedExemptions = {

    def sourceSetDirectoryNames = (file('src').listFiles() ?: [])
        .findAll { it.directory }
        .collect { it.name.toLowerCase() }

    def unmatchedSourceSets = exemptSourceSets
        .findAll { !(it in sourceSetDirectoryNames) }
        .collect { "src/${it}: exemptSourceSet names no source set directory, so it exempts nothing".toString() }

    def unmatchedPackages = exemptPackages
        .findAll { root ->

            def packagePath = root.replace('.', '/')

            fileTree('src') { include scannedFileIncludes.collect { "*/*/${packagePath}/${it}" } }.isEmpty()
        }
        .collect { "${it}: exemptPackage names no package holding a scanned file, so it exempts nothing".toString() }

    return unmatchedSourceSets + unmatchedPackages
}

// Reports one message per banned entry the file says, less the entries allowed in it.
def findTestVocabulary = { File sourceFile, String reportedPath ->

    def allowedPhrases = allowances.findAll { it.inFile == reportedPath }*.words
    def applicableEntries = bannedEntries.findAll { !(it.words in allowedPhrases) }

    return findSpokenPhrases(readNameWords(sourceFile), applicableEntries).collect {
        "${reportedPath}:${it.line}: production sources may not say \"${it.phrase.declared}\"".toString()
    }
}

def enforceNoTestVocabulary = tasks.register('enforceNoTestVocabulary') {

    description = 'Fails the build when production sources use the vocabulary of a test suite (mock, fake, ' +
        'stubbing, unit test).'
    group = 'verification'

    // Exempts one whole source set, named as its directory under src/: a tree that is test-adjacent without
    // being src/test, such as hand-written stubs mirroring a third party's API.
    ext.exemptSourceSet = { Map exemption ->

        if (!exemption.name) {

            throw new GradleException("exemptSourceSet needs 'name' (the directory under src/ that holds " +
                "test-vocabulary sources); got: ${exemption}")
        }

        exemptSourceSets << exemption.name.toLowerCase()
    }

    // Exempts one package root wherever it sits: what a project whose fixtures ship in the production jar
    // declares, since the tree is main by source set and a fixture only by package.
    ext.exemptPackage = { Map exemption ->

        if (!exemption.root) {

            throw new GradleException("exemptPackage needs 'root' (the package root that holds " +
                "test-vocabulary sources); got: ${exemption}")
        }

        exemptPackages << exemption.root
    }

    // Exempts one file from one banned entry. Declared in the build rather than as a marker comment in the
    // file, so a reviewer reads it in the diff. The entry is spelt as the banned list declares it, phrases
    // included ('tests can'); the path is project-relative.
    ext.allowWord = { Map exemption ->

        if (!exemption.word || !exemption.inFile) {

            throw new GradleException("allowWord needs both 'word' (the entry being let through) and 'inFile' " +
                "(the project-relative path it is allowed in); got: ${exemption}")
        }

        def allowed = readDeclaredPhrase('allowWord', exemption.word.toString())

        allowances << [declared: allowed.declared, words: allowed.words, inFile: exemption.inFile.toString()]
    }

    // Several entries in one file: the shape a README documenting test-facing artefacts takes, stated once so a
    // reviewer sees one exemption instead of six.
    ext.allowWords = { Map exemption ->

        if (!exemption.words || !exemption.inFile) {

            throw new GradleException("allowWords needs both 'words' (the entries being let through) and " +
                "'inFile' (the project-relative path they are allowed in); got: ${exemption}")
        }

        readOneOrMany(exemption.words).each { word ->
            allowWord word: word, inFile: exemption.inFile
        }
    }

    // Exempt trees are left out of the inputs, so editing a test does not re-run a gate that never reads it.
    // Read when the tree is walked, so a declaration made after this registration still counts.
    def productionSources = fileTree('src') {
        exclude { element -> isExemptPath(element.relativePath.segments as List) }
    }

    def scannedSources = declareScannedFiles(it, productionSources, scannedFileIncludes, 'scannedSources')

    declareRuleSnapshot(it, 'bannedEntries') { bannedEntries*.declared }
    declareRuleSnapshot(it, 'exemptSourceSets') { exemptSourceSets }
    declareRuleSnapshot(it, 'exemptPackages') { exemptPackages }
    declareRuleSnapshot(it, 'allowances') { allowances.collect { "${it.declared} in ${it.inFile}" } }

    // Whether each exemption still matches is read off trees the scan leaves out, so it is an input of its own.
    declareRuleSnapshot(it, 'unmatchedExemptions') { findUnmatchedExemptions() }

    doLast {

        def violations = []
        def scannedPaths = [] as Set

        scannedSources.visit { details ->

            if (details.directory) {
                return
            }

            // Project-relative with forward slashes, so an allowance reads the same on every machine.
            def reportedPath = 'src/' + details.path

            scannedPaths << reportedPath
            violations.addAll(findTestVocabulary(details.file, reportedPath))
        }

        // An allowance that answers no rule is dead config: the word it was written for is loose again the
        // moment the file or entry it meant comes back under another name.
        allowances.each { allowance ->

            def reason = findStrandedReason(allowance, scannedPaths)

            if (reason != null) {
                violations << "${allowance.inFile}: allowWord ${reason}: \"${allowance.declared}\""
            }
        }

        violations.addAll(findUnmatchedExemptions())

        failOnViolations('Test vocabulary in production sources', violations)
    }
}

installLintGate(enforceNoTestVocabulary)
