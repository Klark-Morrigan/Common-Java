// Markdown link gate: a relative link in a checked-in .md file points at something that exists.
//
// Docs are navigated by clicking through them, and nothing else in the build reads Markdown. A package rename
// updates every import the compiler can see and silently strands every doc link that named the old path. That
// rot stays invisible until a reader follows the link and lands on nothing.
//
// Three kinds of link are out of scope, all because the gate asserts only over what this checkout owns:
//
// - A target carrying a scheme (http, mailto) or a `//host` prefix would need the network.
// - A target climbing out of the project root resolves differently on every machine.
// - A pure fragment (#section) names a heading, which only a Markdown parser could check.

// Groovy's default imports stop at java.io, so the nio types the resolution is expressed in have to be named.
import java.nio.file.Files
import java.nio.file.LinkOption
import java.nio.file.Path

apply from: new File(buildscript.sourceFile.parentFile, '../markdown-scan.gradle')

// The inline link form, `[text](target)`, with an optional title after the target in any of the three
// quotings CommonMark allows. Link text may not itself contain brackets: admitting a nested pair would need a
// balancing parse, so such a link is skipped rather than mis-parsed into a false report.
def markdownInlineLinkPattern = ~/\[[^\[\]]*\]\(([^)\s]+)(?:\s+(?:"[^"]*"|'[^']*'|\([^)]*\)))?\)/

// A target carrying a scheme (`https:`, `mailto:`) or a protocol-relative `//host` prefix.
def markdownExternalTargetPattern = ~/^([A-Za-z][A-Za-z0-9+.\-]*:|\/\/).*/

// Percent-encoded spaces are the one escape these docs use. A full URL decode would also turn `+` into a
// space, which is wrong for a path.
def encodedSpace = '%20'

// The path half of a target, or an empty string when there is none. `README.md#index` names a file plus a
// heading, and only the file half is a path; a pure fragment leaves nothing.
def readTargetPath = { String target ->
    return target.split('#', 2)[0].replace(encodedSpace, ' ')
}

// Where a target lands, or null when it is not this gate's to resolve. A root-relative target (`/docs/x.md`)
// is measured from the scan root, the way a repository host resolves one; every other target is measured
// from the linking file's own directory.
//
// Normalised textually rather than canonically: `..` has to collapse for the containment test, and a target
// that does not exist is exactly the case being judged.
def resolveLinkTarget = { String target, File markdownFile, Path scanRoot ->

    if (markdownExternalTargetPattern.matcher(target).matches()) {
        return null
    }

    def targetPath = readTargetPath(target)

    if (targetPath.isEmpty()) {
        return null
    }

    def isRootRelative = targetPath.startsWith('/')
    def base = isRootRelative ? scanRoot : markdownFile.parentFile.toPath()
    def resolvedTarget = base.resolve(isRootRelative ? targetPath.substring(1) : targetPath).normalize()

    return resolvedTarget.startsWith(scanRoot) ? resolvedTarget : null
}

// A path below the scan root, spelt the same way on every machine.
def describeBelowRoot = { Path root, Path path ->
    return root.relativize(path).toString().replace('\\', '/')
}

// The target's path below the scan root as the filesystem spells it, or null when nothing is there.
//
// Windows and macOS resolve a path case-insensitively, so `README.md` finds `readme.md` and the link looks
// sound on the machine that wrote it - then 404s on a repository host, which is case-sensitive. The real path
// recovers the spelling on disk. Links are not followed, so a symlink is judged by its own name rather than
// by the name of the file it points at.
def readOnDiskSpelling = { Path resolvedTarget, Path realScanRoot ->

    if (!Files.exists(resolvedTarget)) {
        return null
    }

    return describeBelowRoot(realScanRoot, resolvedTarget.toRealPath(LinkOption.NOFOLLOW_LINKS))
}

// Every link of one Markdown file that lands inside the scan root, with the path it names and the spelling
// found on disk there. The real scan root is what the on-disk spelling is measured from, so the casing of
// everything above the project - a drive letter, a home directory - cancels out.
def readInScopeLinks = { File markdownFile, Path scanRoot, Path realScanRoot ->

    def links = []

    visitLinesOutsideFences(markdownFile) { String line, int lineNumber ->

        def linkMatcher = markdownInlineLinkPattern.matcher(blankMarkdownCodeSpans(line))

        while (linkMatcher.find()) {

            def target = linkMatcher.group(1)
            def resolvedTarget = resolveLinkTarget(target, markdownFile, scanRoot)

            if (resolvedTarget != null) {

                links << [location: "${markdownFile}:${lineNumber}",
                    target: target,
                    namedPath: describeBelowRoot(scanRoot, resolvedTarget),
                    onDiskPath: readOnDiskSpelling(resolvedTarget, realScanRoot)]
            }
        }
    }

    return links
}

// What is wrong with one link, or null when nothing is. A wrong case is its own verdict because it is its own
// defect: the file is there, the link is spelt wrong, and the build machine is the only reason it works.
def describeBrokenLink = { Map link ->

    if (link.onDiskPath == null) {
        return "${link.location}: link target does not exist: ${link.target}".toString()
    }

    if (link.onDiskPath != link.namedPath) {
        return "${link.location}: link target differs in case from the file on disk: ${link.target}".toString()
    }

    return null
}

def enforceDocLinksResolve = tasks.register('enforceDocLinksResolve') {

    description = 'Fails the build when a relative link in a markdown file points at a path that does not exist.'
    group = 'verification'

    // Captured at configuration time: the execution-time action must not reach back through `project`.
    def scanRoot = project.projectDir.toPath().normalize()
    def markdownFiles = declareMarkdownFiles(it)

    // Read once per run, so the snapshot below and the action judge the same links.
    def scannedLinks = null

    def readScannedLinks = {

        if (scannedLinks == null) {

            def realScanRoot = scanRoot.toRealPath(LinkOption.NOFOLLOW_LINKS)

            scannedLinks = markdownFiles.collectMany { readInScopeLinks(it, scanRoot, realScanRoot) }
        }

        return scannedLinks
    }

    // The targets are inputs as much as the Markdown is. Renaming or deleting a target, or changing its case,
    // has to re-run the gate rather than replay a pass recorded while the target was there.
    declareRuleSnapshot(it, 'linkTargets') {

        readScannedLinks()
            .collect { "${it.namedPath} on disk as ${it.onDiskPath ?: 'nothing'}" }
            .unique()
    }

    doLast {
        failOnViolations('Broken documentation links', readScannedLinks().collect(describeBrokenLink).findAll())
    }
}

installLintGate(enforceDocLinksResolve)
