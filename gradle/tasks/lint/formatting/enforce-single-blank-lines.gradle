// Blank-line gate.
//
// The convention: at most one consecutive blank line anywhere in a source
// file. A single blank line is the unit of vertical separation (between
// import blocks, between members, ...); two or more in a row are visual
// noise with no meaning, so they are rejected. No bytecode-level tool can see
// this - blank lines are erased by compilation - so it is enforced as a
// source-text pass, reading Kotlin as well as Java.
apply from: new File(buildscript.sourceFile.parentFile, 'formatted-source-line-gate.gradle')

def enforceSingleBlankLines = tasks.register('enforceSingleBlankLines') {

    description = 'Fails the build when a source file has two or more consecutive blank lines.'

    group = 'verification'

    // A line holding only whitespace reads as blank, so it counts toward a run. Each blank line
    // after the first in a run is reported, so every extra line has its own location.
    def isBlank = { String line -> line != null && line.trim().isEmpty() }

    configureFormattedSourceLineGate(it, 'Blank-line convention violated') { String line, String previousLine ->

        return isBlank(line) && isBlank(previousLine)
            ? 'consecutive blank line; only one is allowed'
            : null
    }
}

installLintGate(enforceSingleBlankLines)
