// Answers "which source sets is this repo's layout its own to shape?" once, for everything that
// shapes or judges layout.
//
// A source set is held out for a reason that covers all of it: it mirrors a third party's shape, or
// it is generated. That reason applies to its code layout, its doc comments and its blank lines
// alike, so every reader honours the same list. The list's property name is a public contract, and
// resolving it here keeps it spelled in one place.
//
// Applied by each reader rather than by spotless-java.gradle, because any one of them can be
// applied on its own.

def excludedSourceSetsProperty = 'formatterExcludedSourceSets'

// The formatted source sets' files, each source set read through 'readSources' (its java or
// allSource, say).
//
// Lazy: a project declares its own source sets, and this exemption list, in a build script that
// runs after this one is applied. A list taken when this script is applied would miss both.
ext.collectFormattedSources = { Closure readSources ->

    return project.files(project.provider {

        def excludedSourceSetNames = project.findProperty(excludedSourceSetsProperty) ?: []

        // toList() first: DomainObjectCollection.findAll(Closure) is removed in Gradle 10.
        return sourceSets.toList()
            .findAll { sourceSet -> !(sourceSet.name in excludedSourceSetNames) }
            .collect(readSources)
    })
}
