// Answers "which source sets is this repo's layout its own to shape?" once, for
// everything that shapes or judges layout - the formatter's two passes and the
// blank-line gate alike.
//
// All of them honour the same exemption list, because a source set is held out for a
// reason that covers all of it - it mirrors a third party's shape, or it is generated
// - and that reason applies to its code layout, its doc comments and its blank lines
// alike. The list is also the one consumer-facing knob here, so its property name is
// part of a public contract; resolving it here keeps that name from being spelled in
// several scripts that could then drift apart.
//
// Still named for the formatter, in the script and in the property. Renaming a knob a
// consumer sets is a contract change, and the reading it encodes - "not ours to shape"
// - is what a new reader needs rather than which pass asked first.
//
// It lives in its own script, applied by each reader rather than by
// spotless-java.gradle, for the same reason lint-gate-stamp.gradle does: any one of
// them can be applied on its own by a repo that wants only that pass, so it has to
// carry what it uses rather than depend on being applied in company.
//
// Applying this more than once per project is harmless - each pass applies it, and the
// assignment below simply overwrites an identical closure.

// Named for the formatter rather than for Spotless: the list governs both passes,
// and the aligner is appliable on its own by a repo with no Spotless in sight.
def excludedSourceSetsProperty = 'formatterExcludedSourceSets'

// The name the knob carried while Spotless was its only reader. A consumer left on
// the old spelling would otherwise have its exemption silently ignored, and the
// formatter would reach straight into the source it was told to leave alone - so
// refuse rather than let that pass unnoticed. Removable once no checkout sets it.
def legacyExcludedSourceSetsProperty = 'spotlessExcludedSourceSets'
if (project.findProperty(legacyExcludedSourceSetsProperty) != null) {
    throw new GradleException("${legacyExcludedSourceSetsProperty} has been renamed " +
            "to ${excludedSourceSetsProperty}; rename it in this project's build script.")
}

ext.selectFormattedSourceSets = {
    def excludedSourceSetNames = project.findProperty(excludedSourceSetsProperty) ?: []
    // toList() first: DomainObjectCollection.findAll(Closure) is removed in Gradle 10,
    // and this hands the filtering to Groovy's own List.findAll instead. Both callers
    // only collect over the result, so a plain List serves them as well as the
    // collection did.
    return sourceSets.toList().findAll { sourceSet ->
        !(sourceSet.name in excludedSourceSetNames)
    }
}
