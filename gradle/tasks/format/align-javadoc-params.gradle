// Javadoc/KDoc @param column aligner, the second half of the on-demand formatter.
//
// Spotless leaves doc comments completely alone - eclipse-formatter.xml turns off
// format_javadoc_comments and every sibling comment setting - so nothing in the
// toolchain has an opinion about the inside of a doc block. That is the right
// default (the JDT comment formatter reflows prose and destroys hand-laid tables),
// but it leaves one mechanical thing unowned: the description column of an aligned
// @param list, which silently goes out of true the moment a parameter is renamed
// to a different length. A leaked misalignment survives every build, so the fix is
// a formatter pass rather than a gate.
//
// This rewrites source, so like Spotless it stays off `check` and `build` and runs
// only when a person asks for it. It lives beside the lint gates but deliberately
// not among them: everything under tasks/lint only ever reports.
//
// Applied by spotless-java.gradle so a repo that opted into the formatter gets both
// halves, and appliable on its own by a repo that wants only this one - which needs
// the java or kotlin plugin already applied, since the pass reads source sets rather
// than guessing at directory names.

// The exemption list is resolved by the script that owns it, so this pass and Spotless
// cannot come to disagree about which source sets the formatter touches.
apply from: new File(buildscript.sourceFile.parentFile, 'formatted-source-sets.gradle')

// The two shapes inside a doc block this pass understands.
//
//   ^(\s*\*[ \t]+)@param[ \t]+(name)([ \t]+)(description)$
//   ^(\s*\*)([ \t]+)(continuation of the description above)$
//
// Anchored at \z with the line ending captured separately, so a rewritten line
// keeps whatever ending it arrived with (these trees are checked out CRLF).
def javadocParamPattern = ~/^(\s*\*[ \t]+)@param[ \t]+(\S+)([ \t]+)(\S.*?)([\r\n]*)\z/
def javadocContinuationPattern = ~/^(\s*\*)([ \t]+)(\S.*?)([\r\n]*)\z/
def docBlockOpenPattern = ~/^\s*\/\*\*/
def docBlockClosePattern = ~/\*\//

// The tag and the single space that always follows it. A description's column is the
// comment prefix plus this, plus the parameter name and whatever padding follows it.
def paramTag = '@param '

// Re-lays one wrapped description line so its text starts at 'column', keeping the
// line's own leading whitespace-and-star and its original line ending. Returns true
// when that actually moved the text.
//
// The padding floor of one space is for input this pass cannot produce but can be
// handed: a continuation indented further than its own @param's column would ask for
// negative padding, and gluing the text onto the star is not an improvement.
def alignContinuationToColumn = { List<String> block, continuation, int column ->
    def realignedLine = continuation.star +
            ' ' * Math.max(1, column - continuation.star.length()) +
            continuation.text + continuation.lineEnding
    if (realignedLine == block[continuation.index]) {
        return false
    }
    block[continuation.index] = realignedLine
    return true
}

// Re-lays one doc comment's @param descriptions onto a single column, and pulls
// each wrapped continuation line onto that same column. Returns true when it
// changed something.
//
// Two guards keep it from restyling blocks that were never column-aligned. It acts
// only when some @param pads its name with more than one space (the author aligned
// on purpose) AND the descriptions currently disagree about which column they start
// in (the alignment is actually broken). A block that already agrees, or that uses
// one space throughout, is left exactly as written - the pass fixes drift, it does
// not impose a house style on prose.
def alignDocBlockParams = { List<String> block ->
    def params = []
    def current = null
    block.eachWithIndex { line, index ->
        def paramMatch = javadocParamPattern.matcher(line)
        if (paramMatch.matches()) {
            current = [
                index      : index,
                prefix     : paramMatch.group(1),
                name       : paramMatch.group(2),
                gap        : paramMatch.group(3).length(),
                description: paramMatch.group(4),
                lineEnding : paramMatch.group(5),
                continuations: [],
            ]
            params << current
            return
        }
        def continuationMatch = javadocContinuationPattern.matcher(line)
        if (current != null && continuationMatch.matches() && !continuationMatch.group(3).startsWith('@')) {
            current.continuations << [
                index     : index,
                star      : continuationMatch.group(1),
                indent    : continuationMatch.group(2).length(),
                text      : continuationMatch.group(3),
                lineEnding: continuationMatch.group(4),
            ]
            return
        }
        current = null
    }
    if (params.isEmpty()) {
        return false
    }

    def descriptionColumnOf = { param ->
        param.prefix.length() + paramTag.length() + param.name.length() + param.gap
    }
    def isPaddedOnPurpose = params.any { it.gap > 1 }
    if (!isPaddedOnPurpose) {
        return false
    }

    // A lone @param has no sibling to disagree with, so only its wrapped lines can
    // have drifted away from it - and they drift towards the column it already sets,
    // which is why this path never touches the @param line itself.
    if (params.size() == 1) {
        def column = descriptionColumnOf(params[0])
        def isChanged = false
        params[0].continuations.each { continuation ->
            isChanged |= alignContinuationToColumn(block, continuation, column)
        }
        return isChanged
    }

    // Every description already starts in the same place: aligned, nothing to fix.
    if (params.collect(descriptionColumnOf).toSet().size() == 1) {
        return false
    }

    def nameWidth = params.collect { it.name.length() }.max()
    params.each { param ->
        block[param.index] = param.prefix + paramTag + param.name +
                ' ' * (nameWidth - param.name.length() + 1) +
                param.description + param.lineEnding
        def column = param.prefix.length() + paramTag.length() + nameWidth + 1
        param.continuations.each { continuation ->
            alignContinuationToColumn(block, continuation, column)
        }
    }
    return true
}

// Resolved here rather than inside the task's own closure: the selector is a project
// extra property, and reading it where this script is the enclosing scope keeps the
// lookup unambiguous. Kotlin as well as Java - KDoc uses the same @param shape, so a
// Kotlin-only repo can apply this script on its own and get the same pass.
def alignedSources = selectFormattedSourceSets().collect { sourceSet ->
    sourceSet.allSource.matching { include '**/*.java', '**/*.kt' }
}

def alignJavadocParams = tasks.register('alignJavadocParams') {
    description = 'Re-aligns the @param description column in Javadoc and KDoc ' +
            'blocks whose alignment has drifted.'
    group = 'formatting'

    // Deliberately declares neither inputs nor outputs. A formatter rewrites the very
    // files it reads, so the two would name the same set and there is nothing for an
    // up-to-date check to compare; a task asked for by hand wants to run every time
    // regardless. The lint gates have the opposite problem - they produce nothing at
    // all, so they can never be skipped - which is what lint-gate-stamp.gradle solves.

    doLast {
        def rewrittenFiles = []
        alignedSources.each { source ->
            source.each { sourceFile ->
                // Split after each newline so every line keeps its own ending; the
                // patterns capture that ending and put it back, which is what stops
                // a CRLF checkout being silently rewritten to LF.
                def originalText = sourceFile.getText('UTF-8')
                if (originalText.isEmpty()) {
                    return
                }
                def lines = originalText.split(/(?<=\n)/) as List

                def blockCount = 0
                def blockStart = -1
                def isInsideBlock = false
                lines.eachWithIndex { line, index ->
                    if (!isInsideBlock && docBlockOpenPattern.matcher(line).find()) {
                        isInsideBlock = true
                        blockStart = index
                    }
                    // Falls through to the close test on the opening line rather than
                    // skipping it: a one-line /** ... */ opens and closes in the same
                    // place, and leaving it open would run the block on to the NEXT
                    // comment's terminator, mis-scoping both.
                    if (!isInsideBlock || !docBlockClosePattern.matcher(line).find()) {
                        return
                    }
                    def block = lines[blockStart..index]
                    if (alignDocBlockParams(block)) {
                        (blockStart..index).each { position ->
                            lines[position] = block[position - blockStart]
                        }
                        blockCount++
                    }
                    isInsideBlock = false
                }
                if (blockCount > 0) {
                    sourceFile.setText(lines.join(''), 'UTF-8')
                    rewrittenFiles << "${sourceFile} (${blockCount})"
                }
            }
        }
        if (rewrittenFiles.isEmpty()) {
            logger.lifecycle('alignJavadocParams: every @param column already aligned.')
        } else {
            logger.lifecycle('alignJavadocParams: re-aligned ' +
                    "${rewrittenFiles.size()} file(s):\n  " + rewrittenFiles.join('\n  '))
        }
    }
}

// Nothing depends on it: like spotlessApply, this rewrites source and is read as a
// diff, so it must never ride along on a build. The reference keeps the task
// configured and silences the unused-variable warning.
alignJavadocParams
