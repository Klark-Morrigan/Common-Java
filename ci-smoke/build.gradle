// Applies the shared generic JVM conventions exactly as a real consumer
// would, by relative path. The conventions live one directory up, in
// Common-Java/gradle/. If java-conventions.gradle fails to evaluate, stops
// wiring up the JUnit 5 + AssertJ test stack, or changes the Java target so
// the smoke test no longer compiles/runs, this build goes red - giving the
// conventions direct CI coverage in their own repo rather than letting a
// regression surface first in a downstream mod.
apply from: "${rootDir}/../gradle/java-conventions.gradle"

group = 'commonjava.smoke'

// The shared lint gates and the on-demand formatter are build logic, so each
// carries its own TestKit integration test that drives a real Gradle build. They
// live here, in Common-Java's own proving ground, beside the conventions they
// verify - in a dedicated 'test-gradle' tree, not the unit-test one, because
// gradleTestKit() drags a log4j-over-slf4j bridge onto the runtime classpath that
// can shadow a real log4j a consumer's unit tests assert against.
sourceSets {
    testGradle {
        // Each script's suite and its .txt fixtures sit in one folder at the
        // script's own path under gradle/tasks, fixtures split into a subfolder
        // per language (java/, kotlin/, markdown/). Each folder is a source root,
        // so the suite sits in the default package (a Java package cannot carry
        // the folder's hyphens) and the fixtures resolve under the shared
        // classpath root - the language prefix plus distinct names keep them
        // from colliding there.
        //
        // Read off the tree rather than listed, because a list is a second place
        // to remember: a suite added without its entry here is never compiled
        // and never run, and a suite that never runs is indistinguishable from
        // one that passes.
        def scriptTestDirs = fileTree('src/test-gradle/tasks') { include '**/*.java' }
            .files
            *.parentFile
            .unique()
            .collect { projectDir.toPath().relativize(it.toPath()).toString().replace('\\', '/') }
            .sort()
        // The support root holds what every gate suite drives its gate through; it files no
        // fixtures, so it joins the sources alone.
        java.srcDirs = scriptTestDirs + 'src/test-gradle/support'

        resources.srcDirs = scriptTestDirs
        resources.exclude '**/*.java'
    }
}

// The TestKit tree is a test tree that Gradle's default naming does not cover,
// so the test-vocabulary gate has to be told: these are the gates' own tests,
// and half of them are about the words mocks and suites are described in.
enforceNoTestVocabulary {
    exemptSourceSet name: 'test-gradle'
}

configurations {
    // Reuse the unit-test stack (JUnit, AssertJ) without re-declaring it, while
    // keeping gradleTestKit scoped to this source set alone.
    testGradleImplementation.extendsFrom testImplementation
    testGradleRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
    testGradleImplementation gradleTestKit()
}

def testGradle = tasks.register('testGradle', Test) {

    description = 'Runs TestKit integration tests for the shared Gradle gates ' +
        'and the on-demand formatter.'

    group = 'verification'
    testClassesDirs = sourceSets.testGradle.output.classesDirs
    classpath = sourceSets.testGradle.runtimeClasspath

    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
    // The same end-of-run report 'test' prints, so a failing gate test is named at the bottom of
    // the log rather than only where it ran.
    reportTestOutcomesOf(it)

    // Every script under gradle/ is a runtime input of these tests: a suite
    // applies its script by path, and a script applies the helpers beside it.
    // Editing any of them must re-run the suites rather than leave them
    // UP-TO-DATE against a stale version. The whole tree rather than a list, so
    // a new script or helper is covered without anyone remembering to add it -
    // and it takes in detekt.yml, which the Kotlin literal gate reads by path.
    inputs.files(fileTree('../gradle') { include '**/*.gradle', '**/*.yml', '**/*.xml' })
        .withPropertyName('scriptsUnderTest')
        .withPathSensitivity(PathSensitivity.RELATIVE)

    // Where the scripts live, so a suite names its script by the path it shares
    // with its folder and does not assume a working directory.
    systemProperty 'gate.scripts.root', file('../gradle/tasks').absolutePath
}

// Every script that registers a task has a suite driving it.
//
// The one failure the suites cannot catch themselves. A gate whose suite was
// never written, or whose suite folder was moved out from under the path it
// names its script by, is a gate nothing runs - and nothing runs is what a
// passing build looks like. So the scripts are matched against the suite
// folders by path, and a script with no folder at its own path fails this build.
//
// Registering a task is what makes a script a gate rather than a helper: the
// helpers next to them define closures for the gates to use, and are exercised
// through whichever gate applies them. A helper that grows a task of its own
// becomes a gate by the same rule, and this asks it for a suite from that day.
def verifyEveryGateHasASuite = tasks.register('verifyEveryGateHasASuite') {

    group = 'verification'
    description = 'Fails the build when a script that registers a task has no TestKit suite at its path.'

    def gateScripts = fileTree('../gradle/tasks') { include '**/*.gradle' }
    def suites = fileTree('src/test-gradle/tasks') { include '**/*.java' }

    inputs.files(gateScripts)
        .withPropertyName('gateScripts')
        .withPathSensitivity(PathSensitivity.RELATIVE)

    inputs.files(suites)
        .withPropertyName('suites')
        .withPathSensitivity(PathSensitivity.RELATIVE)

    doLast {

        def coveredScriptPaths = [] as Set

        suites.visit { details ->

            if (!details.directory) {
                coveredScriptPaths << details.relativePath.parent.pathString
            }
        }

        def uncovered = []

        gateScripts.visit { details ->

            if (!details.directory && details.file.getText('UTF-8').contains('tasks.register(')) {

                def scriptPath = details.relativePath.pathString.replaceFirst(/\.gradle$/, '')

                if (!(scriptPath in coveredScriptPaths)) {
                    uncovered << scriptPath
                }
            }
        }

        if (!uncovered.isEmpty()) {

            throw new GradleException("Scripts registering a task with no suite driving them:\n  " +
                uncovered.sort().join('\n  ') +
                "\nEach needs a suite folder at its own path under src/test-gradle/tasks.")
        }
    }
}

// Every gate is wired in by java-conventions.gradle, which this project applies as a consumer
// would: each gate's task exists here, and both 'test' and 'check' depend on it.
//
// The suites apply one gate at a time, so a gate the conventions file forgot to apply passes every
// suite while no consumer runs it. Read off the scripts rather than listed, for the reason the
// suite check above is.
def verifyConventionsWireEveryGate = tasks.register('verifyConventionsWireEveryGate') {

    group = 'verification'
    description = 'Fails the build when java-conventions.gradle leaves a lint gate out of test or check.'

    def gateScripts = fileTree('../gradle/tasks/lint') { include '**/*.gradle' }
    def registeredTaskPattern = ~/tasks\.register\('([^']+)'/

    inputs.files(gateScripts)
        .withPropertyName('gateScripts')
        .withPathSensitivity(PathSensitivity.RELATIVE)

    // Read while this task is configured, when the build's wiring is complete. What a lifecycle
    // task depends on is read off its declared dependencies by name, so no gate is realised to answer.
    def readDependencyNames = { String lifecycleTaskName ->

        tasks.named(lifecycleTaskName).get().dependsOn.collect { dependency ->
            dependency instanceof TaskProvider || dependency instanceof Task ? dependency.name : dependency.toString()
        } as Set
    }

    def lifecycleDependencyNames = ['test', 'check'].collectEntries { [(it): readDependencyNames(it)] }

    def unwiredGates = []

    gateScripts.each { script ->

        script.getText('UTF-8').findAll(registeredTaskPattern) { match, taskName -> taskName }.each { taskName ->

            def missingLifecycleTasks = lifecycleDependencyNames.findAll { !(taskName in it.value) }*.key

            if (!tasks.names.contains(taskName)) {
                unwiredGates << "${taskName} (${script.name}): not applied"
            } else if (!missingLifecycleTasks.isEmpty()) {
                unwiredGates << "${taskName} (${script.name}): not run by ${missingLifecycleTasks.join(', ')}"
            }
        }
    }

    doLast {

        if (!unwiredGates.isEmpty()) {

            throw new GradleException('Gates java-conventions.gradle does not run under test and check:\n  ' +
                unwiredGates.sort().join('\n  ') +
                '\nEach needs an apply line in java-conventions.gradle.')
        }
    }
}

// Run with the rest of verification: 'check' covers 'build', which this repo's CI runs, and
// 'coverage', which a consumer's CI runs.
tasks.matching { it.name in ['check', 'coverage'] }.configureEach {
    dependsOn testGradle, verifyEveryGateHasASuite, verifyConventionsWireEveryGate
}
