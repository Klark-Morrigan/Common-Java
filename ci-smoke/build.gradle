// Applies the shared generic JVM conventions exactly as a real consumer
// would, by relative path. The conventions live one directory up, in
// Common-Java/gradle/. If java-conventions.gradle fails to evaluate, stops
// wiring up the JUnit 5 + AssertJ test stack, or changes the Java target so
// the smoke test no longer compiles/runs, this build goes red - giving the
// conventions direct CI coverage in their own repo rather than letting a
// regression surface first in a downstream mod.
apply from: "${rootDir}/../gradle/java-conventions.gradle"

group = 'commonjava.smoke'

// The shared lint gates and the on-demand formatter are build logic, so each
// carries its own TestKit integration test that drives a real Gradle build. They
// live here, in Common-Java's own proving ground, beside the conventions they
// verify - in a dedicated 'test-gradle' tree, not the unit-test one, because
// gradleTestKit() drags a log4j-over-slf4j bridge onto the runtime classpath that
// can shadow a real log4j a consumer's unit tests assert against.
sourceSets {
    testGradle {
        // Each script's test + its .txt fixtures sit in one folder named for the
        // script under test, fixtures split into a subfolder per language
        // (java/, kotlin/, markdown/). Each folder is a source root, so the
        // test sits in the default package (a Java package cannot carry the
        // folder's hyphens) and the fixtures resolve under the shared classpath
        // root - the language prefix plus distinct names keep them from
        // colliding there.
        // Read off the tree rather than listed, because a list is a second place
        // to remember: a suite added without its entry here is never compiled
        // and never run, and a suite that never runs is indistinguishable from
        // one that passes. Every folder holding a suite is a source root, which
        // is the same rule the paragraph above states, now stated once.
        def scriptTestDirs = fileTree('src/test-gradle/tasks') { include '**/*.java' }
            .files
            *.parentFile
            .unique()
            .collect { projectDir.toPath().relativize(it.toPath()).toString().replace('\\', '/') }
            .sort()
        // The support root holds what every gate suite drives its gate through; it files no
        // fixtures, so it joins the sources alone.
        java.srcDirs = scriptTestDirs + 'src/test-gradle/support'

        resources.srcDirs = scriptTestDirs
        resources.exclude '**/*.java'
    }
}

// The TestKit tree is a test tree that Gradle's default naming does not cover,
// so the test-vocabulary gate has to be told: these are the gates' own tests,
// and half of them are about the words mocks and suites are described in.
enforceNoTestVocabulary {
    exemptSourceSet name: 'test-gradle'
}

configurations {
    // Reuse the unit-test stack (JUnit, AssertJ) without re-declaring it, while
    // keeping gradleTestKit scoped to this source set alone.
    testGradleImplementation.extendsFrom testImplementation
    testGradleRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
    testGradleImplementation gradleTestKit()
}

def testGradle = tasks.register('testGradle', Test) {

    description = ('Runs TestKit integration tests for the shared Gradle gates '
        + 'and the on-demand formatter.')

    group = 'verification'
    testClassesDirs = sourceSets.testGradle.output.classesDirs
    classpath = sourceSets.testGradle.runtimeClasspath

    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
    // The same end-of-run report 'test' prints, so a failing gate test is named at the bottom of
    // the log rather than only where it ran.
    reportTestOutcomesOf(it)

    // Each script under test is a runtime input the matching test reads by
    // path, so declare it as a task input: editing one must re-run these
    // tests rather than leave them UP-TO-DATE against a stale version. The path
    // is also handed to the test so it does not assume a working directory. The
    // scripts live one directory up, under Common-Java/gradle/tasks.
    // Shared helpers are runtime inputs of these tests: both structure gates that judge a file by
    // its declared package apply the package-root reader, both formatter passes plus the blank-line
    // gate apply the source-set selector, and both test-double gates apply the naming scan. Editing
    // one must re-run them. The stamp helper is bound below instead, being the one with a test of
    // its own.

    inputs.file(file('../gradle/tasks/lint/package-roots.gradle'))
        .withPropertyName('packageRootsScript')

    inputs.file(file('../gradle/tasks/format/formatted-source-sets.gradle'))
        .withPropertyName('formattedSourceSetsScript')

    inputs.file(file('../gradle/tasks/lint/naming/tests/double-naming-scan.gradle'))
        .withPropertyName('doubleNamingScanScript')

    // One script binds three ways - as a task input, under an
    // up-to-dateness property name, and as the system property its test reads
    // the path from - and all three name the same file. Binding them together
    // keeps a new script to one call rather than a block to copy, and stops the
    // three drifting apart. Named for scripts rather than gates: the formatter's
    // aligner pass binds the same three ways and is not a gate.
    def declareScriptUnderTest = { String propertyName, String systemPropertyKey, String path ->

        def scriptUnderTest = file(path)
        inputs.file(scriptUnderTest).withPropertyName(propertyName)
        systemProperty systemPropertyKey, scriptUnderTest.absolutePath
    }

    declareScriptUnderTest(
        'alignJavadocParamsScript',
        'align.javadoc.params.script.path',
        '../gradle/tasks/format/align-javadoc-params.gradle')

    declareScriptUnderTest(
        'lintGateScript',
        'lint.gate.script.path',
        '../gradle/tasks/lint/lint-gate.gradle')

    declareScriptUnderTest(
        'docLinksGateScript',
        'doc.links.gate.script.path',
        '../gradle/tasks/lint/docs/enforce-doc-links-resolve.gradle')

    declareScriptUnderTest(
        'camelCaseTestNamesGateScript',
        'camel.case.test.names.gate.script.path',
        '../gradle/tasks/lint/naming/tests/enforce-camel-case-test-names.gradle')

    declareScriptUnderTest(
        'fakeGateScript',
        'gate.script.path',
        '../gradle/tasks/lint/naming/tests/enforce-suffix-on-fakes.gradle')

    declareScriptUnderTest(
        'mockGateScript',
        'mock.gate.script.path',
        '../gradle/tasks/lint/naming/tests/enforce-suffix-on-mocks.gradle')

    declareScriptUnderTest(
        'idCasingGateScript',
        'id.casing.gate.script.path',
        '../gradle/tasks/lint/naming/enforce-id-casing.gradle')

    declareScriptUnderTest(
        'testVocabularyGateScript',
        'test.vocabulary.gate.script.path',
        '../gradle/tasks/lint/naming/enforce-no-test-vocabulary.gradle')

    declareScriptUnderTest(
        'methodsOrderGateScript',
        'methods.order.gate.script.path',
        '../gradle/tasks/lint/structure/enforce-methods-ordered-by-visibility.gradle')

    declareScriptUnderTest(
        'packageLayeringGateScript',
        'package.layering.gate.script.path',
        '../gradle/tasks/lint/structure/enforce-package-layering.gradle')

    declareScriptUnderTest(
        'packageVocabularyGateScript',
        'package.vocabulary.gate.script.path',
        '../gradle/tasks/lint/structure/enforce-package-vocabulary.gradle')

    declareScriptUnderTest(
        'restrictedCallsGateScript',
        'restricted.calls.gate.script.path',
        '../gradle/tasks/lint/structure/enforce-restricted-calls.gradle')

    declareScriptUnderTest(
        'referencedTypesGateScript',
        'referenced.types.gate.script.path',
        '../gradle/tasks/lint/structure/enforce-referenced-types.gradle')

    declareScriptUnderTest(
        'nestedGateScript',
        'nested.gate.script.path',
        '../gradle/tasks/lint/structure/tests/enforce-tests-nested.gradle')

    declareScriptUnderTest(
        'singleBlankGateScript',
        'single.blank.gate.script.path',
        '../gradle/tasks/lint/formatting/enforce-single-blank-lines.gradle')

    declareScriptUnderTest(
        'trailingWhitespaceGateScript',
        'trailing.whitespace.gate.script.path',
        '../gradle/tasks/lint/formatting/enforce-no-trailing-whitespace.gradle')

    declareScriptUnderTest(
        'kotlinLiteralsGateScript',
        'kotlin.literals.gate.script.path',
        '../gradle/tasks/lint/literals/enforce-no-magic-literals-kotlin.gradle')

    // The Kotlin literal gate is the one that reads a second file by path, its
    // detekt.yml, so that is an input too: editing the rule must re-run the
    // test, not leave it UP-TO-DATE.
    inputs.file(file('../gradle/detekt.yml')).withPropertyName('detektConfig')
}

// Every script that registers a task has a suite driving it.
//
// The one failure the suites cannot catch themselves. A gate whose suite was
// never written, or whose suite folder was renamed out from under the tree that
// collects them, is a gate nothing runs - and nothing runs is what a passing
// build looks like. So the scripts are counted against the folders, and a script
// with no folder of its own name fails this build.
//
// Registering a task is what makes a script a gate rather than a helper: the
// helpers next to them define closures for the gates to use, are exercised
// through whichever gate applies them, and are bound above as inputs so editing
// one re-runs those. A helper that grows a task of its own becomes a gate by the
// same rule, and this asks it for a suite from that day.
def verifyEveryGateHasASuite = tasks.register('verifyEveryGateHasASuite') {

    group = 'verification'
    description = 'Fails the build when a script that registers a task has no TestKit suite.'

    def gateScripts = fileTree('../gradle/tasks') { include '**/*.gradle' }
    def suiteFolders = fileTree('src/test-gradle/tasks') { include '**/*.java' }

    inputs.files(gateScripts).withPropertyName('gateScripts')
    inputs.files(suiteFolders).withPropertyName('suiteFolders')

    doLast {

        def coveredScriptNames = suiteFolders.files*.parentFile*.name.unique()

        def uncovered = gateScripts
            .findAll { it.text.contains('tasks.register(') }
            .collect { it.name.replaceFirst(/\.gradle$/, '') }
            .findAll { !(it in coveredScriptNames) }
            .sort()

        if (!uncovered.isEmpty()) {

            throw new GradleException("Scripts registering a task with no suite driving them:\n  "
                + uncovered.join('\n  ')
                + "\nEach needs a folder of its own name under src/test-gradle/tasks.")
        }
    }
}

// Run with the rest of verification: 'check' covers a local 'build', and
// 'coverage' is the task CI invokes.
tasks.matching { it.name in ['check', 'coverage'] }.configureEach {
    dependsOn testGradle, verifyEveryGateHasASuite
}
