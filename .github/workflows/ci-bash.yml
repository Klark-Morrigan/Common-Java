# Delegates to the shared bash CI workflow in Common-Automation. It
# shellchecks production bash (.github/), runner bash (scripts/), and git
# hooks; verifies the +x bit on every tracked *.sh; and runs every *.bats
# suite under the repo. Empty surfaces auto-skip with ::notice::. Here that
# covers the pre-commit hook, the tier declarations under .github/lib/, the
# scripts/ runners and their imports/, and the bats suites beside them.
name: Common-Automation

on:
  pull_request:
  workflow_dispatch:

# The lint and test steps only read the checkout; the token gets nothing more,
# whatever the repository default grants.
permissions:
  contents: read

jobs:
  ci-bash:
    uses: Klark-Morrigan/Common-Automation/.github/workflows/ci-bash.yml@master
