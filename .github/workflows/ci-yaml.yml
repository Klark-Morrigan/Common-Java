# CI for this repo's YAML surfaces, through Common-Automation's reusable
# ci-yaml workflow; its header names the checks it runs.
name: Common-Automation

on:
  pull_request:
  workflow_dispatch:

# The linters only read the checkout; the token gets nothing more, whatever the
# repository default grants.
permissions:
  contents: read

# No concurrency block here: the called workflow carries its own, which
# cancels a pull request's superseded run. A second group here would only
# duplicate it, and one named the same would deadlock against it.
jobs:
  ci-yaml:
    uses: Klark-Morrigan/Common-Automation/.github/workflows/ci-yaml.yml@master
