# CI for this repo's YAML surfaces. Delegates to the reusable workflow in
# Common-Automation, which runs yamllint, actionlint and action-validator as
# sequential steps of one job. Each step auto-skips when its target surface is
# absent.
name: Common-Automation

on:
  pull_request:
  workflow_dispatch:

# The linters only read the checkout; the token gets nothing more, whatever the
# repository default grants.
permissions:
  contents: read

jobs:
  ci-yaml:
    uses: Klark-Morrigan/Common-Automation/.github/workflows/ci-yaml.yml@master
